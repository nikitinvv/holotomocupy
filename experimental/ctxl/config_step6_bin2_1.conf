path=/eagle/APS_IRI/vnikitin/20260516/ctxl # raw data root
path_out=/eagle/APS_IRI/vnikitin/20260516/ctxl_rec # output directory
pfile=ctxl_HT6d_4K_008p5nm_0001                                     # scan prefix name

nchunk=16              # projections per GPU batch
ntheta=4000           # number of projection angles
start_theta=0         # index of first projection angle
ndist=6               # number of distances

niter=513             # number of iterations
start_iter=0          # resume from this iteration (0 = start fresh)
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size (pixels)
n=1024                # horizontal detector size (pixels)
nzobj=2048            # vertical object size (pixels)
nobj=2048             # horizontal object size in x and y (pixels)
bin=2                 # binning level (0 = full resolution, should correspond to log2(detector_size/n) if no cropping)

rotation_center_shift=6.5604  # px offset from centre @ nobj resolution; from Peter's {pfile}_/{pfile}_rec_.par: ROTATION_AXIS_POSITION - NUM_IMAGE_1/2 = 2054.5604 - 4096/2
paganin=60            # delta/beta ratio for Paganin phase retrieval
obj_dtype=complex64   # object array dtype: float32 or complex64
mask=-1               # circular mask radius as fraction of n (-1 = no mask)
shift_type=cubic
lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight
rho=1,0.05,0.02       # gradient step scales: object, probe, positions

log_level=INFO
