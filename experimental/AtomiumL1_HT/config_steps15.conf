# AtomiumL1, HT scan, 14 nm, 4 distances -- ESRF ID16A, proposal ihmi1591,
# beamtime 2025-06-07/08 (the .info files say "Sun Jun 08 19:10:25 2025"),
# on tomo5 at /data3/vnikitin/ESRF/atomium/20250607/AtomiumL1.
#
# Same sample and same optics as AtomiumL1_largedisp (energy, propagation
# distances and detector pixel size are read straight out of the per-distance
# HDF5, so nothing here duplicates them); the difference is that this scan has
# 4 distance planes and small +-12.5 px random displacements, where largedisp
# has 1 plane and +-300 px ones.
#
# Distance directories globbed by steps15.py:
#     <path>/<pfile>_[1-4]_/
# i.e. /data3/vnikitin/ESRF/atomium/20250607/AtomiumL1/AtomiumL1_HT_014nm_[1-4]_/
# The aux directory AtomiumL1_HT_014nm_/ (no digit) is NOT matched by that
# glob, which is what we want -- it holds rhapp.mat and the ESRF PyHST
# reconstruction, both read separately (see rotation_center_shift below).

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1                                     # raw data root (holds <pfile>_[1-4]_/ and <pfile>_/)
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_HT_014nm_rec      # output directory
pfile=AtomiumL1_HT_014nm                                                # scan prefix name

# Geometry, as printed by `python show_geometry.py config_steps15.conf`
# (verified against the raw data on 2026-08-22):
#     ndist=4   ntheta=1800   detector 2048x2048   nref=21   ndark=20
#     energy=33.35 keV   focus-to-detector=1.289 m   sx0=1.280 mm
#     z1        = 6.113 / 6.375 / 7.424 / 9.602 mm
#     magnif.   = 210.86 / 202.20 / 173.63 / 134.24
#     norm_mag  = 1 / 0.95890 / 0.82341 / 0.63664
#     distances = 6.084 / 5.833 / 5.005 / 3.863 mm
#     voxelsize = 14.00 / 14.60 / 17.00 / 21.99 nm
# These match the .info header (Energy=33.35, PixelSize=0.014, TOMO_N=1800,
# REF_N=21, DARK_N=20, Dim=2048x2048).

start_step=5          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp

# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so the pair below produces bins 2 (4x4), 1 (2x2) and 0 (1x1) -- exactly the
# three levels the config_step6_bin{2,1,0}.conf files reconstruct.
nlevels=3             # 2048 / 1024 / 512
start_level_rec=2     # FINEST binning level to reconstruct (0 = full resolution)
                      # Disk cost of including bin 0, on top of the ~120 GB of
                      # bin-0 projections step 1 writes:
                      #   step 4 binned projections
                      #     bin0 1800 x 4 x 2048^2 x 4 B = 120 GB
                      #     bin1                          =  30 GB
                      #     bin2                          = 7.5 GB
                      #   step 5 object volume (complex64 = 8 B/voxel)
                      #     bin0 3264^3 x 8 B = 278 GB
                      #     bin1 1632^3 x 8 B =  35 GB
                      #     bin2  816^3 x 8 B = 4.3 GB
                      # ~600 GB in total; /data3 had 94 TB free on
                      # 2026-08-23, so this fits.  Set start_level_rec=1 to stop
                      # at the 2x2 level if that changes.

nchunk=8              # z-slices per GPU chunk in FBP (step 5)

n=2048                # detector crop size at full resolution (bin 0).
                      # Equals the full EDF frame, so nothing is cropped; set
                      # explicitly rather than auto-detected so the value is
                      # visible next to nobj.
nobj=2048             # stitched object size at full resolution (bin 0).
                      # This is exactly what steps15 would auto-compute:
                      #   ceil(2048 / 0.63664 / 64) * 64 = 3264,
                      # i.e. the bin-0 detector footprint of the FARTHEST plane
                      # (the one with the smallest norm_magnification) rounded
                      # up to a multiple of 64.  The +-12.5 px encoder
                      # displacements from correct.txt are far inside that
                      # margin, so no extra padding is needed -- unlike
                      # AtomiumL1_largedisp, where they reach +-300 px.
                      # 3264 = 51*64; 3264/2 = 1632, 3264/4 = 816, so it bins
                      # cleanly over all three levels.

rotation_center_shift=-14.375964  # rotation axis offset from grid centre (pixels)
                      # Taken from the ESRF PyHST reconstruction of this very
                      # scan, AtomiumL1_HT_014nm_/AtomiumL1_HT_014nm_rec_.par:
                      #     ROTATION_AXIS_POSITION = 1009.624036
                      #     NUM_IMAGE_1 = 2048        (full resolution)
                      # so the offset from the grid centre 2048/2 = 1024 is
                      #     1009.624036 - 1024 = -14.375964 px.
                      # Always given in FULL-RESOLUTION (bin 0) detector pixels:
                      # steps15 and reader.py both apply it as
                      #     r[...,1] += rotation_center_shift/2**bin + 0.5*(1/2**bin - 1)
                      # so the same number goes into every config_step6_bin*.conf
                      # unchanged, whatever bin is used there.  It is also
                      # independent of nobj, since the detector footprint is
                      # centred in the object grid.
                      # CONFIRM: PyHST's axis convention has been assumed to be
                      # the same pixel indexing as ours (as it was for Y350a).
                      # Worth one bin-2 step-5 FBP slice to eyeball before
                      # committing to the bin-0 run.
paganin=120           # delta/beta ratio for multi-distance Paganin (step 5).
                      # Carried over from the AtomiumS2 configs -- same proposal
                      # (ihmi1591-AtomiumS2), same kind of sample.  CONFIRM on a
                      # bin-2 FBP slice; Y350a uses 60 for a different sample.
ref_dist=0            # reference distance index for motion-shift baseline (step 3)
log_level=INFO        # DEBUG, INFO, WARNING, ERROR

# --- Shift sources present in the raw directories (checked 2026-08-22) ------
#   correct.txt          in all four <pfile>_[1-4]_/   (1801 rows, +-12.5 px)   YES
#   correct_motion.txt   in <pfile>_1_/                                          YES
#   rhapp.mat            in <pfile>_/                                            YES
#   correct_correct3D.txt in <pfile>_/                                           no -> zeros
#   shrink_list.mat      in <pfile>_[1-4]_/                                      no -> shrink = 0
# The last two are optional; steps15 logs a warning and uses zeros.  This is the
# same set Y350a_HT ran with.
