path=/eagle/APS_IRI/vnikitin/20260829/ctxl            # raw data root
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec   # steps15 output
pfile=ctxl_FT_4K_RD300_007p5nm_0003                   # scan prefix name

# ---------------------------------------------------------------------------
# ctxl (cortex), SINGLE-distance FT scan with +-300 px random sample
# displacement, 7.5 nm voxels -- ESRF ID16A, proposal ihls3888, 2026-08-29..31.
# Same sample, same plane and the same geometry as the 4-distance scan in
# ../ctxl_HT_4K_RD300_007p5nm; that folder is the reference for everything the
# two have in common, and this one only writes down what differs.
#
# WHICH SCAN.  The beamline made three attempts:
#   _0001  ABORTED at 82.845 deg -- 5524 of 12000 projections, no end-of-scan
#          flats, no post-scan retakes.  Under 180 deg means no tomogram, no
#          exactly-opposed pair for the rotation axis and no retakes for the
#          drift or the shrinkage, so it is unusable for anything but a data
#          smoke test.  `python show_geometry.py config_steps15.conf --pfile
#          ctxl_FT_4K_RD300_007p5nm_0001` prints the ABORTED banner.
#   _0002  aborted immediately; no scan directories at all.
#   _0003  COMPLETE.  12000 projections 0..179.985 deg plus frame 12000 at
#          exactly 180.000 and post-scan retakes at 90 and 0 deg; 20 darks,
#          20 start flats, 20 end flats.  This is the one reconstructed here.
# Point `pfile` at a different attempt and everything downstream follows; the
# scripts read ntheta, ndist and the frame count out of the scan itself.
#
# WHERE THE PIXELS ARE -- THE THIRD LAYOUT FLAVOUR.  Unlike the HT scan next
# door, this one was never converted to EDF: there is no <pfile>_1_/ directory,
# no .info sidecar, and nothing at all from Peter's octave pipeline (no
# <pfile>_/ directory, hence no rhapp.mat, no correct_motion.txt, no quali.mat
# and no ht_<pfile>.m driver).  What does exist is the NXtomo nxtomomill wrote,
#     <pfile>/projections/<pfile>_0001.nx
# which carries the geometry, the rotation angles and an image_key, and whose
# detector/data is an HDF5 VIRTUAL dataset pointing at the raw detector files
#     RAW_DATA/ctxl/<pfile>/scanNNNN/balor_XXXX.h5
# That is where steps15.py reads its frames from, through esrf_layout.Layout;
# see that module's docstring for the mapping and for the reason the virtual
# dataset CANNOT be read directly on our copy of the tree (the stored relative
# paths assume a PROCESSED_DATA level that the copy does not have, and HDF5
# answers an unresolvable source with silent zeros rather than an error).
#
# Nothing has to be copied or renamed in the raw tree.
#
# Scan geometry -- read off the real data with
#     python show_geometry.py config_steps15.conf
#   ndist=1   ntheta=12000   detector 4096x4096   nref=20   ndark=20
#   energy = 17.1 keV        detector pixel = 1.47601 um
#   focus->detector = 1212.9965 mm
#   z1     = 6.163535 mm     mag = 196.80x    voxel = 7.500 nm
#   propagation distance = 6.1322 mm,  norm_magnifications = [1.0]
# identical to plane 1 of the HT scan, as it should be -- same optic
# (Optic_used=1.47601), same energy, same focal position.  There is no .info
# sidecar to cross-check the voxel size against; the NXtomo's own
# sample/x_pixel_size is used instead (info_check falls back to it), which is a
# weaker check because the same writer produced both.  The strong check is that
# these numbers reproduce plane 1 of the HT scan to 7 digits, and THAT scan's
# four planes did reproduce four independent .info PixelSize values exactly.
#
# WHAT IS AND IS NOT CORRECTED, at ndist=1:
#   random displacement   <pfile>/projections/<pfile>_0001.txt, 12003 rows,
#                         +-300 px, zero at frames 0 / 6000 / 11999 and at the
#                         three retakes -- the same structure as the HT scan.
#   rhapp                 NOT APPLICABLE.  rhapp.mat registers distance planes
#                         against each other and there is only one plane.
#                         Step 3 logs "rhapp.mat not found, using zeros"; that
#                         warning is expected here and means nothing is wrong.
#   correct_motion.txt    NOT PROVIDED by ESRF -- they never ran their pipeline
#                         on this scan -- so it was MEASURED HERE and the result
#                         is checked in beside this config as ./correct_motion.txt
#                         (12003 rows x 2).  INSTALL IT BEFORE RUNNING:
#                             cp correct_motion.txt <path>/<pfile>/projections/
#                         Without it step 3 logs "correct_motion.txt not found,
#                         using zeros", which is still a valid run -- it just
#                         leaves the 1.8 px of vertical drift in.
#                         NOTE that at ndist=1 with no rhapp and no correct3D,
#                         shifts_final telescopes to raw_motion -- step 3 forms
#                         (correct_motion - random[ref_dist]) and adds the
#                         random displacement straight back -- so
#                         correct_motion.txt REPLACES the random displacement
#                         rather than adding to it, and must therefore be the
#                         random displacement PLUS the drift, in raw detector
#                         pixels.  estimate_motion.py writes exactly that; this
#                         is the same arrangement as ../Y350a_largedisp_006nm.
#                         How it was measured, from the two post-scan retakes
#                         (--template 48 --zero-x, six crops 1024..2304):
#                             retake 12001 (omega=90) vs frame 6000:
#                                 dy = +0.95, dx = +0.10  (MAD 0.02 px)
#                             retake 12002 (omega= 0) vs frame    0:
#                                 dy = -0.83, dx = +0.04  (MAD 0.02 px)
#                             fitted drift: y  1.809 px ptp, rms 0.472
#                                           x  ZEROED
#                         The vertical figure reproduces the HT scan's own
#                         retake measurement (1.572 px ptp) on the same sample
#                         over the same duration, which is the cross-check.
#                         --zero-x: the horizontal drift measures 0.10 px ptp,
#                         i.e. 0.75 nm at a 7.5 nm voxel, and the horizontal
#                         column is exactly degenerate with the rotation axis.
#                         Zeroing it keeps that degeneracy out of the file, so
#                         rotation_center_shift below is the same number with
#                         correct_motion.txt installed or absent.  (This is the
#                         opposite situation to the HT scan, whose ESRF-supplied
#                         file carries 2.1 px in that column that the retakes do
#                         NOT see -- their axis correction folded in.)
#   correct3D             none from ESRF -- BORROWED from the AtomiumS1 FT
#                         scan, row for row x 0.6.  See correct3d_bin below.
#   shrinkage             MEASURED from this scan's own retakes and found to be
#                         absent -- every scale term within 2 sigma of zero, see
#                         rho[tp] in config_step6_bin2.conf for the numbers.
#   probe                 MEASURABLE, unlike the HT scan next door: this scan's
#                         NFP companion (20 darks + 50 frames) has its RAW_DATA
#                         on eagle, so step0.py + config_step0.conf in this
#                         folder retrieve the probe.  Run it, then uncomment
#                         prb_file in config_step6_bin2.conf.  Until then step 6
#                         starts from a flat probe and refines it.

start_step=5          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so step 4 writes binned projections for bins 2 (4x4), 1 (2x2) and 0 (1x1) --
# the three levels the config_step6_bin{2,1,0}.conf files reconstruct -- while
# step 5 writes a Paganin+FBP init only for the levels from start_level_rec up.
nlevels=1             # 4096 / 2048 / 1024
start_level_rec=0     # FINEST binning level to give an FBP INIT (2 = 4x4 only).
                      # Only bin 2 needs one: it is the first rung of the step-6
                      # ladder, and bins 1 and 0 are seeded from the checkpoint
                      # the level below wrote, not from FBP.  Matches ctxl_HT
                      # and AtomiumS1_HT.  Set 0 to also get full-resolution
                      # FBP volumes for inspection; that costs the 885 GB below.
                      # Disk, at ndist=1:
                      #   step 1  <pfile>.h5     12000 x 4096^2 x 2 B  = 402 GB
                      #   step 4  bin-0 pdata    12000 x 4096^2 x 4 B  = 805 GB
                      #   step 5  <pfile>_obj.h5 4800^3 x 4 B x 2      = 885 GB
                      # 1.2 TB as configured, 2.1 TB with start_level_rec=0,
                      # against 231 TB free on eagle as of 2026-09-01.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from the frame shape; >0 overrides the crop
nobj=4800             # stitched object size at full resolution (bin 0).
                      # The grid has to hold the SAMPLE plus the whole
                      # displacement sweep.  At ndist=1 norm_mag = 1 exactly, so
                      # the commanded +-300 DETECTOR px are +-300 OBJECT px and
                      # 4096 + 2*300 = 4696, rounded up to 4800 = 75*64.
                      # 4800/2 = 2400 and 4800/4 = 1200, so it bins cleanly over
                      # all three levels.
                      #
                      # 4800, not the 4736 used before 2026-09-07: the drift in
                      # correct_motion.txt and the borrowed correct_correct3D.txt
                      # add ~28 px on top of the +-300 px sweep, and
                      # check_data_read.py measured the worst-angle reach at
                      # 2375.7 px, 8 px past 4736/2.  4800 puts it back inside
                      # with 24 px to spare.  Costs 4 % of the volume.
                      #
                      # This is the one place the single-distance scan is easier
                      # than the 4-distance one: with a single plane there is no
                      # demagnified plane whose detector footprint overflows the
                      # grid, so the margin (4800-4096)/2 = 352 px covers the
                      # 300 px sweep and the ~28 px of drift and correct3D on
                      # top of it, and Rec._build_data_mask should
                      # keep ~1.000 of the detector pixels at every angle.  If
                      # it logs anything much below 1.0, something else is
                      # wrong -- most likely a shift file in the wrong units.

rotation_center_shift=+9.80  # MEASURED 2026-09-08 FROM THE POST-SCAN RETAKES.
                      # Convention (spelled out in ../Y350a_HT/config_steps15.conf):
                      #     rotation_center_shift = c - n/2
                      # with c the axis column on the bin-0 detector grid.
                      # MUST stay equal to the value in all three
                      # config_step6_bin*.conf.  Re-quoting costs only
                      # start_step=5 -- steps 1-4 never see the axis.
                      #
                      # THE MEASUREMENT.  A finished ID16A scan writes three
                      # extra frames after the last scan point, at omega =
                      # 180, 90 and 0.  Frames 12002 and 12000 are the
                      # omega=0 and omega=180 retakes -- exactly opposed and
                      # written seconds apart, against the 2 h 33 min that
                      # separates the (0, 12000) scan pair.
                      #     python estimate_center.py config_steps15.conf \
                      #            --retakes on --bands 4
                      #     12002/12000 band 0: dy=+0.20  shift= +9.45
                      #     12002/11999 band 0: dy=+6.89  shift= +9.45
                      #     12002/11999 band 1: dy=+4.00  shift=+10.44
                      #     12002/11999 band 2: dy=+8.08  shift= +9.93
                      #     rotation_center_shift = +9.82 +- 0.41 px
                      # (4 of 8 band estimates kept; the rest fail |dy|<=15,
                      # which is the geometry's own consistency test.)
                      # Rounded to +9.80.
                      #
                      # THE SIGN IS USED AS PRINTED, NOT NEGATED.  Checked
                      # against the two scans where ESRF states the axis
                      # outright, with the same command:
                      #     ctxl_HT       -20.09 +- 1.12  vs nabu -15.77
                      #     AtomiumS1 FT  +13.34 +- 1.60  vs nabu +10.74
                      # Same sign both times, ~4 px accuracy, no consistent
                      # bias -- a negation would have put them 30 and 24 px
                      # out.  So the honest band here is about +6 to +14.
                      # Neither control applies correct_correct3D.txt either,
                      # whose horizontal column averages the same +1.64 raw
                      # px on ctxl_HT and here, so that term is already
                      # inside those errors.
                      #
                      # WHAT THIS REPLACED.  -15.77, which is ctxl_HT's nabu
                      # value ((1599.613741 - 1607.5) x 2), borrowed by
                      # instruction because this scan has no naburec/ and no
                      # PyHST .par of its own.  It is 25.6 px away.  The FT
                      # stage position is simply different from the HT one --
                      # exactly as on AtomiumS1, where the HT scan sits at
                      # +44.20 and the FT scan at +10.74.  This scan's +9.8
                      # lands on AtomiumS1_FT's +10.74, so both FT scans of
                      # this beamtime put the axis near +10.
                      #
                      # CORROBORATION, weaker, on the unbinned Paganin frames
                      # in <pfile>_proj.h5:/exchange/proj_bin0 (1200 stitched
                      # frames, every 10th angle, 4800 x 4800): opposed-pair
                      # mirror over 10 pairs with unwhitened 1-D column-
                      # profile matching gives +7.3 +- 3.7, and the
                      # correlation-free centre-of-mass landmark -0.9.  Soft,
                      # because the NCC peak is a 32 px plateau on data this
                      # smooth, but consistent.  Note the opposed partner
                      # there is (j, 1199-j): the saved stack spans 0..179.85
                      # deg, so (i, i+600) is 90 deg, not 180.
                      #
                      # WHAT DOES NOT WORK ON THIS SCAN, so as not to retry:
                      # an FBP focus sweep on a slice from proj_bin0 (tv, g95
                      # and entropy all run to the edges of a -256..+44 sweep
                      # -- paganin=60 leaves nothing to focus on); the mirror
                      # on angular differences, which cancels the static halo
                      # exactly in principle but is pure stitch noise at
                      # 0.15 deg spacing; and 2-D Hann-windowed correlation,
                      # which reads -8.3 because the mirror-symmetric halo
                      # pulls the peak toward zero shift.
                      #
                      # The axis is not entangled with correct_motion.txt
                      # here: that file's horizontal column is bit-for-bit
                      # the random displacement (--zero-x, see below), and
                      # only the horizontal column is degenerate with the
                      # axis.
paganin=60            # delta/beta ratio for Paganin (step 5).  Same value as
                      # the HT scan of the SAME SAMPLE at the same energy, and
                      # for the same reason: 60, not the delta_beta=20 Peter's
                      # HT driver used.  20 leaves the step-5 volume too noisy
                      # to be a useful starting point; 60 smooths it without
                      # flattening the boundaries step 6 then sharpens.  There
                      # is no driver for THIS scan to read a value from anyway.
                      # MUST match paganin in all three config_step6_bin*.conf:
                      # step 5 writes /exchange/obj_init_re{paganin}_{bin} and
                      # step 6 reads that exact name -- changing it here without
                      # changing them makes step 6 fail on a missing dataset.
                      #
                      # Single-distance Paganin is a much weaker starting point
                      # than the 4-distance version -- one propagation distance
                      # cannot separate phase from absorption, so the transport
                      # filter is doing the whole job.  Expect the bin-2 stage
                      # of step 6 to have more work to do than it did on the HT
                      # scan, and check obj_init before trusting the ladder:
                      #     python show_slices.py config_steps15.conf --init
rhapp_bin=1           # unused: there is no rhapp.mat at ndist=1.  Pinned to 1
                      # rather than left at the 0 (auto) default only so a run
                      # never depends on looking for a driver that is not there.
correct3d_bin=2       # scales correct_correct3D.txt from the 2x2 binned grid
                      # ESRF fits on to our raw px.  2 because every ESRF fit
                      # for this beamtime is binned 2 (ht_<pfile>.m sets
                      # bin_factor = 2 and <pfile>_rec_.info records
                      # PixelSize = 2 x the scan voxel).
                      #
                      # BUT THE FILE IS BORROWED.  ESRF has produced no
                      # <pfile>_/ drop for this scan.  The directory was created
                      # by hand and correct_correct3D.txt written from the OTHER
                      # FT SCAN's file
                      #     AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_/
                      #         correct_correct3D.txt      (Peter's, 12001 rows)
                      # copied ROW FOR ROW and multiplied by 4.5/7.5 = 0.6.
                      #
                      # Row for row because the two FT scans share an angle
                      # list: angles_file.txt is 0..180 deg in 0.0149... deg
                      # steps, 12001 unique angles, the same in both.  Nothing
                      # is interpolated -- unlike the file this replaced.
                      # The 0.6 because the file is in ESRF's own 2x2-binned
                      # RECONSTRUCTION px, 9 nm for AtomiumS1 against 15 nm
                      # here; at face value it would be applied at 167% size.
                      # The factor is measurable, not just nominal: least-
                      # squares fitting Peter's ctxl_HT file against Peter's
                      # Atomium_S1_FT file gives 1.66667 = 7.5/4.5 exactly on
                      # the horizontal column, residual 0.0040 px rms out of a
                      # 34 px range -- one physical curve, two unit systems.
                      # The result is ptp 20.510 x 12.325 binned px against
                      # ctxl_HT's own 20.503 x 12.337; that is the sanity check.
                      # See README_provenance.txt next to it, and the verbatim
                      # source kept as correct_correct3D_S1FT_source.txt.
                      # correct_correct3D.txt.bak_20260907-220522 (+ the
                      # _HT_source and .bak_premean files) is the superseded
                      # resample of ctxl_HT onto these angles.
                      #
                      # That transplant assumes the correction is a property of
                      # the ROTATION -- stage wobble, axis tilt -- and so
                      # repeats between scans on the same stage.  The
                      # horizontal column supports that strongly (above); the
                      # vertical is weaker, the same fit giving 1.612 with a
                      # 0.65 px rms residual, so ~3% of its range is per-scan.
                      # And the part that is slow drift over scan time does NOT
                      # repeat, and is being transplanted as if it did.  So
                      # this is a starting point for step 6 to refine
                      # (rho[pos] > 0 at every level), not a measurement of
                      # this scan.  ptp is 20.5 x 12.3 binned px = 41 x 25
                      # raw px, well inside the 352 px grid margin, so a wrong
                      # transplant costs convergence speed, not validity.
                      # Its horizontal MEAN is +1.64 raw px, degenerate with
                      # rotation_center_shift -- and the axis above does NOT
                      # include it: estimate_center.py works on raw holograms
                      # with only the random displacement undone.  That is the
                      # same footing as the two ESRF controls quoted there,
                      # whose correct3D horizontal means are the same +1.64, so
                      # the term is inside their ~4 px errors rather than
                      # unaccounted for.
                      # DELETE the file the moment Peter drops a real one,
                      # and CHECK <pfile>_rec_.info then: PixelSize / voxel
                      # size IS the factor.
                      #
                      # The correct_motion.txt this scan does read, from
                      # <pfile>/projections/, is the one estimate_motion.py
                      # wrote here on 2026-09-01, not Peter's -- it is already
                      # in raw px and must NOT be scaled.
ref_dist=0            # reference distance index (0-based).  There is exactly
                      # one plane, so this can only be 0.
log_level=INFO
