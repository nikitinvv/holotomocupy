# Atomium S1, SINGLE-distance FT, +-300 px random displacement, 4.5 nm voxels
# -- ESRF ID16A, proposal blc17322, beamtime 20260825, scan _0001.
# BH reconstruction (step 6) -- hierarchical level bin=0 (1x1, full resolution).
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1024   0           513     513
#   config_step6_bin1.conf  1    2048  2048   512         769     257
#   config_step6_bin0.conf  0    4096  4096   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter)
# and Reader.read_checkpoint upsamples obj, prb and pos from the previous
# level's grid.  Iteration numbering is cumulative across the whole ladder, and
# checkpoint_step=32 divides every start_iter and every niter-1 so the handoff
# checkpoints are guaranteed to exist.
#
#   qsub polaris_run.sh                                    # all four stages
#   qsub -v CONFIG=config_step6_bin0.conf polaris_run.sh   # or one at a time
#
# THIS LEVEL WILL NOT FIT IN ONE DEBUG-QUEUE JOB.  257 iterations at full
# resolution is the expensive end of the ladder, and both queues this folder
# targets (debug, 2 nodes; debug-scaling, 10 nodes) cap at 1 h of walltime.
# That is fine and needs no special handling: checkpoint_step=32 means the run
# leaves a checkpoint every 32 iterations, so resubmit with start_iter raised to
# the last one that landed --
#     ls <path_out>/checkpoints/ | tail -1
# -- until it reaches 1024.  Nothing else changes between resubmissions.
#
# EVERY LONG NOTE LIVES IN config_step6_bin2.conf -- what this scan is, why
# there is no measured probe, where rotation_center_shift came from, why
# rho[tp] is zero, and why mask_oob has nothing to drop at ndist=1.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec   # steps15 output dir
in_file=Atomium_S1_FT_4K_RD300_004p5nm_0001.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec6  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file is NOT set here and must not be: this level inherits obj, prb and
#       pos from the bin-1 checkpoint named by start_iter below.

nchunk=4              # projections per GPU batch -- lower it first if bin 0 runs out of
                      # GPU memory.  Chunk memory goes as nchunk*ndist*nz*n; at
                      # 4x the pixels of bin 1 this would be 2, but ndist=1 buys
                      # back the factor, so 4 fits.
ntheta=12000          # projection angles, 0..179.985 deg in 0.015 deg steps
start_theta=0         # index of first projection angle
ndist=1               # number of distances (z1 = 3.698060 mm)

niter=1537            # runs iterations 1280..1536
start_iter=1280        # resumes from checkpoints/checkpoint_1280.h5, written by the bin-1 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=4096               # vertical detector size   = 4096 / 2**0
n=4096                # horizontal detector size = 4096 / 2**0
nzobj=4096            # vertical object size     = 4096 / 2**0
nobj=4096             # horizontal object size   = 4096 / 2**0
bin=0                 # binning level; needs start_level_rec <= 0 in config_steps15.conf
                      # -- and it is NOT: config_steps15.conf sets
                      # start_level_rec=2.  Deliberate: at start_iter=1280 this
                      # level takes its object from the bin-1 checkpoint and
                      # never reads obj_init.  Writing a bin-0 Paganin volume
                      # would cost 4096^3 x 4 B x 2 = 550 GB for something
                      # nothing reads.

rotation_center_shift=10.74  # was 18.70.  Taken 2026-09-07 from ESRF's own
                      # nabu parameters -- nabu_final.conf says
                      # rotation_axis_position = 1028.87 on the 2048-wide
                      # (2x2 binned) <pfile>_rec_.nx, i.e.
                      # (1028.87 - 1023.5) x 2 = +10.74 raw px -- which lands
                      # 0.35 px from the opposed-pair mirror measurement
                      # (+10.39 +- 1.69) on this stitch.  Full derivation and
                      # the three cross-checks in config_steps15.conf.
                      #
                      # These three MUST match config_steps15.conf: step 5
                      # stitches srdata -- hence obj_init -- with its value and
                      # step 6 adds this one to every position it reads, so a
                      # mismatch silently puts the object init and the geometry
                      # several px apart.
paganin=20            # MUST match paganin in config_steps15.conf.  Not actually
                      # read at this level -- the object comes from the previous
                      # checkpoint -- but kept equal so the four configs cannot
                      # drift apart.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour.
                      # At ndist=1 the kept fraction should be ~1.000; anything
                      # much lower means a shift file is in the wrong units.
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight -- OFF at full
                      # resolution.  The ladder uses it to keep the coarse levels
                      # from wandering; at bin 0 it would only cost resolution,
                      # which is the entire point of running this level.
rho=1.0,0.0125,0.16,0.0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # rho[tp] = 0 because the shrinkage is measured, not
                      # assumed -- numbers and reasoning in
                      # config_step6_bin2.conf.  If estimate_rho ran at bin 2,
                      # copy its winning rho[prb] and rho[pos] here by hand; they
                      # are not stored in the checkpoint.
estimate_rho=False    # only worth running at bin 2 -- see config_step6_bin2.conf
rho_estimate_niter=16 # iterations per trial
log_level=INFO
