# Reconstruction of the synthetic mosaic dataset written by gen_data.py.
#
#   ./run_step6.sh               # NP ranks, one per GPU
#   NP=8 ./run_step6.sh
#
# The input is what config_gen.conf produced and what config_steps15.conf turned
# into an initial object, so path_out/pfile/bin/paganin MUST match both files.
# Checkpoints and the reconstructed object are written back into the same
# directory, as in experimental/Y350a_dist1234.

path_out=/data3/vnikitin/holobrain_syn   # = config_gen.conf path_out; also where checkpoints go
pfile=holobrain_syn                      # -> path_out/holobrain_syn_<tile>.h5, one file per tile,
                                         #    and the shared holobrain_syn_obj.h5
# prb_file=holobrain_syn_prb.h5            # ground-truth probe from gen_data.py, relative to path_out
#                                          # comment out to start from a flat probe (=1) instead

init_vol=                                # optional raw float32 .vol initial object; empty -> read
                                         # obj_init_re{paganin}_{bin} + 1j*obj_init_im{paganin}_{bin}
                                         # from holobrain_syn_obj.h5, which steps15.py writes
                                         # (mosaic stitch -> Paganin -> FBP).  Set
                                         # write_obj_init=true in config_gen.conf instead to
                                         # start from a ZERO object and skip steps15.py.

nchunk=4              # projections per GPU batch; raise if GPU memory allows
ntheta=1500            # angles used, thinned evenly from the 3000 in the file
                      # (ids = arange(start_theta, 3000, 3000/ntheta)), so the
                      # full 180 deg is still covered.  Raise toward 3000 as the
                      # host RAM below allows.  steps15.py uses the same rule, so
                      # ntheta_rec= there must EQUAL this number, see that file.
start_theta=0
ndist=4               # distances PER TILE; step6.py expands to 4 x 10 = 40,
                      # tile-major (flat index = tile*4 + k), as in config_step6

# The tile files, in the order they are flattened onto the distance axis. Must
# match the names in shifts/tile_offsets.txt that make_geometry.py wrote and
# gen_data.py used, i.e. "{row}_{col}" row-major, row 0 on top and column 0 on
# the left.
tiles=0_0,0_1,0_2,0_3,0_4  #,1_0,1_1,1_2,1_3,1_4
                      # in tile-major order: flat index = tile*4 + k

niter=1025
start_iter=0          # resume from this iteration (0 = start fresh / latest checkpoint)
checkpoint_step=32
error_step=32

nz=512                # detector 2048 >> bin 2
n=512
nzobj=1472            # config_gen.conf nzobj 5888 / 2**bin
nobj=3072             # config_gen.conf nobj 12288 / 2**bin
bin=2                 # must match config_gen.conf and config_steps15.conf bin

rotation_center_shift=0   # the synthetic scan puts the axis exactly at the centre
paganin=100               # must match the tag in obj_init_re{paganin}_{bin}, i.e.
                          # config_steps15.conf paganin (and config_gen.conf delta_beta)
obj_dtype=complex64
mask=1.2             # circular mask radius^2 in units of (nobj/2); 1.0 = inscribed
                      # circle.  The 1 mm sample is only 0.66 of that, so nothing
                      # real is clipped.  -1 disables the mask.

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight
rho=1,0.05,0.02       # gradient step scales: object, probe, positions
                      # No 4th entry: there is no shrinkage in this dataset.

log_level=INFO
