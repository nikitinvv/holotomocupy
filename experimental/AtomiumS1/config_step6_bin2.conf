# Atomium S1, SINGLE-distance FT, +-300 px random displacement, 4.5 nm voxels
# -- ESRF ID16A, proposal blc17322, beamtime 20260825, scan _0001.
# BH reconstruction (step 6) -- hierarchical level bin=2 (4x4 binning).
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1024   0           513     513
#   config_step6_bin1.conf  1    2048  2048   512         769     257
#   config_step6_bin0.conf  0    4096  4096   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub polaris_run.sh                                    # all four stages
#   qsub -v CONFIG=config_step6_bin2.conf polaris_run.sh   # or one at a time
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime --
# and on the 1 h debug queues that is the NORMAL outcome, not an accident --
# just lower the next level's start_iter to the last checkpoint that landed, or
# resubmit the same level with start_iter raised to it.
#
# THE SIBLING IS ../ctxl_FT_4K_RD300_007p5nm, and the ladder below is its
# ladder unchanged: the same detector, the same 12000 angles, the same one
# distance, so the per-iteration cost is comparable (nobj=4096 here vs 4736
# there, i.e. 1.55x cheaper per iteration) and
# there is no reason for the schedule to differ.  What differs is the sample,
# the energy (17.1 vs 33.35 keV) and the voxel (4.5 vs 7.5 nm), none of which
# the optimizer sees.  Every long note that folder carries about
# single-distance reconstruction applies here verbatim; the notes below are the
# ones whose NUMBERS are specific to this scan.
#
# SINGLE DISTANCE MEANS NO DISTANCE DIVERSITY.  The only things separating
# phase from absorption are the angular redundancy (12000 projections) and the
# +-300 px random displacement.  The bin-2 stage therefore has to do much more
# work than it would on a 4-distance scan, because it starts from a
# single-distance Paganin guess.  Look at that guess before committing the
# ladder:
#     python show_slices.py config_steps15.conf --init
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec   # steps15 output dir
in_file=Atomium_S1_FT_4K_RD300_004p5nm_0001.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec6  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: NOT set, and unlike ../ctxl_FT_4K_RD300_007p5nm it CANNOT be set.
#       Step 6 starts from a flat probe and refines it (rho[prb] = 0.05 below).
#       This scan does have an NFP companion
#       (<pfile>/projections/<pfile>_NFP_before_0001.nx), but its pixels are a
#       virtual dataset into RAW_DATA/, and RAW_DATA/ for proposal blc17322 was
#       not copied to eagle -- /eagle/APS_IRI/vnikitin/20260829/RAW_DATA/ holds
#       only ctxl.  HDF5 answers an unresolvable virtual source with SILENT
#       ZEROS, so there is no half-working version of this: esrf_layout.NxFrames
#       refuses, and there is no step0.py in this folder.  If RAW_DATA ever
#       arrives, copy step0.py + config_step0.conf from
#       ../ctxl_FT_4K_RD300_007p5nm, run
#           mpirun -n 4 python step0.py config_step0.conf
#       and uncomment a prb_file line pointing at nfp_results.h5 in the steps15
#       output dir -- in THIS (bin-2) config only; bins 1 and 0 inherit the
#       probe from the previous level's checkpoint.  A measured probe is worth
#       more here than on a 4-distance scan, since with one distance the probe
#       and the object are separated by the displacement diversity alone.

nchunk=32             # projections per GPU batch -- lower it first if bin 2 runs out of GPU memory.
                      # Chunk memory goes as nchunk*ndist*nz*n and ndist is 1
                      # here, so even 64 should fit; 32 leaves headroom for the
                      # ntheta-sized bookkeeping arrays.
ntheta=12000          # projection angles, 0..179.985 deg in 0.015 deg steps
start_theta=0         # index of first projection angle
ndist=1               # number of distances (z1 = 3.698060 mm)

niter=1025             # runs iterations 0..1024
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume.
                      # This is the ONLY level that reads obj_init, which is why
                      # config_steps15.conf sets start_level_rec = nlevels-1 = 2
                      # and step 5 writes a Paganin volume at bin 2 alone.
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size   = 4096 / 2**2
n=1024                # horizontal detector size = 4096 / 2**2
nzobj=1024            # vertical object size     = 4096 / 2**2
nobj=1024             # horizontal object size   = 4096 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=10.74  # was 18.70.  Taken 2026-09-07 from ESRF's own
                      # nabu parameters -- nabu_final.conf says
                      # rotation_axis_position = 1028.87 on the 2048-wide
                      # (2x2 binned) <pfile>_rec_.nx, i.e.
                      # (1028.87 - 1023.5) x 2 = +10.74 raw px -- which lands
                      # 0.35 px from the opposed-pair mirror measurement
                      # (+10.39 +- 1.69) on this stitch.  Full derivation and
                      # the three cross-checks in config_steps15.conf.
                      #
                      # These three MUST match config_steps15.conf: step 5
                      # stitches srdata -- hence obj_init -- with its value and
                      # step 6 adds this one to every position it reads, so a
                      # mismatch silently puts the object init and the geometry
                      # several px apart.
paganin=20            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
                      # 32 is the 33.35 keV value of 120 scaled by (17.1/33.35)^2
                      # -- an argument, not a measurement.  See config_steps15.conf.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# Rec._build_data_mask samples the object plane at
#     x = eff_demag*(tx - (n-1)/2) - r_x + (nobj-1)/2,   eff_demag = (1+shrink)/norm_mag
# and drops the detector pixels whose cubic B-spline taps land outside the grid.
# On a MULTI-distance scan this matters a great deal -- ../AtomiumL1_HT's plane 4
# is demagnified 1.571x relative to plane 1 and keeps only 0.616 of its pixels.
#
# HERE IT DOES BITE, BY CHOICE.  With one plane norm_mag = 1 exactly, so the
# detector back-maps onto exactly 4096 object px -- and nobj = n = 4096, so the
# grid has NO margin for the +-300 px displacement.  Measured from
# /exchange/cshifts_final (y in [-300.02, +299.99], x in [-300.18, +299.93]):
#     kept fraction 0.962 per axis on average -> 0.926 of the detector area
#     0.858 at the worst angle (|r| = 300 on both axes)
# The dropped pixels are the outer rows/columns that look at the air outside the
# reconstructed cylinder, and the box is per (distance, angle), so it slides with
# the sample instead of taking the worst case over all angles -- which is what
# makes nobj = n affordable at all.  A 4736 grid would keep 1.000 everywhere at
# 1.55x the memory and the disk, all of it spent on a shell of air.
#
# So a kept fraction near 0.93 here is EXPECTED.  What would still be a bug is a
# number far below 0.86, or a strong drift of it with angle: at ndist=1 that
# means a shift file in the wrong units, not a geometry the grid cannot cover.
#
# F0 keeps its 1/(ntheta*ndist*nz*n) normalization, so err in conv.csv scales
# with the kept fraction and is NOT comparable across runs with different nobj.
# In particular it is NOT comparable with the nobj=4736 runs from 2026-09-03.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=5e-5  # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.16,0.0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # obj/prb/pos copied from ../ctxl_FT_4K_RD300_007p5nm,
                      # which took them from ../ctxl_HT_4K_RD300_007p5nm, which
                      # took them from ../Y350a_HT.  They are a starting point,
                      # not a measurement for this scan -- which is exactly why
                      # estimate_rho below is left on at this level.
                      #
                      # rho[tp] = 0: SHRINKAGE IS MEASURED, NOT ASSUMED.
                      # A shrinking sample makes a post-scan retake a SCALED
                      # copy of the frame it repeats, so the residual
                      # displacement field between them acquires a slope, and
                      # that slope is the shrinkage.  estimate_shrink.py reads it
                      # off this scan's own two retakes:
                      #     python estimate_shrink.py config_steps15.conf --grid 5
                      #     omega=90 vs frame 6000 (half the scan, dt = 0.50)
                      #         crop 2048  A_y = +141 +- 273   A_x = +379 +- 533 ppm
                      #         crop 2560  A_y = -120 +- 208   A_x = +514 +- 493
                      #         crop 3072  A_y = -726 +- 657   A_x = -1549 +- 823
                      #     omega=0  vs frame    0 (the whole scan, dt = 1.00)
                      #         crop 2048  A_y = -478 +- 318   A_x = +442 +- 568
                      #         crop 2560  A_y =  +44 +- 261   A_x = -565 +- 463
                      #         crop 3072  A_y = +105 +-  96   A_x = +297 +- 366
                      # All 25 of 25 blocks fit at every crop.  EVERY term is
                      # inside 2 sigma of zero, at every crop, in both axes, and
                      # the two pairs agree with each other on the implied linear
                      # A (0.1-2.0 sigma).  The signs are not even consistent
                      # between crops, which is what a noise-dominated fit looks
                      # like.  Translated to the frame edge (r = 2048 px) the
                      # displacement is |y| <= 1.0 px and |x| <= 1.6 px, and
                      # estimate_shrink.py's own verdict at all three crops is
                      # "there is no measurable shrinkage in this scan.  Leave
                      # the shrink model at A = B = 0 (rho[tp] = 0) -- fitting it
                      # would be fitting noise."  There is no shrink_list.mat for
                      # this scan either, so init_tp_from_shrink() starts the
                      # model at A = B = 0; with rho[tp] = 0 it stays there and
                      # the term is absent.  See shrink_c*.png.
                      #
                      # Zero is also the answer every 2026 folder in this tree
                      # reached.  Where rho[tp] was left non-zero, the optimizer
                      # invented ~2200 ppm of edge displacement -- 8x the
                      # measured upper limit -- by absorbing displacement the
                      # position refinement should own, and ../fig09_shrink_vs_
                      # noshrink.py shows the resulting 15-24 % loss.  With
                      # +-300 px of random displacement and only ONE distance to
                      # constrain it, this scan is more exposed to that failure
                      # mode than any of them.  Make the last element non-zero
                      # again only for a scan that actually measures a shrinkage.
estimate_rho=False    # True runs BH's coordinate search over rho[prb] then
                      # rho[pos] (Rec.estimate_rho_coord): 2 variables x 3 rungs
                      # x rho_estimate_niter silent iterations = +96 here, i.e.
                      # +19 % on niter=1025.  Worth considering at bin 2 only --
                      # it starts from the Paganin guess and its trials are 16x
                      # cheaper than bin 0's.  Since the rho above is inherited
                      # from a different sample AND a different energy, this is
                      # the cheapest way to check it.  Winners are logged at
                      # WARNING level as "estimate_rho_coord: final rho = [...]"
                      # and are NOT stored in the checkpoint -- copy them into
                      # the bin-1 and bin-0 configs by hand.
                      #
                      # NOTE the interaction with the 1 h debug-scaling cap: the
                      # +96 iterations come out of the same walltime.  If bin 2
                      # does not finish, either resubmit with start_iter at the
                      # last checkpoint and estimate_rho=False (the search has
                      # already run), or turn it off from the start.
rho_estimate_niter=16 # iterations per trial
log_level=INFO
