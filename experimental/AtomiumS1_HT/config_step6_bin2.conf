# Atomium S1, 4-distance HT, +-300 px random displacement, 4.5 nm voxels
# -- ESRF ID16A, visit blc17322, collected 2026-09-07.
# BH reconstruction (step 6) -- hierarchical level bin=2 (4x4 binning).
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1024   0           1025    1025
#   config_step6_bin1.conf  1    2048  2048   1024        1281    257
#   config_step6_bin0.conf  0    4096  4096   1280        1537    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub polaris_run.sh                                    # all four stages
#   qsub -v CONFIG=config_step6_bin2.conf polaris_run.sh   # or one at a time
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_HT_4K_RD300_004p5nm_0004_rec   # steps15 output dir
in_file=Atomium_S1_HT_4K_RD300_004p5nm_0004.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_HT_4K_RD300_004p5nm_0004_rec6 # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: DELIBERATELY UNSET.  This scan has no NFP companion in the
#       eagle copy at all -- no <pfile>_NFP* directory and no
#       projections/ tree -- so there is nothing to point it at.  Step 6
#       starts from a flat probe and refines it; rho[1] below is what
#       controls that.  If a measured probe ever appears, add a
#       prb_file= line to this (bin-2) config only; bins 1 and 0 inherit
#       the probe from the previous level's checkpoint.

nchunk=16             # projections per GPU batch -- lower it first if bin 2 runs out of GPU memory
ntheta=4000           # projection angles, 0..180 deg in 0.045 deg steps
start_theta=0         # index of first projection angle
ndist=4               # number of distances (z1 = 3.698, 3.857, 4.491, 5.809 mm;
                      #   plane 4 .info had not landed as of 2026-09-07)

niter=1025            # last iteration executed is 1024
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size   = 4096 / 2**2
n=1024                # horizontal detector size = 4096 / 2**2
nzobj=1024            # vertical object size     = 4096 / 2**2
nobj=1024             # horizontal object size   = 4096 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=-29.48  # From ESRF's nabu configuration for THIS scan.
                      # <pfile>_/naburec/nabu_final_cm.conf says
                      #     rotation_axis_position = 1008.76
                      # on the 2048-wide (2x2 binned, UNpadded) <pfile>_rec_.nx,
                      # and nabu counts from a 0-based centre (2048-1)/2 =
                      # 1023.5, so
                      #     (1008.76 - 1023.5) x 2 = -29.48 raw px.
                      # That conf is the one whose reconstruction actually ran,
                      # and it reads ../correct_correct3D.txt -- the same file
                      # step 3 reads -- so axis and correction are the matched
                      # pair.  Full derivation in config_steps15.conf.
                      #
                      # WAS +44.20, from the PyHST <pfile>_rec_.par.  That .par
                      # predates the nabu alignment search and is 73.7 px off;
                      # see config_steps15.conf.  Do not restore it.
                      #
                      # These three MUST match config_steps15.conf: step 5
                      # stitches srdata -- hence obj_init -- with its value and
                      # step 6 adds this one to every position it reads, so a
                      # mismatch silently puts the object init and the geometry
                      # several px apart.
paganin=35            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# Rec._build_data_mask samples the object plane at
#     x = eff_demag*(tx - (n-1)/2) - r_x + (nobj-1)/2,   eff_demag = (1+shrink)/norm_mag
# and drops the detector pixels whose cubic B-spline taps land outside the
# grid.  Two separate things push pixels out here, and only one of them is a
# problem:
#
#   the displacement.  +-300 detector px at plane 1 is +-471 object px at
#   plane 4 (300/0.6366).  nobj = n leaves ZERO margin for it, so unlike the
#   sweep-sized nobj = 5056 the ends of the sweep do run off the edge.  This
#   is deliberate -- nobj matches ../AtomiumS1, the FT scan of this sample,
#   see the block in config_steps15.conf.
#
#   the demagnification.  Plane 4 has eff_demag = 1.571, so its detector
#   back-maps onto 4096*1.571 = 6434 object px at bin 0, well past the grid,
#   and no affordable nobj fixes that (covering it needs 7424, i.e. 1.81x
#   linearly against this grid and 5.9x the volume).  It does not need
#   fixing: the outer ring of a demagnified plane looks at object coordinates
#   the reference plane never sees, so nothing there is constrained by the
#   rest of the data anyway.
#
# Expected kept fractions at startup, which Rec._build_data_mask logs -- static
# first, then at the ends of the sweep:
#     plane 1  1.00 .. 0.86      plane 3  0.68 .. 0.56
#     plane 2  0.92 .. 0.78      plane 4  0.40 .. 0.32
# i.e. roughly a third of the data is masked, against roughly a tenth at
# nobj = 5056 (1.00 / 1.00 / 1.00..0.87 / 0.62..0.51).  Same situation as
# ../Y350a_HT (nobj 4608 against a 6500 px plane-4 footprint), which
# reconstructed fine, but further along it.  F0 keeps its
# 1/(ntheta*ndist*nz*n) normalization, so err in conv.csv scales with the kept
# fraction and is NOT comparable across runs with different nobj -- in
# particular it is not comparable with a 5056 run.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=5e-5  # 3-D Laplacian regularisation weight
rho=1.0,0.05,0.04,0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # obj/prb/pos carried over from ../Y350a_HT via
                      # ../ctxl_HT_4K_RD300_007p5nm, the closest comparable
                      # ladders: 4 distances, ntheta=4000, n=4096, same detector
                      # and beamline.  A starting point, not a measurement for
                      # THIS sample.  ../AtomiumS1, the FT scan of this same
                      # sample, runs 1.0,0.0125,0.16,0.0 on Polaris -- but it has
                      # ONE plane, so its rho[pos] is doing a different job and
                      # is not transferable; the 4x smaller rho[prb] there might
                      # be, and is the first thing to try if the probe here goes
                      # unstable in the first hundred iterations.
                      #
                      # rho[tp] = 0: SHRINKAGE IS NOT REFINED.
                      # It has NOT been measured on this scan yet.  The
                      # post-scan retakes it is measured from are all here --
                      # quali.mat in each of <pfile>_1_ .. _4_ -- so
                      #     python estimate_shrink.py config_steps15.conf
                      # can be run as soon as steps 1-3 have, and the answer
                      # belongs in this slot if it comes back non-zero.  Until
                      # then rho[tp] stays 0, which is the safe direction:
                      # there is no shrink_list.mat
                      # either, so init_tp_from_shrink() starts the model at
                      # A = B = 0 and with rho[tp] = 0 it stays there and the
                      # term is simply absent.  ctxl_HT, the other 2026 HT scan,
                      # measured |A| < 420 ppm (2 sigma) = under a pixel at the
                      # frame edge, so a non-zero value is not expected here
                      # either -- but this sample is a different material.
                      #
                      # Leaving it free is the risk, not the caution: the
                      # ../Y350a_largedisp* ladders showed what happens.
                      # There, leaving rho[tp] non-zero let the optimizer
                      # invent ~2200 ppm of edge displacement, 8x that scan's
                      # upper limit, by absorbing displacement that the
                      # position refinement should own; ../fig09_shrink_vs_noshrink.py
                      # shows the resulting 15-24 % loss.  With +-300 px of
                      # random displacement, this scan is exposed to exactly
                      # that failure mode.  Make the last element non-zero
                      # again only for a scan that actually measures a
                      # shrinkage.
estimate_rho=False    # True runs BH's coordinate search over rho[prb] then
                      # rho[pos] (Rec.estimate_rho_coord): 2 variables x 3 rungs
                      # x rho_estimate_niter silent iterations = +96 here, i.e.
                      # +9 % on niter=1025.  Worth considering at bin 2 only --
                      # it starts from the Paganin guess and its trials are 16x
                      # cheaper than bin 0's.  Since the rho above is inherited
                      # rather than tuned for this sample, this is the cheapest
                      # way to check it.  Left off here because the FT scan of
                      # this same sample (../AtomiumS1) runs with a fixed rho
                      # and reconstructs fine, so the 96 extra silent iterations
                      # are not worth spending.  It IS on for ctxl_HT, where the
                      # sample is different.  Winners are logged at WARNING level as
                      # "estimate_rho_coord: final rho = [...]" and are NOT
                      # stored in the checkpoint -- copy them into the bin-1 and
                      # bin-0 configs by hand.
rho_estimate_niter=16 # iterations per trial
log_level=INFO
