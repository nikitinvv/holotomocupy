path=/data2/vnikitin/20260416/YY037A_rec        # steps15 output: the 5 tile h5 + the mosaic _obj.h5
path_out=/data2/vnikitin/20260416/YY037A_rec6   # step 6 output (checkpoints, errors)
pfile=YY037A_HT_F2_100nm                        # scan prefix, without tile / suffix

# --- mosaic ---------------------------------------------------------------
# Same order steps15.py used (left to right on the mosaic); the tile placement
# is read from /exchange/tile_offsets, written by step 5's estimate_overlap.
tiles=farright,right,center,left,farleft
scan_suffix=0001

nchunk=16              # projections per GPU batch
ntheta=300            # number of projection angles (matches steps15 ntheta_rec)
start_theta=0         # index of first projection angle
ndist=4               # distances PER TILE; step6.py expands to 4 x 5 = 20

niter=2048            # number of iterations
start_iter=0          # resume from this iteration (0 = start fresh)
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=256                # vertical detector size (2048 >> bin)
n=256                 # horizontal detector size
nobj=1536             # width  = steps15 nobj /2**bin = 12288/8
nzobj=448             # height = steps15 nzobj/2**bin =  3584/8
bin=3                 # needs step 5 run with nlevels=4, start_level_rec=3
shift_type=cubic

# Not part of the tile placement — that is measured by estimate_overlap and
# read from tile_offsets. Keep this identical to config_steps15.conf.
rotation_center_shift=0
paganin=40            # must match the tag in obj_init_re{paganin}_{bin}
obj_dtype=complex64

# The mosaic grid is sized to the sample, so the reconstructable region is the
# inscribed circle: mask=1.0. The 0.9 used elsewhere would be a radius of
# sqrt(0.9)=0.949 half-widths = 675 px here, while the outer tiles reach 704 —
# it would attenuate ~30 px of real sample at the mosaic edge.
mask=1.2

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=2e-4    # 3-D Laplacian regularisation weight
rho=1,0.05,0.01,1e-4  # gradient step scales: object, probe, positions, tp
                      # (tp = the linear shrink params A, B — step6.py runs
                      #  rec_mpi_shrink, so the 4th entry is required)

# Sweep rho before the main loop: a coordinate search on the probe, position and
# tp scales over {..., init/2, init, 2*init, ...}, 8 BH iterations per candidate,
# lowest final error wins. Costs ~6-10 trials x 8 iters up front; the found rho
# is logged as "estimate_rho_coord: final rho = [...]" and drives the whole run.
# Set it back to false and paste the winner into rho= to skip the search.
estimate_rho=false
rho_estimate_niter=8

log_level=INFO
