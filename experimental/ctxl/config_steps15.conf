path=/eagle/APS_IRI/vnikitin/20260516/ctxl # raw data root
path_out=/eagle/APS_IRI/vnikitin/20260516/ctxl_rec # output directory
pfile=ctxl_HT6d_4K_008p5nm_0001                                     # scan prefix name

# Read geometry (energy, z1, focustodetectordistance, detector_pixelsize) from the
# NXtomo file produced by nxtomomill_edf2nx. Comment out to fall back to reading
# one per-distance HDF5 scan file. Relative paths resolve under `path`.
nx_file=ctxl_HT6d_4K_008p5nm_0001_/ctxl_HT6d_4K_008p5nm_0001_rec_.nx.new

start_step=1 # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
nlevels=3             # number of binning levels (step 4)
start_level_rec=2     # first binning level to reconstruct (0 = coarsest)

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=2048                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=4096             # 0 = auto-compute from n and magnifications; set >0 to override

rotation_center_shift=5.27  # rotation axis offset from detector centre (pixels) 1612.50792
paganin=120           # delta/beta ratio for multi-distance Paganin (step 5)
ref_dist=4            # reference distance index for motion-shift baseline (step 3)
shrink_angle_ramp=false  # false = Peter's per-distance constant; true = linear ramp over angles
log_level=INFO        # DEBUG, INFO, WARNING, ERROR
