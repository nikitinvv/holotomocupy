# ===========================================================================
# CENTRE SWEEP -4 -- generated 2026-08-25 from config_steps15.conf.
# Only rotation_center_shift, start_step and start_level_rec differ; path and
# path_out are the shared ..._rec dir, as in the main config.
#     qsub -v CONFIG=config_steps15_c-4.conf,SCRIPT=steps15.py \
#          polaris_run_noshrink_c-4.sh
#
# SEQUENTIAL ONLY.  This job rewrites the shared <pfile>_obj.h5 in ..._rec,
# which is the only thing that carries the centre into step 6 (it is read at
# bin 2, start_iter=0, and nowhere else).  Finish this centre's step-6 bin-2
# job before submitting the next centre's steps15, or the later centre's
# volume will be the one that gets reconstructed.  Bins 1 and 0 upsample the
# bin-2 checkpoint and never touch _obj.h5, so they can lag behind safely.
# ===========================================================================
# Y350a, HT scan, 20 nm, 4 distances  --  ESRF ID16A run of 2025-06-04,
# staged on Polaris eagle.  Same sample and same beamline setup as
# Y350a_largedisp (energy, propagation distances and detector pixel size are
# read straight out of the per-distance HDF5, so nothing here duplicates them);
# the difference is that this scan has 4 distance planes instead of 1.
#
# Distance directories globbed by steps15.py:
#     <path>/<pfile>_1_/ ... <pfile>_4_/
# i.e. /eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_[1-4]_/

path=/eagle/APS_IRI/vnikitin/20250604                                 # raw data root (holds <pfile>_[1-4]_/)
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_rec    # SHARED with the main run and with every other
                      # centre.  Each sweep steps15 job OVERWRITES
                      # Y350a_HT_nobin_020nm_obj.h5 here, so run one centre
                      # through steps15 -> step6 bin2 before starting the next.
pfile=Y350a_HT_nobin_020nm                                            # scan prefix name

# Geometry is auto-detected and logged at startup by steps15.py:
#   ndist, ntheta, energy, focus-to-detector, z1 per distance, detector pixel
#   size, magnifications, voxelsize, nref, ndark.
# Run `python show_geometry.py config_steps15.conf` first to see the numbers
# without launching a job; it also prints the matching config_step6_bin*.conf
# block.

start_step=3          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
                      # STEP 5 ONLY.  rotation_center_shift enters steps15.py in
                      # exactly one place -- step 5 adds it to the horizontal
                      # component of the stitching shifts -- so steps 1-4 are
                      # centre-independent and must NOT be re-run: they are the
                      # 2.8 TB Y350a_HT_nobin_020nm.h5 already in
                      # Y350a_HT_nobin_020nm_rec, which step 5 opens read-only.
                      # Step 5 rewrites only Y350a_HT_nobin_020nm_obj.h5 /
                      # _srdata.h5 / _proj.h5 there -- shared by all centres,
                      # hence the sequential rule at the top of this file.
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so the pair below produces bins 2 (4x4), 1 (2x2) and 0 (1x1) -- exactly the
# three levels the config_step6_bin{2,1,0}.conf files reconstruct.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=2     # FINEST binning level to reconstruct.  2, not 0: step 6
                      # reads the step-5 volume only at bin 2 (start_iter=0);
                      # bins 1 and 0 upsample the previous level's checkpoint.
                      # So one swept centre costs a 1152^3 x 2 x float32 = 12 GB
                      # _obj.h5, not the 783 GB a bin-0 volume would.
nchunk=8              # z-slices per GPU chunk in FBP (step 5)

n=4096                # detector crop size at full resolution (bin 0)
nobj=4608             # stitched object size at full resolution (bin 0).
                      # Fixed rather than auto-computed: the sample sits inside
                      # the detector field of view, so 4096 + 512 px of margin
                      # is enough to hold it plus the inter-distance
                      # magnification spread.  4608 = 72*64, and 4608/2=2304,
                      # 4608/4=1152, so it bins cleanly over all three levels.

rotation_center_shift=-4   # rotation axis offset from the grid centre,
                      # in FULL-RESOLUTION (bin 0) detector pixels.
                      #
                      # CENTRE SWEEP, 2026-08-25.  The main run used
                      # -10.386198 (derived from an axis measured on a
                      # bin-1 grid) and its reconstruction says that value
                      # is wrong, so six candidates are being run to the
                      # end instead of trusted: 0, -1, -2, -3, -4, -7.
                      # These are ABSOLUTE values, not offsets from
                      # -10.386198.  Everything else here is identical to
                      # config_steps15.conf.
                      # Both steps15.py and reader.py apply it as
                      #     r[...,1] += rotation_center_shift/2**bin + 0.5*(1/2**bin - 1)
                      # so the same number goes into the steps15 config and
                      # all three step-6 levels unchanged.
paganin=60            # delta/beta ratio for multi-distance Paganin (step 5).
                      # Same value as Y350a_largedisp -- same sample, so the
                      # delta/beta ratio carries over.
ref_dist=0            # reference distance index for motion-shift baseline (step 3)
log_level=INFO        # DEBUG, INFO, WARNING, ERROR
