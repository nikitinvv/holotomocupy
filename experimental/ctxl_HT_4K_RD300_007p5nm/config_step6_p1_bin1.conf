# ctxl cortex tissue, 4-distance HT, +-300 px random displacement, 7.5 nm
# voxels -- ESRF ID16A 2026-08-29..31, proposal ihls3888.
# HALF-SET reconstruction p1 (odd projections), hierarchical level bin=1.
# ---------------------------------------------------------------------------
# WHAT THIS IS
#
# The same BH ladder as config_step6_bin{2,1,0}.conf, run on half the
# projections and with the positions frozen at what the FULL 4000-projection
# ladder found.  p0 takes the even global angle indices 0, 2, 4, ..., 3998 and
# p1 the odd ones 1, 3, 5, ..., 3999; the two halves are disjoint and together
# they are the whole scan.
#
# HOW THE HALF IS SELECTED
#
#   ntheta=2000   start_theta=1
#
# Reader.__init__ builds  ids = arange(start_theta, ntheta0, ntheta0/ntheta)
# with ntheta0 = len(/exchange/theta) = 4000, so the step is exactly 2 and ids
# are this half's GLOBAL angle indices.  Every read is indexed by them --
# read_data (pdata{k}_{bin}), read_ref, read_shrink, read_pos
# (cshifts_final), theta itself, and read_pos_checkpoint below -- so no other
# key has to change to split the scan.
#
# POSITIONS ARE FIXED, NOT REFINED
#
#   pos_checkpoint = <full run>/checkpoints/checkpoint_1504.h5
#   rho            = 1.0,0.05,0,0          <- third element is 0
#
# After the usual initialisation, step6.py calls Reader.read_pos_checkpoint,
# which reads rows ids[st:end] of that checkpoint's /pos -- this half's own
# global indices, so each projection keeps its own refined position -- and
# rescales them from the checkpoint's n=4096 to this level's n with
# pos*scale + 0.5*(scale-1), the same transform read_checkpoint uses between
# levels.  rho[pos]=0 then makes gradpos = y[2]*rho_sq['pos'] identically zero
# (rec_mpi.py:1269), the CG direction for pos stays zero, and the positions do
# not move for the whole ladder.  Only obj and prb are refined here.
#
# checkpoint_1504.h5 is the LAST checkpoint the full bin-0 run wrote (it stopped
# at 1504 of the planned 1536 -- queue is preemptable).  If the full run is
# later extended, point pos_checkpoint at the new last checkpoint and rerun;
# the positions change by well under a pixel over 32 iterations, but the two
# halves must at least use the SAME one as each other.
#
# rotation_center_shift below is inert in this configuration: read_pos adds it
# but read_pos_checkpoint immediately overwrites what read_pos produced, and the
# checkpoint positions already contain it.  It is kept in sync with the full
# configs so a rerun without pos_checkpoint still does the right thing.
#
# HIERARCHICAL CHAIN -- identical iteration counts to the full run
#
#   file                          bin   n     nobj   proj   start_iter  niter   iters
#   config_step6_p1_bin2.conf     2    1024   632   1264   0           1025    1025
#   config_step6_p1_bin1.conf     1    2048  1264   2528   1024        1281    257
#   config_step6_p1_bin0.conf     0    4096  2528   5056   1280        1537    257
#
# EVERY LEVEL RUNS tomo_upsample=2.  The object x/y grid is HALF the projection
# plane, so R maps [nzobj, nobj, nobj] -> [ntheta, nzobj, 2*nobj].  The
# projection plane itself is untouched at every level -- it is still 5056/2**bin,
# the stitched detector grid -- so pos, rotation_center_shift, the mask and the
# whole detector-side cascade are exactly what they were.  What changes is that
# the object costs a quarter of the memory and its voxels are anisotropic during
# the run: z voxel v, x/y voxel 2v.  bin_z.py averages the final volume down to
# isotropic afterwards, outside the reconstruction.  The level-to-level handoff
# is a plain x2 in obj z, obj x/y, prb and pos, as it was before.  lam_laplacian
# must be 0 at every level for the same reason (see below).
#
# All three levels share ONE path_out, ..._rec6_p1, which is separate from the
# full run's ..._rec6, so the three volumes -- full, p0, p1 -- sit side by side
# and nothing is overwritten.  Half the projections is a little under half the
# cost: the full ladder took 0.71 + 0.66 + 2.78 h on 2 Polaris nodes.
#
#   qsub polaris_run_halves.sh      # p0 ladder then p1 ladder, six mpiexec lines
#
# WHAT IS AND IS NOT INDEPENDENT BETWEEN THE HALVES
#
# Independent: the projection data (disjoint), and the object and probe that are
# refined from it.  Shared:
#
#   * the positions -- by construction; that is the point of this run;
#   * the bin-2 starting object, /exchange/obj_init_re60_2 in
#     <pfile>_rec/<pfile>_obj.h5, which step 5 built by Paganin+FBP over ALL
#     4000 projections.  Both halves start their ladder from it.
#
# So an FSC between p0 and p1 is NOT the FSC of two independent reconstructions:
# the common initial guess correlates them at low spatial frequency, and freezing
# the positions removes the position refinement's own contribution to the
# discrepancy.  What it does measure is how much one half of the data alone
# constrains the volume when the geometry is already known.  Making the starting
# object independent too means rerunning step 5 per half (start_step=5 with
# ntheta=2000 and a distinct paganin tag so the two do not collide in the same
# file, +1 TB each in <pfile>_obj.h5); that has not been done.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec   # steps15 output dir
in_file=ctxl_HT_4K_RD300_007p5nm_0001.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec6_p1  # step-6 output for THIS half, SHARED by its three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file is NOT set here and must not be: this level inherits obj and prb
#       from the bin-2 checkpoint named by start_iter below.  It inherits pos
#       from there too, but pos_checkpoint at the bottom then overwrites it with
#       the full run's positions -- the same values, reached by the same 4096 -> n
#       rescaling, since that transform composes exactly across levels.

nchunk=4             # projections per GPU batch -- lower it first if bin 1 runs out of GPU memory
ntheta=2000           # half of the 4000 angles: the odd global indices (see header)
start_theta=1         # 1 -> ids = 1, 3, 5, ..., 3999
ndist=4               # number of distances (z1 = 6.164, 6.428, 7.486, 9.682 mm)

niter=1281            # last iteration executed is 1280
start_iter=1024       # resumes from checkpoints/checkpoint_1024.h5, written by the bin-2 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048               # vertical detector size   = 4096 / 2**1
n=2048                # horizontal detector size = 4096 / 2**1
nzobj=2528            # vertical object size     = 5056 / 2**1
nobj=1264             # horizontal OBJECT size; the projection plane is
                      # nobj*tomo_upsample = 2528 = 5056 / 2**1
tomo_upsample=2       # detector oversampling of the Radon transform:
                      # R: [nzobj, nobj, nobj] -> [ntheta, nzobj, nobj*2].
                      # Detector bins above the object grid's Nyquist wrap: the
                      # object is modelled as a delta comb on its own grid,
                      # exactly as in ~/APS_PXM/tomo_usfft.  The band-limited
                      # alternative is the commented-out block in
                      # cuda_kernels.py's gather.
bin=1                 # binning level; needs start_level_rec <= 1 in config_steps15.conf

rotation_center_shift=-15.77  # was -19.22.  Taken 2026-09-07 from ESRF's own
                      # nabu parameters: nabu_final_cm.conf says
                      # rotation_axis_position = 1599.613741 on the 3216-wide
                      # (2x2 binned, padded) <pfile>_rec_.nx, i.e.
                      # (1599.613741 - 1607.5) x 2 = -15.77 raw px.  Full
                      # derivation and the two cross-checks in
                      # config_steps15.conf.
                      #
                      # These three MUST match config_steps15.conf: step 5
                      # stitches srdata -- hence obj_init -- with its value and
                      # step 6 adds this one to every position it reads, so a
                      # mismatch silently puts the object init and the geometry
                      # several px apart.
paganin=60            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Not actually read at this level (start_iter > 0): the
                      # object comes from the bin-2 checkpoint.  Kept in sync
                      # so a restart with start_iter=0 does the right thing.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# Rec._build_data_mask samples the object plane at
#     x = eff_demag*(tx - (n-1)/2) - r_x + (nobj-1)/2,   eff_demag = (1+shrink)/norm_mag
# and drops the detector pixels whose cubic B-spline taps land outside the
# grid.  Two separate things push pixels out here, and only one of them is a
# problem:
#
#   the displacement.  +-300 detector px at plane 1 is +-471 object px at
#   plane 4 (300/0.6366), in bin-0 units.  The PROJECTION plane,
#   nobj*tomo_upsample = 5056 at bin 0, gives (5056-4096)/2 = 480 px of margin
#   per side, 9 px more than that, so the sweep itself never runs off the
#   edge.  This is what the 5056 was sized for -- see the derivation in
#   config_steps15.conf -- and tomo_upsample leaves it exactly where it was:
#   the mask, pos and rotation_center_shift all live on the projection plane,
#   which this change does not touch.
#
#   the demagnification.  Plane 4 has eff_demag = 1.571, so its detector
#   back-maps onto 4096*1.571 = 6434 projection px, well past a 5056 grid, and
#   no affordable width fixes that (covering it needs 7424, i.e. 1.47x linearly
#   and 3.2x the volume).  It does not need fixing: the outer ring of a
#   demagnified plane looks at object coordinates the reference plane never
#   sees, so nothing there is constrained by the rest of the data anyway.
#
# Expected kept fractions at startup, which Rec._build_data_mask logs:
#     plane 1  1.000     plane 3  0.87 .. 1.00  (displacement-dependent)
#     plane 2  1.000     plane 4  0.616         (flat, the box just translates)
# Same situation as ../Y350a_HT (nobj 4608 against a 6500 px plane-4
# footprint), which reconstructed fine.  F0 keeps its 1/(ntheta*ndist*nz*n)
# normalization, so err in conv.csv scales with the kept fraction and is NOT
# comparable across runs with different nobj.  (Unchanged by tomo_upsample: the
# projection plane it is computed on is still 5056/2**bin wide.)
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight.  MUST stay 0 now
                      # that every level runs tomo_upsample=2: the stencil
                      # assumes isotropic voxels and this object is z:x = 1:2,
                      # so it would penalise z gradients 4x too strongly.  Rec
                      # warns if both are on.  (Was 1.25e-5 while this level was
                      # isotropic; the term is simply absent now.)
rho=1.0,0.05,0,0      # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # rho[pos] = 0: POSITIONS ARE FROZEN at the full run's
                      # values, loaded through pos_checkpoint at the bottom of
                      # this file.  gradpos = y[2]*rho_sq['pos'] is then
                      # identically zero, so pos never moves.  The obj and prb
                      # entries are the full bin-1 config's, unchanged, so the
                      # halves run the same solver the full scan ran.
                      #
                      # obj/prb/pos carried over from ../Y350a_HT, the closest
                      # comparable ladder: 4 distances, ntheta=4000, n=4096,
                      # same detector and beamline.  They are a starting point,
                      # not a measurement for THIS sample.
                      #
                      # rho[tp] = 0: SHRINKAGE IS MEASURED, NOT ASSUMED.
                      # A shrinking sample makes a post-scan retake a SCALED
                      # copy of the frame it repeats, so the residual
                      # displacement field between them acquires a slope, and
                      # that slope is the shrinkage.  estimate_shrink.py reads
                      # it off this scan's own two retakes:
                      #     omega=90 vs frame 2000 (half the scan)
                      #         A_y =  +54 +- 294 ppm   A_x =  -30 +- 389 ppm
                      #     omega=0  vs frame 0    (the whole scan)
                      #         A_y = +107 +- 210 ppm   A_x =   +3 +- 141 ppm
                      # Every term is inside 1 sigma of zero, and the two pairs
                      # agree with each other, so the 2-sigma upper limit on
                      # the shrinkage over the whole scan is |A| < 420 ppm =
                      # 0.86 px at the frame edge.  There is also no
                      # shrink_list.mat for this scan, so init_tp_from_shrink()
                      # starts the model at A = B = 0; with rho[tp] = 0 it
                      # stays there and the term is simply absent.
                      #
                      # This is not caution, it is the measured result -- and
                      # the same one the ../Y350a_largedisp* ladders reached.
                      # There, leaving rho[tp] non-zero let the optimizer
                      # invent ~2200 ppm of edge displacement, 8x that scan's
                      # upper limit, by absorbing displacement that the
                      # position refinement should own; ../fig09_shrink_vs_noshrink.py
                      # shows the resulting 15-24 % loss.  With +-300 px of
                      # random displacement, this scan is exposed to exactly
                      # that failure mode.  Make the last element non-zero
                      # again only for a scan that actually measures a
                      # shrinkage.
estimate_rho=False    # see config_step6_p1_bin2.conf
rho_estimate_niter=16 # iterations per trial
# --- positions from the full 4000-projection reconstruction ------------------
# Absolute path on purpose: config.py resolves pos_checkpoint against path=,
# which is the steps15 directory, not the step-6 one.  read_pos_checkpoint picks
# rows ids[st:end] -- this half's global angle indices -- and rescales 4096 -> n.
pos_checkpoint=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec6/checkpoints/checkpoint_1504.h5
log_level=INFO
