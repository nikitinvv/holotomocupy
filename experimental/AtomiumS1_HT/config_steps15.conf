# ---------------------------------------------------------------------------
# Atomium S1, 4-distance HT scan with +-300 px random sample displacement,
# 4.5 nm voxels -- ESRF ID16A, visit blc17322, collected 2026-09-07.
#
# This is the HOLOTOMOGRAPHY scan of the same sample and the same optic as
# ../AtomiumS1, which is the single-distance FT scan.  Everything the two share
# -- sample, energy, 4.5 nm voxel, RD300 displacement -- is why the settings
# below that are not measured from this scan (paganin above all) are taken from
# there rather than invented.  Everything the two do NOT share -- four planes
# instead of one, a different rotation axis, a different day's drift -- is
# measured here.
#
# LAYOUT: this folder is the `edfinfo` flavour (see esrf_layout.py).  It has EDF
# frames like the 2026 "ewoks" scans next door, but ESRF has not run nxtomomill
# on it yet -- <pfile>/projections/ does not exist, so there is no NXtomo -- and
# geometry is therefore taken from the per-distance <pfile>_k_/<pfile>_k_.info
# sidecars instead.  The sbatch that will produce the NXtomo is already sitting
# in the drop directory (nxtomomill_edf2nx.sbatch), so this is a matter of days,
# and the layout switches to `ewoks` by itself the moment the NXtomo appears.
# Nothing here has to change when it does; `info_check()` simply stops saying
# "derived from the same file" and becomes an independent check again.
#
# >>> STEPS 1-2 CAN RUN.  STEP 3 CANNOT, YET.  <<<
# The four EDF trees finished transferring at 2026-09-07 19:47 -- 4066 frames,
# a .info, an angles_file.txt and a quali.mat in each of <pfile>_1_ .. _4_, and
# check_data_read.py confirms proj[0], proj[3999], 20 flats and 20 darks at
# every distance.  correct_motion.txt landed in <pfile>_3_/ (4004 rows) in the
# same window, exactly where ref_dist = 2 says it should be.
#
# STILL MISSING, and step 3 stops on the first of them:
#     <pfile>/projections/<pfile>_000k.txt  the commanded random displacement.
#         The FIRST term of shifts_final, and nothing in the tree substitutes
#         for it -- rhapp is the inter-plane residual measured on top of it,
#         and correct_motion is the drift on top of that.  ESRF writes it
#         beside the NXtomo, and <pfile>/projections/ does not exist yet
#         because nxtomomill has not run.  steps15.py and check_data_read.py
#         both stop here with a message saying so.
#     <pfile>_/correct_correct3D.txt        the axis correction (see below)
#     <pfile>_/naburec/                     -> re-quote rotation_center_shift
#
# Until the random displacement lands, check_data_read.py's shift totals and
# its grid-reach verdict are meaningless and it says so: with the sweep zeroed,
# correct_motion.txt's own +-300 px is not cancelled and comes out as 733 px of
# "drift", which is also why its reference_motion.mat cross-check reads BAD.
# Re-run it the moment projections/ appears -- that is the run whose numbers
# count, and the one that decides whether nobj = 5056 is wide enough.
#
# Scan geometry, from <pfile>_k_/<pfile>_k_.info (Energy=17.1, TOMO_N=4000,
# ScanRange=-180, Optic_used=1.47601, Dim 4096x4096, REF_N=20, DARK_N=20):
#   ndist=4   ntheta=4000   detector 4096x4096   nref=20   ndark=20
#   energy = 17.1 keV                   detector pixel = 1.47601 um
#   SourceDistance = [ -3.69813   -3.85678   -4.49138   -5.80903 ] mm
#   Distance       = [1209.300   1209.140   1208.510   1207.190  ] mm
#   PixelSize      = [ 0.0045000  0.0046931  0.0054653  0.0070686] um
#   normal         = [ 1.000000   0.958865   0.823384   0.636617 ]
# The normalised magnifications reproduce the ctxl_HT scan's
# 1 / 0.95886 / 0.82338 / 0.63662 to five decimals, which is what says the two
# scans were run with the same optic at the same four plane positions -- so
# nobj below carries over unchanged, and anything ctxl_HT measured about the
# geometry (the rhapp bin factor above all) applies here too.
#
# Peter's octave driver, <pfile>_/ht_<pfile>.m, ran the same scan with
#   nvue=4000  bin_factor=2  reference_plane=3  delta_beta=150
#   pixelsize_detector=1.47601e-06
# which is where ref_dist, rhapp_bin and correct3d_bin below come from.  His
# delta_beta is NOT what paganin is set to -- see the note there.
#
# Auxiliary shift files:
#   <pfile>/projections/<pfile>_000k.txt   random displacement    NOT YET THERE
#   <pfile>_/rhapp.mat                     inter-plane, 2 x 4 x 4003, present
#                                          (2x2-binned px -- see rhapp_bin)
#   <pfile>_3_/correct_motion.txt          slow drift, 4004 rows, present
#   <pfile>_/correct_correct3D.txt         axis correction, 4001 rows, PETER'S
#                                          OWN as of 2026-09-08 -- the earlier
#                                          ctxl_HT transplant is dead, see
#                                          correct3d_bin
#   <pfile>_/reference_motion.mat          reference_plane + ref_v/ref_h, present
#   <pfile>_/<pfile>_rec_.par              PyHST, STALE -- see the axis note
#   <pfile>_/naburec/*.conf                present 2026-09-08, states the axis
#
# WHAT ESRF HAS ALREADY STATED, read back rather than retyped:
#   reference_motion.mat  reference_plane = 3  -> ref_dist = 2 below
#                         pixelsize 9.0 nm     -> bin 2 (9.0 / 4.5)
#                         ref_v  ptp 8.2691    ref_h  ptp 2.3065  (binned px)
#   rhapp.mat             pixelsize 9.0 nm     -> rhapp_bin = 2
#                         rhapp  2 x 4 x 4003, range -94.60 .. +147.48 binned px
#   rhappnofit.mat        the unfitted residual, and its own quality numbers:
#                         res_shift_sigma_h = [0.919 0.891 0.879] binned px
#                         res_shift_sigma_v = [0.790 0.886 0.973] binned px
#                         i.e. under one binned pixel on every plane pair, which
#                         is what says the rhapp fit is trustworthy here.
#   <pfile>_rec_.info     Dim 2048, PixelSize 0.00899998 um, nb_of_planes 4,
#                         delta_beta 150  -> his grid is 2x2 binned, unpadded
#
# ref_v/ref_h ARE the drift correct_motion.txt carries, negated, so its size was
# known before the file arrived: 8.27 binned px = 16.5 raw px vertical, 2.31
# binned = 4.6 raw px horizontal.  That is FIVE TIMES the ctxl_HT drift (1.62
# raw px vertical) and far too large to leave out.  Step 3 and
# check_data_read.py both re-derive it as correct_motion - random[ref_dist] and
# compare against ref_v/ref_h, which is the check that the file was read in the
# right units and column order -- but that subtraction needs the random
# displacement, so the comparison cannot be made until projections/ lands.
# quali.mat, the three post-scan retakes ESRF fits the drift from, is here for
# all four planes; for the two that have been looked at:
#     plane 1  corr_imagesafterscan = [0.588 -22.242;  2.602 -11.473;  0 0]
#     plane 2  corr_imagesafterscan = [-2.012 -18.061; 3.680 -10.135;  0 0]
# `python estimate_motion.py config_steps15.conf --validate` re-measures the
# same drift from those retakes and writes an independent ./correct_motion.txt,
# which is worth running as a cross-check of ESRF's file the way it was on
# ctxl_HT.  Note the horizontal column above reaches -22 binned px, far more
# than sample drift, and that is the same axis-correction contamination ctxl_HT
# showed -- on that scan the horizontal column of correct_motion.txt turned out
# to carry ESRF's rotation correction, not drift.  Read the correct3d_bin note
# below and ../ctxl_HT_4K_RD300_007p5nm/README.md before acting on it.
#
# There is no shrink_list.mat, so load_shrink_from_mats returns A=B=0 and the
# linear shrinkage model starts at zero.  Whether it is refined is rho[tp] in
# the config_step6_bin*.conf files; see the note there and in README.md, and
# estimate_shrink.py for what the retakes say the shrinkage actually is.

start_step=1          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
                      # 1, because nothing has been run on this scan yet.  Once
                      # <pfile>_rec/<pfile>.h5 exists, set this to 3 so that a
                      # change to a shift file or to the axis does not rebuild
                      # the HDF5 from the EDFs.

# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so step 4 writes binned projections for bins 2 (4x4), 1 (2x2) and 0 (1x1) --
# the three levels the config_step6_bin{2,1,0}.conf files reconstruct -- while
# step 5 writes a Paganin+FBP init only for the levels from start_level_rec up.
# Only bin 2 needs one: it is the first rung of the step-6 ladder, and bins 1
# and 0 are seeded from the checkpoint the level below wrote, not from FBP.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=2     # FINEST binning level to reconstruct (0 = full resolution)
                      # Disk cost of including bin 0, at ndist=4:
                      #   step 1  <pfile>.h5     4000 x 4096^2 x 2 B x 4 =  537 GB
                      #   step 4  bin-0 pdata    4000 x 4096^2 x 4 B x 4 = 1074 GB
                      #   step 5  <pfile>_obj.h5 4096^3 x 4 B x 2 (re+im) =  550 GB
                      # about 2.2 TB in total -- half a TB less than ctxl_HT
                      # next door, which runs the sweep-sized nobj = 5056.
                      # Set start_level_rec=1 to stop at the 2x2 level if eagle
                      # gets tight.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=4096             # stitched object size at full resolution (bin 0).
                      # SET EQUAL TO n, MATCHING ../AtomiumS1 (the FT scan of
                      # this same sample), by instruction.  No margin around the
                      # detector width at all; mask_oob in the step-6 configs
                      # drops whatever falls outside.  4096/2 = 2048 and
                      # 4096/4 = 1024, so it bins cleanly over all three levels.
                      #
                      # WHAT THIS COSTS, AND WHY IT IS NOT THE SAME TRADE THE FT
                      # SCAN MAKES.  Over there ndist = 1 and norm_mag = 1, so
                      # the only thing the grid has to absorb is the +-300 px
                      # sweep; here there are four planes and the demagnified
                      # ones back-map onto far more than 4096 object px:
                      #     plane   footprint = 4096/norm_mag   kept (2-D)
                      #                                       nobj 5056   4096
                      #     1        4096.0                     1.00      1.00
                      #     2        4271.7                     1.00      0.92
                      #     3        4974.6                     1.00      0.68
                      #     4        6434.0                     0.62      0.40
                      # static, i.e. before the sweep moves the box; at the ends
                      # of the +-300 px sweep every column drops further (worst
                      # case 0.86 / 0.78 / 0.56 / 0.32).  So this setting throws
                      # away roughly a third of the data instead of roughly a
                      # tenth.  Rec._build_data_mask logs the real fractions at
                      # startup -- read them on the first bin-2 run.
                      #
                      # It buys a 1.9x smaller volume at bin 0 (4096^3 against
                      # 5056^3) and matches the FT reconstruction voxel for
                      # voxel, which is what makes the two directly comparable.
                      #
                      # THE SWEEP-SIZED VALUE WAS 5056, and it is the fallback.
                      # Derivation: plane 1 sees 4096 px of object at 4.5 nm and
                      # the commanded +-300 detector px are +-300/norm_mag[k]
                      # object px, worst at plane 4 (300/0.636617 = 471), so
                      # 4096 + 2*471 = 5038 rounded up to 5056 = 79*64.  That is
                      # also what ctxl_HT runs, the optic and the RD300 sweep
                      # being the same.  If the reconstruction shows the outer
                      # band of the field degrading -- it is the part that is
                      # only seen at some angles once the margin is gone -- put
                      # 5056 back here and 1264/2528/5056 in the three step-6
                      # configs.  Anything else must stay a multiple of 256 so
                      # it still bins cleanly over three levels.
                      #
                      # Note also that 5056 was itself sized on the sweep ALONE.
                      # ctxl_HT's sibling ../ctxl_FT had to be widened from 4736
                      # to 4800 once the drift and the 3-D correction went on top
                      # of the sweep, and this scan's drift is five times
                      # ctxl_HT's.  check_data_read.py reports the actual reach
                      # once the random displacement and correct_correct3D.txt
                      # are both there; at nobj = 4096 it WILL report the reach
                      # outside nobj/2, and that is expected here rather than a
                      # fault -- mask_oob is what handles it.
                      #
                      # Step 4's
                      #     padx0 = (nobj - n/eff_mag) / 2 - r
                      # goes negative at planes 2, 3 and 4 now and is clamped to
                      # 0.  The clamped region is outside the sample, where
                      # curlySback returns 0 and exp(0)=1 already equals what the
                      # ramp would give, so nothing real is lost there.

rotation_center_shift=-29.48  # FROM ESRF'S nabu CONFIGURATION FOR THIS SCAN.
                      # <pfile>_/naburec/nabu_final_cm.conf states
                      #     rotation_axis_position = 1008.76
                      # on <pfile>_rec_.nx, whose <pfile>_rec_.info gives
                      #     Dim_1 = 2048   PixelSize = 0.00899998 um
                      # nabu measures from the 0-based centre (2048-1)/2 =
                      # 1023.5 and the grid is 2x2 binned against this scan's
                      # 4.5 nm voxel, so
                      #     (1008.76 - 1023.5) x 2 = -29.48 raw px
                      # UNPADDED: Dim_1 = 2048 = 4096/2 exactly, so unlike
                      # ctxl_HT (3216) there is no pi/2 crop in the arithmetic.
                      # All six horizontal confs in the drop agree on 1008.76
                      # (nabu.conf, nabu_final.conf, nabu_final_cm[_even|_odd]
                      # .conf, nabu_correct3D.conf); only nabu_correct3D_v.conf,
                      # the vertical pass, differs, at 1009.082309.
                      # steps15.py and check_data_read.py re-derive this from
                      # the drop on every run and warn if this line is more than
                      # half a pixel away, so it is checked, not trusted.
                      #
                      # THE AXIS AND correct_correct3D.txt ARE ONE PAIR.
                      # nabu_final_cm.conf reads ../correct_correct3D.txt, the
                      # same file step 3 reads, so 1008.76 is the axis THAT
                      # correction was fitted with.  Re-quote both together or
                      # neither -- rotation_center_shift and the x column of
                      # cshifts_final go into the SAME slot (steps15.py,
                      # reader.py), so only their sum is defined.
                      #
                      # WAS +44.20, FROM THE PyHST .par.  DO NOT GO BACK.
                      # <pfile>_rec_.par says ROTATION_AXIS_POSITION =
                      # 1046.598214, 1-based, giving (1046.598214 - 1024.5) x 2
                      # = +44.196.  That is 73.68 raw px from nabu, and it is
                      # the .par that is wrong: it was written 2026-09-07 13:18
                      # by the octave driver BEFORE the alignment pass, whereas
                      # naburec/ landed 2026-09-08 07:57 with horizontal_search
                      # = true (naburec/alignment_config.conf) and is what the
                      # reconstruction Peter actually ran used.  On every other
                      # scan of the beamtime the two agree, which is how the
                      # outlier is identifiable rather than a coin toss:
                      #     scan              PyHST .par     nabu      diff
                      #     AtomiumS1 FT       +10.53      +10.74     0.21 px
                      #     ctxl_HT 4K         -18.87      -15.77     3.10 px
                      #     AtomiumS1 HT       +44.20      -29.48    73.68 px
                      # esrf_meta.nabu_axis prefers naburec over the .par for
                      # exactly this reason and logs the .par as a cross-check.
                      #
                      # THE FT SIBLING'S AXIS IS +10.74 AND IS *NOT* USED HERE.
                      # ../AtomiumS1, the FT scan of this same sample, has its
                      # own naburec giving (1028.87 - 1023.5) x 2 = +10.74.
                      # Borrowing a sibling's axis is the rule only when a scan
                      # has nothing of its own -- ../ctxl_FT does that -- and
                      # this scan now has Peter's own nabu run, so it does not.
                      # The 40.2 px between them is a real difference in stage
                      # position, the same way ctxl_HT and ctxl_FT are 25.6 px
                      # apart a day apart.
                      #
                      # It does NOT enter steps 3-4, so changing it costs only
                      # start_step=5.  MUST match all three
                      # config_step6_bin*.conf.
                      # estimate_center.py and step5_center_sweep.py are here to
                      # measure it locally if the ESRF numbers ever look wrong;
                      # on AtomiumS1 FT the mirror test agreed with nabu to
                      # 0.3 px while an entropy sweep was 8 px out, so trust the
                      # mirror test and ESRF, not a focus metric.
paganin=35            # delta/beta ratio for multi-distance Paganin (step 5).
                      # SET BY INSTRUCTION.  It sits right on the energy-scaled
                      # value: Peter's octave driver for the other Atomium scans
                      # uses 120 at 33.35 keV, and 120*(17.1/33.35)^2 = 32 at
                      # this energy.
                      # NOT Peter's number for this scan.  ht_<pfile>.m sets
                      # delta_beta = 150 and calls it "ad-hoc" in the comment
                      # right next to it; the physical values he lists there are
                      # 1153 (H2O) and 175 (Si) at 17.1 keV.
                      # Also not ../AtomiumS1's 20 -- the FT scan of THIS SAME
                      # sample runs the lower ratio, so the two volumes are not
                      # started from identical filters.  That matters less than
                      # it would elsewhere: this scan has four distances instead
                      # of one, so the transport filter is doing much less of
                      # the work here, and step 6 refines away from the init in
                      # any case.  For reference, ctxl_HT uses 60, on stained
                      # cortex at the same energy.
                      # Re-running step 5 alone is cheap (start_step=5), so
                      #     python show_slices.py config_steps15.conf 2
                      # and trying 20 instead costs almost nothing.
                      # MUST match paganin in all three config_step6_bin*.conf:
                      # step 5 writes /exchange/obj_init_re{paganin}_{bin} and
                      # step 6 reads that exact name.
rhapp_bin=2           # rhapp.mat is in the pixels of the 2x2-BINNED detector grid
                      # Peter's pipeline ran on (bin_factor = 2 in ht_<pfile>.m),
                      # while every other shift source here is in raw detector
                      # pixels, so step 3 scales rhapp up by this before summing.
                      # 0 = derive it automatically: rhapp.mat stamps its own
                      # `pixelsize` (8.99998 nm here) and dividing by this scan's
                      # 4.5 nm voxel gives 2 exactly, with the driver's bin_factor
                      # only as a fallback.  Pinned to 2 explicitly so a run does
                      # not depend on either being readable; step 3 warns if the
                      # pinned value and the recorded pixel size disagree.
                      #
                      # The x2 was MEASURED on ctxl_HT, two independent ways --
                      # adjacent-plane cross-correlation of one projection
                      # resampled onto a common object grid, and step 6 with
                      # rho[pos] free walking the plane-2 positions out to 2.07x
                      # the input spacing.  Both are written up in
                      # ../ctxl_HT_4K_RD300_007p5nm/README.md.  It is the same
                      # driver, the same bin_factor and the same 9 nm stamp
                      # here, so it is not re-measured -- but if a bin-2 step-6
                      # run walks the plane positions systematically outward,
                      # that is this factor being wrong and it is worth redoing.
correct3d_bin=2       # correct_correct3D.txt is in 2x2 BINNED detector px.
                      # THE FILE IS PETER'S OWN, dropped 2026-09-08 07:57
                      # alongside naburec/.  4001 rows, and it is the file
                      # naburec/nabu_final_cm.conf reconstructed with, so it
                      # pairs with rotation_center_shift = -29.48 above.
                      #
                      # IT REPLACED A TRANSPLANT, and the transplant was wrong.
                      # From 2026-09-07 to 2026-09-08 this scan carried the HT
                      # sibling's file (ctxl_HT x 7.5/4.5 = 1.666667, row for
                      # row on the shared 0..180 deg / 0.045 deg angle list).
                      # Against Peter's real file that assumption does not hold:
                      # least-squares fitting his file against the verbatim
                      # ctxl_HT source gives
                      #     horizontal  scale 1.4148  corr 0.9740  resid 1.85 px
                      #     vertical    scale 1.7445  corr 0.9981  resid 0.26 px
                      # so the horizontal -- the column we had judged the strong
                      # one, on the ctxl_HT vs Atomium_S1_FT fit -- was the one
                      # the transplant got wrong, by 18% in amplitude with
                      # 1.85 px rms left over out of a 25 px range.  The
                      # vertical came out within 5%.  Worth remembering before
                      # transplanting correct3D between scans again: the curve
                      # repeats in SHAPE (corr 0.97-1.00) but its amplitude is
                      # not simply the voxel ratio.
                      #
                      # Peter's file:  ptp 25.269 x 21.479 binned px
                      #                = 50.54 x 42.96 RAW px
                      #    horizontal mean +1.7135 binned = +3.427 RAW px,
                      #    which is degenerate with rotation_center_shift -- but
                      #    -29.48 was fitted WITH this file in place, so the two
                      #    already account for each other and nothing is to be
                      #    added.
                      # The dead transplant would have been ptp 34.18 x 20.54
                      # binned, i.e. 35% too wide horizontally.
                      #
                      # correct_correct3D_v.txt also landed.  It is NOT read by
                      # this pipeline and does not need to be: its horizontal
                      # column is identically zero and its vertical column is
                      # bit-for-bit the vertical column of correct_correct3D.txt
                      # (ptp 21.4793, mean 0.0034 in both).  It exists only for
                      # Peter's own vertical-only nabu pass
                      # (naburec/nabu_correct3D_v.conf).
                      # <pfile>_rec_.info records
                      #     Dim_1 = 2048   PixelSize = 0.00899998 um
                      # against this scan's own 4.5 nm voxel, so his fit grid is
                      # 2x2 binned and the file scales by 2 -- the same factor
                      # rhapp_bin already carries, and the same one ht_<pfile>.m
                      # sets as bin_factor.
                      #
                      # 0 = derive the factor from <pfile>_rec_.info's PixelSize
                      # instead of pinning it here.
                      #
                      # <pfile>_rec_.info WAS re-read when Peter's file landed
                      # and still gives PixelSize 0.00899998 against a 4.5 nm
                      # voxel, so correct3d_bin stays 2.  On
                      # ctxl_HT the drop first landed one level too deep, at
                      #     <pfile>_/<pfile>_/correct_correct3D.txt
                      # which step 3 would have read as zeros;
                      # esrf_meta.find_drop_file looks in both places and says
                      # which one it used, so a deep drop is caught rather than
                      # silently zeroing the correction.
                      #
                      # Expect (4001, 2) for 4000 angles: the grid is 0..180
                      # inclusive (TOMO_N 4000 x 0.045 deg = 180), so the last
                      # row is the repeat and step 3 drops it, with a log line.
                      # Columns are nabu's (horizontal, vertical), which the
                      # [:ntheta, ::-1] read turns into our (y, x).
ref_dist=2            # reference distance index for motion-shift baseline (step 3)
                      # 0-based, so this is PLANE 3 -- reference_plane = 3 in
                      # Peter's driver, and correct_motion.txt should therefore
                      # appear in <pfile>_3_/.
                      # reference_motion.mat states reference_plane = 3
                      # independently; step 3 and check_data_read.py both check
                      # this value against it.
                      # NOTE this differs from ctxl_HT (ref_dist = 1) and from
                      # ../AtomiumS1 FT (ref_dist = 0, which is forced -- it has
                      # only one plane).  It is per-scan, not per-sample.
log_level=INFO
