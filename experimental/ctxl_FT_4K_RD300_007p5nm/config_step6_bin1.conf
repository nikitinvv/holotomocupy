# ctxl cortex tissue, SINGLE-distance FT, +-300 px random displacement, 7.5 nm
# voxels -- ESRF ID16A 2026-08-29..31, proposal ihls3888, attempt _0003.
# BH reconstruction (step 6) -- hierarchical level bin=1 (2x2 binning).
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1200   0           1025    1025
#   config_step6_bin1.conf  1    2048  2400   1024        1281    257
#   config_step6_bin0.conf  0    4096  4800   1280        1537    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter)
# and Reader.read_checkpoint upsamples obj, prb and pos from the previous
# level's grid.  Iteration numbering is cumulative across the whole ladder, and
# checkpoint_step=32 divides every start_iter and every niter-1 so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# lower the next level's start_iter to the last checkpoint that landed.
#
#   qsub polaris_run.sh                                    # all four stages
#   qsub -v CONFIG=config_step6_bin1.conf polaris_run.sh   # or one at a time
#
# EVERY LONG NOTE LIVES IN config_step6_bin2.conf -- how this single-distance
# scan differs from ../ctxl_HT_4K_RD300_007p5nm, where rotation_center_shift
# came from, why rho[tp] is zero, and why mask_oob has nothing to drop here.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec   # steps15 output dir
in_file=ctxl_FT_4K_RD300_007p5nm_0003.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec6  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file is NOT set here and must not be: this level inherits obj, prb and
#       pos from the bin-2 checkpoint named by start_iter below.

nchunk=8             # projections per GPU batch -- lower it first if bin 1 runs out of
                      # GPU memory.  2x the HT scan's, because chunk memory goes
                      # as nchunk*ndist*nz*n and ndist is 1 here instead of 4.
ntheta=12000          # projection angles, 0..179.985 deg in 0.015 deg steps
start_theta=0         # index of first projection angle
ndist=1               # number of distances (z1 = 6.163535 mm, the HT scan's plane 1)

niter=1281           # last iteration executed is 1280
start_iter=1024       # resumes from checkpoints/checkpoint_1024.h5, written by the bin-2 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048               # vertical detector size   = 4096 / 2**1
n=2048                # horizontal detector size = 4096 / 2**1
nzobj=2400            # vertical object size     = 4800 / 2**1
nobj=2400            # horizontal object size   = 4800 / 2**1
bin=1                 # binning level; needs start_level_rec <= 1 in config_steps15.conf

rotation_center_shift=+9.80  # rotation axis offset from grid centre, in bin-0
                      # pixels; MUST match config_steps15.conf and the other two
                      # step-6 configs.
                      #
                      # MEASURED 2026-09-08 from the post-scan retakes (frames
                      # 12002/12000 and 12002/11999, seconds apart):
                      # estimate_center.py --retakes on --bands 4 gives
                      # +9.82 +- 0.41 px, 4 of 8 bands kept.  The output is
                      # used as printed, not negated -- the same command reads
                      # -20.09 on ctxl_HT against nabu's -15.77 and +13.34 on
                      # AtomiumS1 FT against nabu's +10.74.  Honest band about
                      # +6 to +14.  Full note in config_steps15.conf and
                      # config_step6_bin2.conf.
                      #
                      # This replaced -15.77, ctxl_HT's nabu value borrowed
                      # because this scan has no naburec/ of its own; the FT
                      # stage position is 25.6 px away from the HT one.
paganin=60            # MUST match paganin in config_steps15.conf.  Not actually
                      # read at this level -- the object comes from the previous
                      # checkpoint -- but kept equal so the four configs cannot
                      # drift apart.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour.
                      # At ndist=1 the kept fraction should be ~1.000; anything
                      # much lower means a shift file is in the wrong units.
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=5e-5   # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.04,0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # rho[tp] = 0 because the shrinkage was MEASURED to be
                      # zero on this scan's own retakes -- numbers and the
                      # reasoning in config_step6_bin2.conf.  If estimate_rho
                      # ran at bin 2, copy its winning rho[prb] and rho[pos]
                      # here by hand; they are not stored in the checkpoint.
estimate_rho=False    # only worth running at bin 2 -- see config_step6_bin2.conf
rho_estimate_niter=16 # iterations per trial
log_level=INFO
