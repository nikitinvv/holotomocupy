# ctxl cortex tissue, 4-distance HT, +-300 px random displacement, 7.5 nm
# voxels -- ESRF ID16A 2026-08-29..31, proposal ihls3888.
# BH reconstruction (step 6) -- hierarchical level bin=2 (4x4 binning).
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1264   0           513     513
#   config_step6_bin1.conf  1    2048  2528   512         769     257
#   config_step6_bin0.conf  0    4096  5056   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub polaris_run.sh                                    # all four stages
#   qsub -v CONFIG=config_step6_bin2.conf polaris_run.sh   # or one at a time
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec   # steps15 output dir
in_file=ctxl_HT_4K_RD300_007p5nm_0001.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec6  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: DELIBERATELY UNSET, and there is currently no way to set it.  The
#       NFP companions (projections/<pfile>_NFP_before_000k.nx) are HDF5 VIRTUAL
#       datasets pointing at ../../../../RAW_DATA/..., which was not transferred
#       to eagle, so all 70 x 4096^2 frames read back as zeros.  (The projection
#       .nx files are virtual and empty for the same reason -- under ewoks the
#       .nx carries geometry only and the pixels are in the <pfile>_k_/*.edf
#       trees, which is what esrf_layout.py reads.)  On top of that, step0.py was
#       copied from the 2025 folders and expects the bliss <pfile>_NFPwS_1_/ EDF
#       directory, so it would need a layout adaptation even with the raw data in
#       hand; see the Probe section of README.md.  Without it step 6 starts from
#       a flat probe and refines it -- rho[1]=0.05 below.  If a measured probe
#       ever appears, uncomment the line below in this (bin-2) config only; bins
#       1 and 0 inherit the probe from the previous level's checkpoint.
# prb_file=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec/nfp_results.h5

nchunk=16             # projections per GPU batch -- lower it first if bin 2 runs out of GPU memory
ntheta=4000           # projection angles, 0..180 deg in 0.045 deg steps
start_theta=0         # index of first projection angle
ndist=4               # number of distances (z1 = 6.164, 6.428, 7.486, 9.682 mm)

niter=513             # last iteration executed is 512
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size   = 4096 / 2**2
n=1024                # horizontal detector size = 4096 / 2**2
nzobj=1264            # vertical object size     = 5056 / 2**2
nobj=1264             # horizontal object size   = 5056 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=-19.22  # rotation axis offset from grid centre, in
                      # bin-0 pixels; MUST match config_steps15.conf.
                      # Measured on 2026-08-31 from the one exactly-opposed
                      # frame pair this scan has (0 / 4000, 180.000 deg),
                      # WITH correct_motion.txt installed -- never change one
                      # without the other, they are a reparametrisation of each
                      # other.  estimate_center.py --pairs 1 --motion, three
                      # horizontal bands, repeated at three crops:
                      #     crop 2048  -19.22 +- 1.70   (bands -17.5 -21.6 -18.6)
                      #     crop 2560  -20.18 +- 1.30   (bands -18.4 -21.6 -20.5)
                      #     crop 3072  -18.16 +- 3.27   (bands -14.5 -17.6 -22.4)
                      # All nine bands together: mean -19.2, scatter 2.4 px.
                      # Without correct_motion.txt it is -19.72 +- 1.26, i.e.
                      # the drift barely moves it -- unlike ../Y350a_largedisp_006nm,
                      # where the same swap was worth 2.3 px -- because this
                      # scan's horizontal drift is only 2.1 px peak to peak and
                      # an opposed pair sees half of that.
                      # 4000 projections over 180 deg give exactly ONE opposed
                      # pair, so there is no averaging over pairs to be had and
                      # +-1.7 px is as far as this method goes here.  That is
                      # 14 nm, enough to soften a 7.5 nm reconstruction, so
                      # REFINE IT: run step5_center_sweep.py once steps 1-5
                      # have written the binned data, and put the winner here
                      # and in config_steps15.conf before starting bin 2.
                      # See center_estimate.png.
paganin=20            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# Rec._build_data_mask samples the object plane at
#     x = eff_demag*(tx - (n-1)/2) - r_x + (nobj-1)/2,   eff_demag = (1+shrink)/norm_mag
# and drops the detector pixels whose cubic B-spline taps land outside the
# grid.  Two separate things push pixels out here, and only one of them is a
# problem:
#
#   the displacement.  +-300 detector px at plane 1 is +-471 object px at
#   plane 4 (300/0.6366).  nobj = 5056 gives (5056-4096)/2 = 480 px of margin
#   per side, 9 px more than that, so the sweep itself never runs off the
#   edge.  This is what nobj was sized for -- see the derivation in
#   config_steps15.conf.
#
#   the demagnification.  Plane 4 has eff_demag = 1.571, so its detector
#   back-maps onto 4096*1.571 = 6434 object px, well past a 5056 grid, and no
#   affordable nobj fixes that (covering it needs 7424, i.e. 1.47x linearly
#   and 3.2x the volume).  It does not need fixing: the outer ring of a
#   demagnified plane looks at object coordinates the reference plane never
#   sees, so nothing there is constrained by the rest of the data anyway.
#
# Expected kept fractions at startup, which Rec._build_data_mask logs:
#     plane 1  1.000     plane 3  0.87 .. 1.00  (displacement-dependent)
#     plane 2  1.000     plane 4  0.616         (flat, the box just translates)
# Same situation as ../Y350a_HT (nobj 4608 against a 6500 px plane-4
# footprint), which reconstructed fine.  F0 keeps its 1/(ntheta*ndist*nz*n)
# normalization, so err in conv.csv scales with the kept fraction and is NOT
# comparable across runs with different nobj.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=2.5e-5  # 3-D Laplacian regularisation weight
rho=1.0,0.05,0.04,0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # obj/prb/pos carried over from ../Y350a_HT, the closest
                      # comparable ladder: 4 distances, ntheta=4000, n=4096,
                      # same detector and beamline.  They are a starting point,
                      # not a measurement for THIS sample.
                      #
                      # rho[tp] = 0: SHRINKAGE IS MEASURED, NOT ASSUMED.
                      # A shrinking sample makes a post-scan retake a SCALED
                      # copy of the frame it repeats, so the residual
                      # displacement field between them acquires a slope, and
                      # that slope is the shrinkage.  estimate_shrink.py reads
                      # it off this scan's own two retakes:
                      #     omega=90 vs frame 2000 (half the scan)
                      #         A_y =  +54 +- 294 ppm   A_x =  -30 +- 389 ppm
                      #     omega=0  vs frame 0    (the whole scan)
                      #         A_y = +107 +- 210 ppm   A_x =   +3 +- 141 ppm
                      # Every term is inside 1 sigma of zero, and the two pairs
                      # agree with each other, so the 2-sigma upper limit on
                      # the shrinkage over the whole scan is |A| < 420 ppm =
                      # 0.86 px at the frame edge.  There is also no
                      # shrink_list.mat for this scan, so init_tp_from_shrink()
                      # starts the model at A = B = 0; with rho[tp] = 0 it
                      # stays there and the term is simply absent.
                      #
                      # This is not caution, it is the measured result -- and
                      # the same one the ../Y350a_largedisp* ladders reached.
                      # There, leaving rho[tp] non-zero let the optimizer
                      # invent ~2200 ppm of edge displacement, 8x that scan's
                      # upper limit, by absorbing displacement that the
                      # position refinement should own; ../fig09_shrink_vs_noshrink.py
                      # shows the resulting 15-24 % loss.  With +-300 px of
                      # random displacement, this scan is exposed to exactly
                      # that failure mode.  Make the last element non-zero
                      # again only for a scan that actually measures a
                      # shrinkage.
estimate_rho=False    # True runs BH's coordinate search over rho[prb] then
                      # rho[pos] (Rec.estimate_rho_coord): 2 variables x 3 rungs
                      # x rho_estimate_niter silent iterations = +96 here, i.e.
                      # +19 % on niter=513.  Worth considering at bin 2 only --
                      # it starts from the Paganin guess and its trials are 16x
                      # cheaper than bin 0's.  Since the rho above is inherited
                      # rather than tuned for this sample, this is the cheapest
                      # way to check it.  Winners are logged at WARNING level as
                      # "estimate_rho_coord: final rho = [...]" and are NOT
                      # stored in the checkpoint -- copy them into the bin-1 and
                      # bin-0 configs by hand.
rho_estimate_niter=16 # iterations per trial
log_level=INFO
