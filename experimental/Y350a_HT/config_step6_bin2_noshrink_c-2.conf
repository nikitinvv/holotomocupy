# ===========================================================================
# CENTRE SWEEP -2 -- generated 2026-08-25 from config_step6_bin2_noshrink.conf.
# Only rotation_center_shift and path_out differ; path is the shared
# ..._rec dir, whose _obj.h5 must have been written by
# config_steps15_c-2.conf immediately before this ladder starts.  noshrink only:
# the sweep is about the rotation axis, and adding the shrink variant
# would double six ladders for a question it does not answer.
# ===========================================================================
# Y350a, HT scan, 20 nm, 4 distances -- ESRF ID16A 2025-06-04.
# BH reconstruction (step 6) -- hierarchical level bin=2 (4x4 binning).
#
# FIXED-SHRINKAGE VARIANT of config_step6_bin2.conf: rho[tp]=0, so the linear
# shrinkage model stays at the fit init_tp_from_shrink() makes from the measured
# profile and is never refined.  Separate path_out (..._noshrink), so this ladder
# and the shrinkage one never share a checkpoint.  Same input file, and steps 1-5
# are shared -- do not re-run them.  Driver: polaris_run_noshrink_c-2.sh.
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                            bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2_noshrink_c-2.conf 2    1024  1152   0           513     513
#   config_step6_bin1_noshrink_c-2.conf 1    2048  2304   512         769     257
#   config_step6_bin0_noshrink_c-2.conf 0    4096  4608   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub -v CONFIG=config_step6_bin2_noshrink_c-2.conf polaris_run_noshrink_c-2.sh   # writes ckpt 0512
#   qsub -v CONFIG=config_step6_bin1_noshrink_c-2.conf polaris_run_noshrink_c-2.sh   # reads 0512, writes 0768
#   qsub -v CONFIG=config_step6_bin0_noshrink_c-2.conf polaris_run_noshrink_c-2.sh   # reads 0768, writes 1024
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_rec          # SHARED steps15 dir: holds Y350a_HT_nobin_020nm.h5 and the
                      # Y350a_HT_nobin_020nm_obj.h5 written by THIS centre's steps15 job
in_file=Y350a_HT_nobin_020nm.h5
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_rec6_noshrink_c-2         # step-6 output, SHARED by all three levels of THIS centre
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: set to nfp_results.h5 only if step0.py was run (needs an *_NFPwS_*
#           companion scan -- see config_step0.conf).  Left unset, so at bin 2
#           the probe starts from the flat field; bins 1 and 0 inherit it from
#           the previous level's checkpoint.
# prb_file=nfp_results.h5

nchunk=16            # projections per GPU batch -- lower it first if bin 2 runs out of GPU memory
ntheta=4000          # CONFIRM -- number of projection angles (show_geometry.py)
start_theta=0         # index of first projection angle
ndist=4               # number of distances

niter=513            # last iteration executed is 512
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024                # vertical detector size   = 4096 / 2**2
n=1024                 # horizontal detector size = 4096 / 2**2
nzobj=1152             # vertical object size     = 4608 / 2**2
nobj=1152              # horizontal object size   = 4608 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15_c-2.conf

rotation_center_shift=-2   # rotation axis offset from the grid centre,
                      # in FULL-RESOLUTION (bin 0) detector pixels.
                      #
                      # CENTRE SWEEP, 2026-08-25.  The main run used
                      # -10.386198 (derived from an axis measured on a
                      # bin-1 grid) and its reconstruction says that value
                      # is wrong, so six candidates are being run to the
                      # end instead of trusted: 0, -1, -2, -3, -4, -7.
                      # These are ABSOLUTE values, not offsets from
                      # -10.386198.  Everything else here is identical to
                      # config_step6_bin2_noshrink_c-2.conf.
                      # Both steps15.py and reader.py apply it as
                      #     r[...,1] += rotation_center_shift/2**bin + 0.5*(1/2**bin - 1)
                      # so the same number goes into the steps15 config and
                      # all three step-6 levels unchanged.
paganin=60            # MUST match paganin in config_steps15_c-2.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# nobj/n = 1152/1024 = 1.125, but eff_demag = (1+shrink)/norm_magnification
# reaches 1.5585 on the farthest plane, so that plane's detector back-maps onto
# 1024 * 1.5585 = 1596 object pixels -- 444 more than the grid has.  From the
# four .info files, Distance = 17.229 / 17.958 / 20.863 / 26.852 mm, i.e.
#     norm_mag  = 1 / 0.95943 / 0.82582 / 0.64165
#     eff_demag = 1 / 1.04228 / 1.21092 / 1.55848
# Those out-of-grid pixels see only whatever the B-spline shift kernel's
# boundary condition invents outside the grid (a mirrored copy of the sample),
# so mask_oob drops them from the data fit instead of letting the residual
# there push into the probe and the in-grid object.  Rec._build_data_mask logs
# the surviving fraction per distance at startup; for this geometry it is
#     dist 0/1/2/3 = 100 / 100 / 83 / 50 %,  83 % overall
# and the same at bins 1 and 0, which have the same n/nobj ratio (the +-12.5 px
# correct.txt and +-13 px correct_motion.txt displacements are negligible next
# to the demagnification here).  F0 keeps its 1/(ntheta*ndist*nz*n)
# normalization, so err in conv.csv scales with that fraction and is NOT
# comparable with a mask_oob=0 run.
#
# This makes the fit correct on the pixels it keeps; it does NOT recover the
# discarded ones.  Only a larger object grid does that -- nobj = 6400 at bin 0
# (ceil(4096/0.64165/64)*64, i.e. 3200/1600 at bins 1/2), which is what steps15
# would auto-compute.  That is 2.7x the volume of 4608^3, so the step-5 object
# alone would go from 783 GB to 2.1 TB; the grid stays at 4608 and the outer
# pixels are masked instead.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=2.5e-5       # 3-D Laplacian regularisation weight
rho=1.0,0.05,0.04,0
# Tune rho before the run instead of trusting the numbers above.  BH
# coordinate-searches rho[prb], then rho[pos], then rho[tp] over
# {..., init/2, init, 2*init, ...}, scoring each rung with a silent
# rho_estimate_niter-iteration trial from the start state
# (Rec.estimate_rho_coord); rho[obj] is left alone.  Only worth doing at bin 2:
# it starts from the Paganin guess, and its trials are 16x cheaper than bin 0's.
# THREE variables are searched here, not two -- rho[3]=1e-5 > 0, so the
# shrinkage model is free and gets searched as well.  That is >= 9 trials
# (3 variables x 3 rungs) = 144 iterations on top of niter=513, i.e. +28%
# (../AtomiumL1_largedisp is 144/1025 = +14%), and more if a search has to walk
# away from its initial value.
estimate_rho=False
rho_estimate_niter=16
# The winners are logged as "estimate_rho_coord: final rho = [...]" at WARNING
# level and are NOT stored in the checkpoint, so bins 1 and 0 still take rho
# from their own configs -- copy the found numbers into them by hand.  Worth
# doing: bin 1 currently carries rho[tp]=1e-4 against this file's 1e-5, a 10x
# jump across what is only a change of binning.

log_level=INFO
