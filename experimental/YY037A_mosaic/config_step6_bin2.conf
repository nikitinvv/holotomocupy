path=/data2/vnikitin/20260416/YY037A_rec        # steps15 output: the 5 tile h5 + the mosaic _obj.h5
path_out=/data2/vnikitin/20260416/YY037A_rec6_bin2
pfile=YY037A_HT_F2_100nm

# --- mosaic ---------------------------------------------------------------
tiles=farright,right,center,left,farleft
scan_suffix=0001

nchunk=4              # projections per GPU batch (4x the bin-3 frame area)
ntheta=900            # number of projection angles (matches steps15 ntheta_rec)
start_theta=0
ndist=4               # distances PER TILE; step6.py expands to 4 x 5 = 20

niter=1025
start_iter=0
checkpoint_step=32
error_step=32

nz=512                # 2048 >> 2
n=512
nzobj=896             # height = steps15 nzobj/2**bin =  3584/4
nobj=3072             # width  = steps15 nobj /2**bin = 12288/4
bin=2                 # the level config_steps15.conf currently reconstructs
shift_type=cubic

rotation_center_shift=0
paganin=40            # must match the tag in obj_init_re{paganin}_{bin}
obj_dtype=complex64
mask=1.0              # see config_step6_bin3.conf

lam_prbfit=3.1e-3
lam_laplacian=3e-4
rho=1,0.05,0.02,1e-4  # object, probe, positions, tp (linear shrink params A, B)

estimate_rho=true     # see config_step6_bin3.conf
rho_estimate_niter=8

log_level=INFO

# Host RAM: the object, its gradient and its conjugate direction are pinned
# host arrays of local_nzobj x 2848 x 2848 complex64 each — 55 GB / nranks per
# copy, so ~21 GB per rank on 8 ranks, before proj / proj_tmp / data. Bin 3 is
# 8x smaller; get that converging first.
