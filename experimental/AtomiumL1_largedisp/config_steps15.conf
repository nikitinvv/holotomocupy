# AtomiumL1, FT large random displacement scan, 14 nm, 1 distance -- ESRF ID16A,
# proposal ihmi1591, beamtime 2025-06-07/08 (.info says "Sun Jun 08 17:12:05
# 2025"), on tomo5 at /data3/vnikitin/ESRF/atomium/20250607/AtomiumL1.
#
# Same sample, same optics and the same near plane (z1 = 6.113 mm) as
# AtomiumL1_HT: this is the single-distance counterpart, acquired two hours
# earlier, where the information that HT gets from 4 propagation distances
# comes instead from +-300 px random displacements of the sample between
# projections.
#
# Distance directory globbed by steps15.py:
#     <path>/<pfile>_[0-9]_/  ->  AtomiumL1_FT_large_rand_disp_014nm_1_/
# The NFPwS_1_ and NFPwCA_1_ companions are not matched by that glob.

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1                                                  # raw data root (holds <pfile>_1_/)
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_FT_large_rand_disp_014nm_rec   # output directory
pfile=AtomiumL1_FT_large_rand_disp_014nm                                             # scan prefix name

# Geometry, as printed by `python show_geometry.py config_steps15.conf`
# (verified against the raw data on 2026-08-22):
#     ndist=1   ntheta=1800   detector 2048x2048   nref=21   ndark=20
#     energy=33.35 keV   focus-to-detector=1.289 m   sx0=1.280 mm
#     z1 = 6.113 mm   magnification = 210.86   norm_magnification = 1
#     distance = 6.084 mm   voxelsize = 14.00 nm
# Identical to AtomiumL1_HT's first plane, as expected.

start_step=3          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp

# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
nlevels=3             # 2048 / 1024 / 512
start_level_rec=2     # FINEST binning level to reconstruct (0 = full resolution)
                      # Disk cost, one distance only:
                      #   step 1 projections            1800 x 2048^2 x 4 B =  30 GB
                      #   step 4 binned  bin0/1/2                    30 / 7.5 / 1.9 GB
                      #   step 5 object  bin0 2688^3 x 8 B           155 GB
                      #                  bin1 1344^3 x 8 B            19 GB
                      #                  bin2  672^3 x 8 B           2.4 GB
                      # ~250 GB in total (/data3 had 94 TB free 2026-08-23).

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=2048                # detector crop size at full resolution (bin 0) = the full EDF frame

nobj=2048             # stitched object size at full resolution (bin 0).
                      # NOT the auto value.  With a single distance
                      # norm_magnification is 1, so steps15 would auto-compute
                      # nobj = n = 2048 -- exactly the detector footprint, with
                      # no room for the displacements.  correct.txt spans
                      #     y in [-299.74, +299.30] px,  x in [-298.90, +299.50] px
                      # at norm_magnification 1, so the footprint sweeps
                      # 2048 + 2*300 = 2648 px.  2688 = 42*64 covers that in
                      # full; 2688/2 = 1344 and 2688/4 = 672 bin cleanly over
                      # all three levels.
                      # (Y350a_largedisp faced the same +-300 px sweep on a
                      # 4096 px detector and chose 4608 = 4096+512, which is
                      # 88 px SHORT and relies on steps15 clamping the per-
                      # projection pad offsets to [0, nobj].  Here there is no
                      # reason to clip: 2688 costs 155 GB at bin 0 against
                      # 141 GB for a clipped 2560, so take the full margin.)

rotation_center_shift=-11.5  # rotation axis offset from grid centre (pixels)
                      # MEASURED ON THIS SCAN, at the bin-1 level, where the
                      # axis sits 6.0 px left of the 1024-wide grid centre.
                      # Converting that to the bin-0 number this key wants:
                      # step 4 bins by averaging pixel PAIRS
                      #     0.5*(datak[::2,:] + datak[1::2,:])
                      # so bin-1 pixel i covers bin-0 pixels 2i and 2i+1 and is
                      # centred at bin-0 coordinate 2i + 0.5.  Hence
                      #     c_bin0 = 2*c_bin1 + 0.5
                      #     rcs_bin0 = c_bin0 - n/2 = 2*rcs_bin1 + 0.5
                      #              = 2*(-6.0) + 0.5 = -11.5
                      # Check it against the rescaling reader.py applies:
                      #     rcs*scale + 0.5*(scale - 1),  scale = 1/2**bin
                      #     -11.5 at bin 1 -> -6.00  (the measured value, exact)
                      #     -12.0 at bin 1 -> -6.25  (half a pixel off)
                      # so -11.5, not the -12 you get by doubling alone.
                      #
                      # This REPLACES the -14.375964 borrowed from
                      # ../AtomiumL1_HT/config_steps15.conf (PyHST par file
                      # AtomiumL1_HT_014nm_/AtomiumL1_HT_014nm_rec_.par,
                      # ROTATION_AXIS_POSITION = 1009.624036 on a 2048 grid ->
                      # 1009.624036 - 1024).  That was the HT scan's axis, and
                      # the two scans are two hours apart on the same stage, so
                      # a ~2.9 px drift between them is unremarkable; a value
                      # measured on this scan wins over one borrowed from the
                      # other.  AtomiumL1_HT keeps its own -14.375964.
paganin=120           # delta/beta ratio for multi-distance Paganin (step 5).
                      # Same as AtomiumL1_HT so the two reconstructions stay
                      # comparable.  CONFIRM on a bin-2 slice.
ref_dist=0            # reference distance index for motion-shift baseline (step 3)
log_level=INFO        # DEBUG, INFO, WARNING, ERROR

# --- Shift sources present in the raw directory (checked 2026-08-22) --------
#   correct.txt           in <pfile>_1_/  (1801 rows, +-300 px)                YES
#   correct_motion.txt    in <pfile>_1_/                                        no -> zeros
#   rhapp.mat             in <pfile>_/                                          no -> zeros
#   correct_correct3D.txt in <pfile>_/                                          no -> zeros
#   shrink_list.mat       in <pfile>_1_/                                        no -> shrink = 0
# With a single distance, zeros are the right answer for rhapp (it is an
# inter-plane correction) and for the motion baseline; steps15 logs a warning
# for each.  Same situation as Y350a_largedisp.
