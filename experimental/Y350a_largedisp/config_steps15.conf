path=/eagle/APS_IRI/vnikitin/20250604 # raw data root (holds <pfile>_1_/)
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_020nm_rec         # output directory
pfile=Y350a_FT_large_rand_disp_nobin_020nm                               # scan prefix name

# Scan geometry.  CONFIRM ALL OF THIS: the block below was read off the wrong
# directory (a 006nm scan) before the pfile was corrected to _nobin_020nm, so
# only ntheta and the detector size have been checked against the real data.
# Re-derive with:  python show_geometry.py config_steps15.conf
#   ndist=1   ntheta=4000   detector 4096x4096          <- confirmed 2026-08-22
#   nref=21   ndark=20                                  <- CONFIRM
#   energy=33.35 keV   focus-to-detector=1.289 m        <- CONFIRM
#   z1=5.24 mm   magnification=246.0                    <- CONFIRM (was the 006nm value)
#   detector pixel=1.4760 um   voxelsize=6.000 nm       <- WRONG: a 020nm scan
#                                                          has ~20 nm voxels
# There is no NFP companion scan and no <pfile>_ aux directory for this
# dataset, so step 3 gets encoder shifts from correct.txt only (rhapp.mat,
# correct_motion.txt and correct_correct3D.txt are all absent and default to
# zeros, which is correct for a single distance).

start_step=1          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so the pair below produces bins 2 (4x4), 1 (2x2) and 0 (1x1) -- exactly the
# three levels the config_step6_bin{2,1,0}.conf files reconstruct.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=0     # FINEST binning level to reconstruct (0 = full resolution)
                      # Cost of including bin 0: the step-5 volume is
                      # 4608^3 float32 x 2 (re+im) = 783 GB in <pfile>_obj.h5,
                      # plus 4000 x 4096^2 x 4 B = 268 GB of bin-0 projections
                      # from step 4.  Check the eagle quota before running
                      # step 4/5 with start_level_rec=0; set it to 1 to stop at
                      # the 2x2 level.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=4608             # stitched object size at full resolution (bin 0).
                      # Set to 4608 to match Y350a_HT (same detector, same
                      # sample, and the sample sits inside the field of view).
                      # 4608 = 72*64; 4608/2 = 2304, 4608/4 = 1152, so it bins
                      # cleanly over all three levels.
                      # NOTE: the random displacements in correct.txt span
                      # y in [-299.74, +299.84], x in [-299.82, +299.62] px with
                      # norm_magnification 1, so the detector footprint sweeps
                      # 4096 + 2*300 = 4696 px -- 88 px wider than the grid.
                      # steps15 clamps the per-projection pad offsets to
                      # [0, nobj], so the extreme displacements are simply
                      # clipped; that is fine while the sample itself stays
                      # inside the FOV. Raise to 4800 if edge artefacts appear.

rotation_center_shift=-11.79  # rotation axis offset from grid centre, bin-0 pixels
                      # Inherited from an earlier reconstruction of this same
                      # 020nm scan, so it is plausibly right -- but unverified.
                      # TODO: re-measure.
                      # For reference, Y350a_HT measures -10.886198.
paganin=60            # delta/beta ratio for multi-distance Paganin (step 5)
ref_dist=0            # reference distance index for motion-shift baseline (step 3)
log_level=INFO        # DEBUG, INFO, WARNING, ERROR
