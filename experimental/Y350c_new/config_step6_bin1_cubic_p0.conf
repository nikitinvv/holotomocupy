path=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec_new          # input directory (steps15 output)
path_out=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec_new_cubic_deform_0 # output directory
pfile=Y350c_HT_015nm                                         # scan prefix name

nchunk=8              # projections per GPU batch
ntheta=1500           # number of projection angles
start_theta=0         # index of first projection angle
ndist=4               # number of distances

niter=769             # number of iterations
start_iter=512        # resume from this iteration (0 = start fresh)
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size (pixels)
n=1024                # horizontal detector size (pixels)
nzobj=1280            # vertical object size (pixels)
nobj=1280             # horizontal object size in x and y (pixels)
bin=1
shift_type=cubic

rotation_center_shift=145.07  # rotation axis offset from detector centre (pixels)
paganin=100           # delta/beta ratio for Paganin phase retrieval
obj_dtype=complex64   # object array dtype: float32 or complex64
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=1e-4    # 3-D Laplacian regularisation weight
rho=1,0.05,1e-8,1e-8  # gradient step scales: object, probe, positions, tp (tanh shrink params)

# Rho tuning (rec_mpi_shrink): if estimate_rho=True, BH first runs a coordinate
# search on rho[prb, pos, tp] centred on the values above, with short trials of
# rho_estimate_niter iters each, and then iterates with the found rho.
estimate_rho=False
rho_estimate_niter=16

pos_checkpoint=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec_new_cubic_deform/checkpoints/checkpoint_1280.h5  # positions (scaled by bin) and tp (unscaled) checkpoint (absolute path)
log_level=INFO
