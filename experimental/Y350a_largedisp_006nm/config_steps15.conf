path=/eagle/APS_IRI/vnikitin/20250604 # raw data root (holds <pfile>_1_/)
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec     # output directory
pfile=Y350a_FT_large_rand_disp_nobin_006nm                               # scan prefix name

# Scan geometry -- read off the real data with
#     python show_geometry.py config_steps15.conf
# on 2026-08-26, and cross-checked against
# <pfile>_1_/<pfile>_1_.info (PixelSize=0.006, TOMO_N=4000, ScanRange=-180):
#   ndist=1   ntheta=4000   detector 4096x4096
#   nref=21   ndark=20
#   energy=33.35 keV   focus-to-detector=1.289 m
#   z1=5.24 mm   magnification=246.0
#   detector pixel=1.4760 um   voxelsize=6.000 nm
#
# This is the 6 nm sibling of ../Y350a_largedisp (same sample, same beamtime,
# same detector, 20 nm voxels).  Everything that is not resolution-dependent is
# deliberately identical to that folder so the two can be compared.
#
# Auxiliary shift files: only correct.txt is present.  There is no <pfile>_
# aux directory, so rhapp.mat and correct_correct3D.txt are absent, and unlike
# the 20 nm scan there is no correct_motion.txt either (that scan's was built by
# ESRF from a quali.mat drift measurement this one never got).  All three
# default to zeros in step 3, which is the intended configuration here: the
# encoder displacements in correct.txt are the only shifts applied.

start_step=1          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so the pair below produces bins 2 (4x4), 1 (2x2) and 0 (1x1) -- exactly the
# three levels the config_step6_bin{2,1,0}.conf files reconstruct.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=0     # FINEST binning level to reconstruct (0 = full resolution)
                      # Cost of including bin 0: the step-5 volume is
                      # 4608^3 float32 x 2 (re+im) = 783 GB in <pfile>_obj.h5,
                      # plus 4000 x 4096^2 x 4 B = 268 GB of bin-0 projections
                      # from step 4.  Check the eagle quota before running
                      # step 4/5 with start_level_rec=0; set it to 1 to stop at
                      # the 2x2 level.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=4608             # stitched object size at full resolution (bin 0).
                      # Same value as ../Y350a_largedisp and ../Y350a_HT: same
                      # detector, same sample, same +-300 px displacements.
                      # 4608 = 72*64; 4608/2 = 2304, 4608/4 = 1152, so it bins
                      # cleanly over all three levels.
                      # NOTE: the random displacements in correct.txt span
                      # x in [-299.74, +299.84], y in [-299.82, +299.62] px with
                      # norm_magnification 1, so the detector footprint sweeps
                      # 4096 + 2*300 = 4696 px -- 88 px wider than the grid.
                      # steps15 clamps the per-projection pad offsets to
                      # [0, nobj], so the extreme displacements are simply
                      # clipped; mask_oob=1 in the step-6 configs drops exactly
                      # the detector pixels this can affect.

rotation_center_shift=-39.81 # rotation axis offset from grid centre, bin-0 pixels
                      # Convention (spelled out in ../Y350a_HT/config_steps15.conf):
                      #     rotation_center_shift = c - n/2
                      # with c the axis column on the bin-0 detector grid.
                      #
                      # MEASURED FROM THE DATA 2026-08-26, no prior value to
                      # inherit -- this scan has never been reconstructed.
                      #     python estimate_center.py config_steps15.conf
                      # mirrors the theta=0 and theta=179.955 deg frames about a
                      # trial axis (opposed projections are mirror images of
                      # each other, and Fresnel propagation commutes with a
                      # mirror, so this works on the raw holograms).  Result:
                      #     -39.81 +- 0.94 px   (4 of 9 band estimates kept)
                      # Only the two pairs closest to 180 deg survive at this
                      # voxel size; see the header of estimate_center.py for why,
                      # and center_estimate.png for the fit.
                      #
                      # Cross-check: the same script on the 20 nm sibling gives
                      # -11.07 +- 0.94 px against that folder's independently
                      # derived -10.966, and -11.07 px of 20 nm detector-plane
                      # offset is -36.9 px of 6 nm ones -- 3 px from the value
                      # above, i.e. the axis sits in the same physical place in
                      # both scans to within the measurement error.
                      #
                      # If reconstructions look doubled/smeared, sweep it:
                      #     python step5_center_sweep.py config_steps15.conf
paganin=60            # delta/beta ratio for multi-distance Paganin (step 5)
ref_dist=0            # reference distance index for motion-shift baseline (step 3)
log_level=INFO        # DEBUG, INFO, WARNING, ERROR
