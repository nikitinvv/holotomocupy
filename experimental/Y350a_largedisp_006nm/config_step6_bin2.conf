# Y350a, large random displacement, 6 nm voxels, 1 distance -- ESRF ID16A 2025-06-04.
# BH reconstruction (step 6) -- hierarchical level bin=2 (4x4 binning).
#
# NO SHRINKAGE CORRECTION anywhere in this folder: rho[tp]=0 at every level, so
# the linear shrinkage model stays at whatever init_tp_from_shrink() makes of it
# and is never refined.  There is no shrink_list.mat for this scan, so that init
# is A=B=0 and the model is simply absent -- unlike ../Y350a_largedisp, which
# carries both a shrinkage and a _noshrink ladder, this folder has one ladder
# and needs no suffix to tell them apart.
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1152   0           513     513
#   config_step6_bin1.conf  1    2048  2304   512         769     257
#   config_step6_bin0.conf  0    4096  4608   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub -v CONFIG=config_step6_bin2.conf polaris_run.sh   # writes ckpt 0512
#   qsub -v CONFIG=config_step6_bin1.conf polaris_run.sh   # reads 0512, writes 0768
#   qsub -v CONFIG=config_step6_bin0.conf polaris_run.sh   # reads 0768, writes 1024
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec     # steps15 output dir: holds <pfile>.h5 and <pfile>_obj.h5
in_file=Y350a_FT_large_rand_disp_nobin_006nm.h5
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec6   # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: unlike the 20 nm sibling this scan DOES have an NFP companion
#       (Y350a_FT_large_rand_disp_nobin_006nm_NFPwS_1_), so a measured probe is
#       available.  It is left unset by default -- run step0 first if you want
#       it, then uncomment the line below in this (bin-2) config only; bins 1
#       and 0 inherit the probe from the previous level's checkpoint.
# prb_file=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec/nfp_results.h5
nchunk=16            # projections per GPU batch -- lower it first if bin 2 runs out of GPU memory
ntheta=4000          # number of projection angles
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=513            # last iteration executed is 512
start_iter=0            # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024                # vertical detector size   = 4096 / 2**2
n=1024                 # horizontal detector size = 4096 / 2**2
nzobj=1152              # vertical object size     = 4608 / 2**2
nobj=1152               # horizontal object size   = 4608 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=-39.81  # rotation axis offset from grid centre, in bin-0
                      # pixels; MUST match config_steps15.conf.  Measured from
                      # opposed 0/180 deg projections on 2026-08-26 as
                      # -39.81 +- 0.94 px -- see the long note in
                      # config_steps15.conf and center_estimate.png.
paganin=60            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# One distance, so eff_demag = 1 and the detector footprint is exactly n wide;
# what leaves the grid here is the displacement, not the demagnification.
# correct.txt spans +-300 bin-0 px in both x and y, while the grid has only
# (4608 - 4096)/2 = 256 px of margin per side, so on the extreme projections
# the crop reaches 44 px past the edge and reads the shift kernel's mirrored
# copy of the sample instead of the sample.  mask_oob drops the pixels that can
# do this -- worst case over all angles, so the mask is the same for every
# projection and F does not change between iterations.  Rec._build_data_mask
# logs the kept fraction at startup (~94-95 %).  F0 keeps its
# 1/(ntheta*ndist*nz*n) normalization, so err in conv.csv scales with that
# fraction and is NOT comparable with a mask_oob=0 run.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=1e-4       # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.08,0  # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # Carried over from ../Y350a_largedisp (same sample and
                      # detector, 20 nm voxels); tp is frozen at 0.  These are a
                      # starting point, not a measurement -- this scan has never
                      # been reconstructed, and one distance constrains the probe
                      # much less than a 4-distance HT scan, so consider a search
                      # before committing 513 iterations:
                      #     estimate_rho=True
                      # makes BH coordinate-search rho[prb] then rho[pos] over
                      # {..., init/2, init, 2*init, ...}, scoring each rung with a
                      # silent rho_estimate_niter-iteration trial from the start
                      # state (Rec.estimate_rho_coord); rho[obj] is left alone and
                      # rho[tp]=0 is skipped, so it is 2 variables x 3 rungs = 96
                      # iterations on top of niter=513, i.e. +19%.  Only worth
                      # doing at bin 2: it starts from the Paganin guess and its
                      # trials are 16x cheaper than bin 0's.  The winners are
                      # logged as "estimate_rho_coord: final rho = [...]" at
                      # WARNING level and are NOT stored in the checkpoint, so
                      # copy them into the bin-1 and bin-0 configs by hand.
estimate_rho=False    # flip to True to run the search described above
rho_estimate_niter=16 # iterations per trial
log_level=INFO
