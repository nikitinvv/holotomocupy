# ctxl cortex tissue, SINGLE-distance FT, +-300 px random displacement, 7.5 nm
# voxels -- ESRF ID16A 2026-08-29..31, proposal ihls3888, attempt _0003.
# BH reconstruction (step 6) -- hierarchical level bin=2 (4x4 binning).
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1200   0           1025    1025
#   config_step6_bin1.conf  1    2048  2400   1024        1281    257
#   config_step6_bin0.conf  0    4096  4800   1280        1537    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub polaris_run.sh                                    # all four stages
#   qsub -v CONFIG=config_step6_bin2.conf polaris_run.sh   # or one at a time
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
#
# HOW THIS DIFFERS FROM ../ctxl_HT_4K_RD300_007p5nm.  Same sample, same optic,
# same energy, same plane -- but one distance instead of four and 12000 angles
# instead of 4000.  The consequences, in the order they bite:
#   * SINGLE DISTANCE MEANS NO DISTANCE DIVERSITY.  Multi-distance holography
#     gets its phase/absorption separation from the four propagation distances;
#     with one, the only things left are the angular redundancy (3x more of it
#     here) and the +-300 px random displacement.  Expect the bin-2 stage to do
#     much more work than it did on the HT scan, because it starts from a
#     single-distance Paganin guess rather than a 4-distance one.  Look at the
#     step-5 initial volume before committing the ladder:
#         python show_slices.py config_steps15.conf --init
#   * ndist=1 makes the data 0.75x the HT scan's (12000*1 against 4000*4) and
#     the object grid 0.82x by volume, so an iteration is roughly 0.6x as
#     expensive -- see the walltime note in polaris_run.sh.
#   * nchunk can be larger, because chunk memory scales with nchunk*ndist.
#   * mask_oob has almost nothing to drop; see the note below.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec   # steps15 output dir
in_file=ctxl_FT_4K_RD300_007p5nm_0003.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec6  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: commented out, so step 6 starts from a flat probe and refines it
#       (rho[1]=0.05 below).  UNCOMMENT IT AFTER RUNNING STEP 0 -- unlike the HT
#       folder, this scan can actually measure its probe.  Its NFP companion
#       (projections/<pfile>_NFP_before_0001.nx, 20 darks + 50 frames) is a
#       virtual dataset like everything else here, but its RAW_DATA targets WERE
#       transferred, so esrf_layout.NxFrames resolves them; step0.py in this
#       folder reads it that way and writes nfp_results.h5 into the steps15
#       output directory, which is exactly the path below.
#           mpirun -n 4 python step0.py config_step0.conf
#       Uncomment in THIS (bin-2) config only -- bins 1 and 0 inherit the probe
#       from the previous level's checkpoint.  A measured probe is worth more
#       here than on a 4-distance scan: with one distance, probe and object are
#       separated by the +-300 px displacement diversity alone.
# prb_file=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec/nfp_results.h5

nchunk=32             # projections per GPU batch -- lower it first if bin 2 runs out of GPU memory.
                      # 2x the HT scan's 16.  Chunk memory goes as
                      # nchunk*ndist*nz*n and ndist is 1 here instead of 4, so
                      # even 64 should fit; 32 leaves headroom for the larger
                      # ntheta-sized bookkeeping arrays.
ntheta=12000          # projection angles, 0..179.985 deg in 0.015 deg steps
start_theta=0         # index of first projection angle
ndist=1               # number of distances (z1 = 6.163535 mm, the HT scan's plane 1)

niter=1025            # last iteration executed is 1024
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size   = 4096 / 2**2
n=1024                # horizontal detector size = 4096 / 2**2
nzobj=1200            # vertical object size     = 4800 / 2**2
nobj=1200             # horizontal object size   = 4800 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=+9.80  # rotation axis offset from grid centre, in bin-0
                      # pixels; MUST match config_steps15.conf and the other two
                      # step-6 configs.
                      #
                      # MEASURED 2026-09-08 FROM THE POST-SCAN RETAKES.  A
                      # finished ID16A scan writes three extra frames after the
                      # last scan point, at omega = 180, 90 and 0.  That gives
                      # two ways to build an exactly-opposed pair:
                      #   (frame 0, frame 12000) -- nominally 180.000 deg
                      #       apart, but separated by the WHOLE SCAN, so it
                      #       carries every bit of drift, thermal movement and
                      #       beam wander accumulated over the 2 h 33 min from
                      #       10:53 to 13:26 on 2026-08-30.
                      #   (frame 12002, frame 12000) -- omega=0 retake against
                      #       omega=180 retake.  Also exactly 180.000 deg apart,
                      #       and written two frames apart at the very end --
                      #       under a minute, against 2 h 33 min.
                      # On this scan that distinction is the whole ballgame.
                      #     python estimate_center.py config_steps15.conf \
                      #            --retakes on --bands 4
                      #     12002/12000 band 0: dy=+0.20  shift= +9.45
                      #     12002/11999 band 0: dy=+6.89  shift= +9.45
                      #     12002/11999 band 1: dy=+4.00  shift=+10.44
                      #     12002/11999 band 2: dy=+8.08  shift= +9.93
                      #     rotation_center_shift = +9.82 +- 0.41 px
                      # 4 of 8 kept; the rejected ones fail |dy| <= 15 px,
                      # which is the geometry's own consistency test.  An
                      # earlier --pairs 1 run at three crops read +9.51, +8.78
                      # and +8.98 (mean +9.09) -- the same answer.  In every
                      # one of those runs each surviving band came from a
                      # retake pair and every band of the (0, 12000) scan pair
                      # was thrown out; that pair's three bands at crop 2048
                      # read -80.6, -127.0 and -8.5 px -- not a noisy
                      # measurement of the axis, a measurement of something
                      # else.  A diagnostic run showed what: phase_corr(frame
                      # 0, frame 1) returns frame 1's raw commanded
                      # displacement to 0.2 px, i.e. the correlation locks onto
                      # the residual ILLUMINATION rather than onto the sample,
                      # and on a weak pair that peak wins.  Hence also --search
                      # (200 px by default), which restricts the peak to a
                      # plausible axis range and prints the unrestricted peak
                      # beside it.
                      #
                      # THE SIGN IS USED AS PRINTED, NOT NEGATED -- checked
                      # against the two scans where ESRF states the axis
                      # outright: ctxl_HT reads -20.09 +- 1.12 against nabu's
                      # -15.77, AtomiumS1 FT reads +13.34 +- 1.60 against
                      # nabu's +10.74.  Same sign, ~4 px accuracy, no
                      # consistent bias.  Honest band here: about +6 to +14.
                      #
                      # WHAT THIS REPLACED: -15.77, ctxl_HT's nabu value
                      # ((1599.613741 - 1607.5) x 2), borrowed by instruction
                      # because this scan has no naburec/ and no PyHST .par.
                      # It is 25.6 px away.  The FT stage position is simply
                      # different from the HT one, as on AtomiumS1 (HT +44.20,
                      # FT +10.74) -- and this scan's +9.8 lands on
                      # AtomiumS1_FT's +10.74.
                      #
                      # Independent of correct_motion.txt: that file's
                      # horizontal column is bit-for-bit the random
                      # displacement (estimate_motion.py --zero-x, because the
                      # horizontal drift measures 0.10 px), and only the
                      # horizontal column is degenerate with the axis.  This is
                      # NOT true of the HT scan, whose ESRF-supplied file
                      # carries 2.1 px there.
                      #
                      # +-0.41 px is 3.1 nm, well under a voxel.  See
                      # center_estimate.png.
paganin=60            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# Rec._build_data_mask samples the object plane at
#     x = eff_demag*(tx - (n-1)/2) - r_x + (nobj-1)/2,   eff_demag = (1+shrink)/norm_mag
# and drops the detector pixels whose cubic B-spline taps land outside the
# grid.  On the HT scan this mattered a great deal, because plane 4 is
# demagnified 1.571x relative to plane 1 and its detector back-maps onto 6434
# object px against a 5056 grid (kept fraction 0.616).
#
# HERE IT IS A NON-EVENT.  With one plane, norm_mag = 1 exactly, so the
# detector back-maps onto exactly 4096 object px and the only thing that moves
# it around is the +-300 px displacement, plus ~28 px of drift and borrowed
# correct3D.  nobj = 4800 gives (4800-4096)/2 = 352 px of margin per side, 24 px
# more than the worst-angle reach check_data_read.py measures, so
#     plane 1  kept fraction ~1.000 at every angle
# and mask_oob is left on purely as a guard.  If _build_data_mask logs anything
# much below 1.0, do not shrug it off -- at ndist=1 it means a shift file is in
# the wrong units, not a geometry the grid cannot cover.
#
# F0 keeps its 1/(ntheta*ndist*nz*n) normalization, so err in conv.csv scales
# with the kept fraction and is NOT comparable across runs with different nobj
# -- in particular it is not comparable with the HT ladder's.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=1e-4   # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.04,0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # obj/prb/pos copied from ../ctxl_HT_4K_RD300_007p5nm,
                      # i.e. inherited twice over (that folder took them from
                      # ../Y350a_HT).  They are a starting point, not a
                      # measurement for this scan, and single-distance data is
                      # further from the regime they were tuned in than
                      # anything they have been used on so far -- which is
                      # exactly why estimate_rho below is left on here.
                      #
                      # rho[tp] = 0: SHRINKAGE IS MEASURED, NOT ASSUMED.
                      # A shrinking sample makes a post-scan retake a SCALED
                      # copy of the frame it repeats, so the residual
                      # displacement field between them acquires a slope, and
                      # that slope is the shrinkage.  estimate_shrink.py reads
                      # it off this scan's own two retakes (--grid 5, three
                      # crops, all 25 blocks fitting at every crop):
                      #     omega=90 vs frame 6000 (half the scan, dt = 0.50)
                      #         A_y = +196 +- 281 ppm   A_x =   +5 +- 807 ppm
                      #     omega=0  vs frame    0 (the whole scan, dt = 1.00)
                      #         A_y = +183 +- 173 ppm   A_x =  -26 +-  98 ppm
                      # Every term is inside 2 sigma of zero, and the two pairs
                      # agree with each other to 0.0 sigma in both axes, so the
                      # 2-sigma upper limit over the whole scan is about 530 ppm
                      # in y and 170 ppm in x -- 1.1 px and 0.35 px at the frame
                      # edge.  There is no shrink_list.mat for this scan either,
                      # so init_tp_from_shrink() starts the model at A = B = 0;
                      # with rho[tp] = 0 it stays there and the term is absent.
                      #
                      # This is the measured result, and the same one the HT
                      # scan and the ../Y350a_largedisp* ladders reached.  There,
                      # leaving rho[tp] non-zero let the optimizer invent
                      # ~2200 ppm of edge displacement, 8x that scan's upper
                      # limit, by absorbing displacement the position refinement
                      # should own; ../fig09_shrink_vs_noshrink.py shows the
                      # resulting 15-24 % loss.  With +-300 px of random
                      # displacement and only one distance to constrain it, this
                      # scan is MORE exposed to that failure mode than any of
                      # them.  Make the last element non-zero again only for a
                      # scan that actually measures a shrinkage.
estimate_rho=True     # True runs BH's coordinate search over rho[prb] then
                      # rho[pos] (Rec.estimate_rho_coord): 2 variables x 3 rungs
                      # x rho_estimate_niter silent iterations = +96 here, i.e.
                      # +9 % on niter=1025.  Worth considering at bin 2 only --
                      # it starts from the Paganin guess and its trials are 16x
                      # cheaper than bin 0's.  Since the rho above is inherited
                      # from a 4-distance scan rather than tuned for a
                      # single-distance one, this is the cheapest way to check
                      # it, and the case for running it is stronger here than on
                      # the HT scan.  Winners are logged at WARNING level as
                      # "estimate_rho_coord: final rho = [...]" and are NOT
                      # stored in the checkpoint -- copy them into the bin-1 and
                      # bin-0 configs by hand.
rho_estimate_niter=16 # iterations per trial
log_level=INFO
