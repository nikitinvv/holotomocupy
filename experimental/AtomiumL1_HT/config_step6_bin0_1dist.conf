# AtomiumL1, HT scan, 14 nm, 4 distances -- ESRF ID16A, proposal ihmi1591, 2025-06-08.
# BH reconstruction (step 6) -- hierarchical level bin=0.
#
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                      bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf     2     512   512      0        1025    1025
#   config_step6_bin1.conf     1    1024  1024   1024        1281     257
#   config_step6_bin0.conf     0    2048  2048   1280        1537     257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   ./local_run.sh CONFIG=config_step6_bin2.conf    # writes ckpt 1024
#   ./local_run.sh CONFIG=config_step6_bin1.conf    # reads 1024, writes 1280
#   ./local_run.sh CONFIG=config_step6_bin0.conf    # reads 1280, writes 1536
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_HT_014nm_rec     # steps15 output dir: holds AtomiumL1_HT_014nm.h5 and AtomiumL1_HT_014nm_obj.h5
in_file=AtomiumL1_HT_014nm.h5
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_HT_014nm_rec6_1dist  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: NOT set.  The only NFP companion scans for this dataset are
#       AtomiumL1_HT_014nm_NFPwCA_[1-4]_, which are coded-aperture scans and
#       carry cay/caz instead of the spy/spz step0.py reads -- see
#       config_step0.conf.  So at bin 2 the probe starts from the flat field;
#       bins 1 and 0 inherit it from the previous level's checkpoint.  Same as
#       Y350a_HT.
# prb_file=nfp_results.h5

nchunk=4              # projections per GPU batch -- lower it first if this level runs out of GPU memory
ntheta=1800           # number of projection angles (show_geometry.py; .info TOMO_N=1800)
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=1537            # last iteration executed is 1536
start_iter=1280       # resume from checkpoint_1280.h5 written by bin 1
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048                # vertical detector size   = 2048 / 2**0
n=2048                 # horizontal detector size = 2048 / 2**0
nzobj=2048              # vertical object size     = 2048 / 2**0
nobj=2048               # horizontal object size   = 2048 / 2**0
bin=0                 # binning level; needs start_level_rec <= 0 in config_steps15.conf

rotation_center_shift=-14.375964  # offset of the rotation axis from the grid
                      # centre, in bin-0 pixels; must match config_steps15.conf.
                      # The same number is used at every level -- reader.py
                      # rescales it by 1/2**bin internally.
paganin=120           # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
obj_dtype=complex64   # object array dtype: float32 or complex64
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# One frozen rectangle per (distance, ANGLE) -- see the long note in
# config_step6_bin2_1dist.conf.  ndist=1 at eff_demag 1, so this keeps ~99 % of
# the pixels and is close to a no-op.  err in conv.csv scales with that
# fraction and is not comparable with a mask_oob=0 run.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = keep every pixel
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0
rho=1,0.1,0.02,6.25e-06  # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # Derived from bin 2, not tuned here.  Per unbinning level
                      # rho[pos] halves and rho[tp] quarters:  H_pos/H_obj grows
                      # as n^2 (4x more detector pixels constrain the same two
                      # numbers), and tp adds the lever arm dx/dB = tx-(n-1)/2 on
                      # top of that, so rho ~ 1/sqrt(H) gives 1/4 and 1/16.
                      # obj/prb share obj's curvature scaling and carry over.

log_level=INFO
