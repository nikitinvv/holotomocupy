path=/eagle/APS_IRI/vnikitin/20260829/ctxl            # raw data root (holds <pfile>_1_/ .. <pfile>_4_/)
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec   # steps15 output
pfile=ctxl_HT_4K_RD300_007p5nm_0001                   # scan prefix name

# ---------------------------------------------------------------------------
# ctxl (cortex), 4-distance HT scan with +-300 px random sample displacement,
# 7.5 nm voxels -- ESRF ID16A, proposal ihls3888, 2026-08-29..31.
#
# THIS IS THE FIRST 2026 SCAN IN THIS REPOSITORY, and it is laid out differently
# from every 2025 folder next to it.  ESRF moved from bliss to ewoks between the
# two beamtimes; the differences are listed in the docstring of esrf_layout.py,
# which is the only place that knows about them.  In short:
#   * no per-distance bliss HDF5 -- geometry comes from the NXtomo written to
#     <pfile>/projections/<pfile>_000k.nx, cross-checked against the .info;
#   * flats are ref{ANGLE}_{BATCH}.edf, not ref{BATCH}_{ANGLE}.edf, and darks
#     are dark*.edf, not darkend*.edf;
#   * the random displacement lives in <pfile>/projections/<pfile>_000k.txt,
#     not in <pfile>_k_/correct.txt;
#   * the EDF headers carry only somega -- no sx/sy/spy/spz.
# Nothing has to be copied or renamed in the raw tree: steps15.py reads all of
# these through esrf_layout.Layout.
#
# Scan geometry -- read off the real data with
#     python show_geometry.py config_steps15.conf
# and cross-checked against <pfile>_k_/<pfile>_k_.info (Energy=17.1,
# PixelSize=0.0075, TOMO_N=4000, ScanRange=-180, Optic_used=1.47601):
#   ndist=4   ntheta=4000   detector 4096x4096   nref=20   ndark=20
#   energy = 17.1 keV        detector pixel = 1.47601 um
#   focus->detector = 1212.9965 mm, the same to 7 digits at all four planes
#   z1     = [ 6.163535  6.427950  7.485615  9.681685] mm
#   mag    = [   196.80    188.71    162.04    125.29] x
#   normal = [  1.00000   0.95886   0.82338   0.63662]
#   voxel  = [    7.500     7.822     9.109    11.781] nm
#   prop d = [    6.132     5.879     5.044     3.893] mm
# The derived voxel sizes reproduce the four .info PixelSize values exactly,
# which is the independent check that z1 was read with the right sign: the
# NXtomo stores it as a NEGATIVE source distance.
#
# Peter's octave driver, <pfile>_/ht_<pfile>.m, ran the same scan with
#   nvue=4000  refon=4000  numbers=[1 2 3 4]  bin_factor=2
#   random_disp=1  shift=0  reference_plane=2  reference_moved=1
#   correct_shrink=0  delta_beta=20  two_pass=1
# which is where ref_dist and paganin below come from.
#
# Auxiliary shift files, all present and all used:
#   <pfile>/projections/<pfile>_000k.txt   random displacement, 4003 rows
#   <pfile>_/rhapp.mat                     inter-plane, 2 x 4 x 4003
#   <pfile>_2_/correct_motion.txt          slow drift, 4004 rows
# and no correct_correct3D.txt, which step 3 defaults to zeros.
#
# UNLIKE ../Y350a_largedisp_006nm, correct_motion.txt DID come from ESRF, so
# nothing had to be fitted here.  It is exactly the plane-2 random displacement
# plus a drift, in the same units and the same column order, which is precisely
# what step 3 assumes (it forms correct_motion - random[ref_dist]).  Amplitude
# of the drift actually written, over the whole scan:
#     x  -1.625 .. +0.485   ptp 2.109   rms 0.465 px
#     y  -0.406 .. +1.215   ptp 1.620   rms 0.446 px
# i.e. about one detector pixel either way.  It is ANALYTIC but NOT a straight
# line: consecutive rows differ by |2nd difference| < 1e-4 px, so ESRF fitted a
# smooth function rather than following the retakes frame by frame, but taking
# a straight ramp out of it leaves a visible curved residual in both columns
# (see the third panel of scan_overview.png).  ESRF's fit source is the three
# post-scan retakes recorded in <pfile>_k_/quali.mat:
#     corr_imagesafterscan = [0.769 -2.182;  3.207 -1.429;  0 0]  (bin-2 px)
#     rot_positions        = [0 90 180],  index [0 2000 4000]
#
# estimate_motion.py re-measures the same drift independently, by correlating
# the three post-scan retake frames against the scan frames they repeat.  It
# CONFIRMS THE VERTICAL AND CONTRADICTS THE HORIZONTAL:
#     y  1.572 px ptp measured, against 1.620 px in ESRF's file   -- agrees
#     x  0.080 px ptp measured (+- 0.053), against 2.109 px       -- does not
# The vertical agreement to 3 % is a real validation of both.  The horizontal
# column of correct_motion.txt therefore carries something besides sample
# drift -- most likely ESRF's own axis correction, which their pipeline folds
# into the same file.  We use their file verbatim, exactly as their pipeline
# does, and the rotation centre in this config was measured WITH it installed,
# so the two are consistent; do not mix one with the other.  A purely
# retake-derived alternative is written to ./correct_motion.txt by
# `python estimate_motion.py config_steps15.conf --validate` if a reconstruction
# ever shows horizontal streaking that points back here.  See README.md.
#
# There is no shrink_list.mat, so load_shrink_from_mats returns A=B=0 and the
# linear shrinkage model starts at zero.  Whether it is refined is rho[tp] in
# the config_step6_bin*.conf files; see the note there and in README.md, and
# estimate_shrink.py for what the retakes say the shrinkage actually is.

start_step=1          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so the pair below produces bins 2 (4x4), 1 (2x2) and 0 (1x1) -- exactly the
# three levels the config_step6_bin{2,1,0}.conf files reconstruct.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=0     # FINEST binning level to reconstruct (0 = full resolution)
                      # Disk cost of including bin 0, at ndist=4:
                      #   step 1  <pfile>.h5     4000 x 4096^2 x 2 B x 4 =  537 GB
                      #   step 4  bin-0 pdata    4000 x 4096^2 x 4 B x 4 = 1074 GB
                      #   step 5  <pfile>_obj.h5 5056^3 x 4 B x 2 (re+im) = 1034 GB
                      # about 2.7 TB in total, against 240 TB free on eagle as
                      # of 2026-08-31.  Set start_level_rec=1 to stop at the
                      # 2x2 level if that changes.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=5056             # stitched object size at full resolution (bin 0).
                      # The grid has to hold the SAMPLE plus the whole
                      # displacement sweep, not the object-plane footprint of
                      # the most demagnified plane.  Plane 1 sees 4096 px of
                      # object at 7.5 nm; the commanded +-300 detector px are
                      # +-300/norm_mag[k] object px, which is worst at plane 4:
                      # 300/0.63662 = 471 px.  So 4096 + 2*471 = 5038, rounded
                      # up to 5056 = 79*64.  5056/2 = 2528 and 5056/4 = 1264,
                      # so it bins cleanly over all three levels.
                      #
                      # Plane 4's detector footprint is 4096/0.63662 = 6433
                      # object px, which does NOT fit in 5056, so step 4's
                      #     padx0 = (nobj - n/eff_mag) / 2 - r
                      # goes negative at planes 3 and 4 and is clamped to 0.
                      # That is the same situation ../Y350a_HT has run in since
                      # the start (identical 0.637 magnification spread, and
                      # nobj=4608 there): the clamped region is outside the
                      # sample, where curlySback returns 0 and exp(0)=1 already
                      # equals what the ramp would give, so nothing real is
                      # lost.  mask_oob in the step-6 configs drops whatever
                      # detector pixels it does affect.

rotation_center_shift=-19.22  # MEASURED 2026-08-31, but only to +-1.7 px -- refine
                      # it with step5_center_sweep.py before the step-6 ladder.
                      # Convention (spelled out in ../Y350a_HT/config_steps15.conf):
                      #     rotation_center_shift = c - n/2
                      # with c the axis column on the bin-0 detector grid.
                      #     python estimate_center.py config_steps15.conf --pairs 1 --motion
                      # on the single exactly-opposed pair (0/4000, 180.000 deg):
                      #     crop 2048  -19.22 +- 1.70
                      #     crop 2560  -20.18 +- 1.30
                      #     crop 3072  -18.16 +- 3.27
                      # and -19.72 +- 1.26 without correct_motion.txt, i.e. the
                      # drift is nearly irrelevant to it here.  The value above
                      # MUST stay equal to the one in all three
                      # config_step6_bin*.conf; the long note lives in
                      # config_step6_bin2.conf.
paganin=20            # delta/beta ratio for multi-distance Paganin (step 5).
                      # Peter used delta_beta=20 for this sample at 17.1 keV in
                      # ht_<pfile>.m; the 2025 Y350a scans used 40-60 at 33 keV
                      # on stained tissue, which is a different contrast regime.
                      # MUST match paganin in all three config_step6_bin*.conf:
                      # step 5 writes /exchange/obj_init_re{paganin}_{bin} and
                      # step 6 reads that exact name.
ref_dist=1            # reference distance index for motion-shift baseline (step 3)
                      # 0-based, so this is PLANE 2 -- reference_plane=2 in
                      # Peter's driver, and correct_motion.txt does indeed live
                      # in <pfile>_2_/.
log_level=INFO
