# ===========================================================================
# CENTRE SWEEP -3 -- generated 2026-08-25 from config_step6_bin1_noshrink.conf.
# Only rotation_center_shift and path_out differ; path is the shared
# ..._rec dir, whose _obj.h5 must have been written by
# config_steps15_c-3.conf immediately before this ladder starts.  noshrink only:
# the sweep is about the rotation axis, and adding the shrink variant
# would double six ladders for a question it does not answer.
# ===========================================================================
# Y350a, HT scan, 20 nm, 4 distances -- ESRF ID16A 2025-06-04.
# BH reconstruction (step 6) -- hierarchical level bin=1 (2x2 binning).
#
# FIXED-SHRINKAGE VARIANT of config_step6_bin1.conf: rho[tp]=0, so the linear
# shrinkage model stays at the fit init_tp_from_shrink() makes from the measured
# profile and is never refined.  Separate path_out (..._noshrink), so this ladder
# and the shrinkage one never share a checkpoint.  Same input file, and steps 1-5
# are shared -- do not re-run them.  Driver: polaris_run_noshrink_c-3.sh.
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                            bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2_noshrink_c-3.conf 2    1024  1152   0           513     513
#   config_step6_bin1_noshrink_c-3.conf 1    2048  2304   512         769     257
#   config_step6_bin0_noshrink_c-3.conf 0    4096  4608   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub -v CONFIG=config_step6_bin2_noshrink_c-3.conf polaris_run_noshrink_c-3.sh   # writes ckpt 0512
#   qsub -v CONFIG=config_step6_bin1_noshrink_c-3.conf polaris_run_noshrink_c-3.sh   # reads 0512, writes 0768
#   qsub -v CONFIG=config_step6_bin0_noshrink_c-3.conf polaris_run_noshrink_c-3.sh   # reads 0768, writes 1024
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_rec          # SHARED steps15 dir: holds Y350a_HT_nobin_020nm.h5 and the
                      # Y350a_HT_nobin_020nm_obj.h5 written by THIS centre's steps15 job
in_file=Y350a_HT_nobin_020nm.h5
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_rec6_noshrink_c-3         # step-6 output, SHARED by all three levels of THIS centre
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: set to nfp_results.h5 only if step0.py was run (needs an *_NFPwS_*
#           companion scan -- see config_step0.conf).  Left unset, so at bin 2
#           the probe starts from the flat field; bins 1 and 0 inherit it from
#           the previous level's checkpoint.
# prb_file=nfp_results.h5

nchunk=4             # projections per GPU batch -- lower it first if bin 1 runs out of GPU memory
ntheta=4000          # CONFIRM -- number of projection angles (show_geometry.py)
start_theta=0         # index of first projection angle
ndist=4               # number of distances

niter=769            # last iteration executed is 768
start_iter=512        # resumes from checkpoints/checkpoint_0512.h5, written by the bin-2 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048                # vertical detector size   = 4096 / 2**1
n=2048                 # horizontal detector size = 4096 / 2**1
nzobj=2304             # vertical object size     = 4608 / 2**1
nobj=2304              # horizontal object size   = 4608 / 2**1
bin=1                 # binning level.  The sweep's steps15 config stops at
                      # start_level_rec=2, which is enough: the step-5 volume is
                      # read only at bin 2 (start_iter=0), and this level takes
                      # its object from the previous level's checkpoint.

rotation_center_shift=-3   # rotation axis offset from the grid centre,
                      # in FULL-RESOLUTION (bin 0) detector pixels.
                      #
                      # CENTRE SWEEP, 2026-08-25.  The main run used
                      # -10.386198 (derived from an axis measured on a
                      # bin-1 grid) and its reconstruction says that value
                      # is wrong, so six candidates are being run to the
                      # end instead of trusted: 0, -1, -2, -3, -4, -7.
                      # These are ABSOLUTE values, not offsets from
                      # -10.386198.  Everything else here is identical to
                      # config_step6_bin1_noshrink_c-3.conf.
                      # Both steps15.py and reader.py apply it as
                      #     r[...,1] += rotation_center_shift/2**bin + 0.5*(1/2**bin - 1)
                      # so the same number goes into the steps15 config and
                      # all three step-6 levels unchanged.
paganin=60            # MUST match paganin in config_steps15_c-3.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# Same n/nobj ratio as bin 2, so the same mask: eff_demag reaches 1.5585 on the
# farthest plane and the outer ring of that plane's detector back-maps past the
# object grid, where the shift kernel's boundary condition -- not the sample --
# decides what the model predicts.  Keeps ~100/100/84/50 % per distance, 84 %
# overall, and err in conv.csv is therefore not comparable with a mask_oob=0
# run.  Full reasoning in config_step6_bin2.conf.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=1.25e-5       # 3-D Laplacian regularisation weight
rho=1.0,0.05,0.02,0  # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # Derived from bin 2: rho[pos] = bin-2 value / 2 (H_pos/H_obj
                      # grows as n^2).  tp stays frozen at 0 (noshrink family).
                      # obj/prb share obj's curvature scaling and carry over.

log_level=INFO
