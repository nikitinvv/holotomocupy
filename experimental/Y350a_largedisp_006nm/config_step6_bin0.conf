# Y350a, large random displacement, 6 nm voxels, 1 distance -- ESRF ID16A 2025-06-04.
# BH reconstruction (step 6) -- hierarchical level bin=0 (1x1 binning).
#
# NO SHRINKAGE CORRECTION anywhere in this folder: rho[tp]=0 at every level, so
# the linear shrinkage model stays at whatever init_tp_from_shrink() makes of it
# and is never refined.  There is no shrink_list.mat for this scan, so that init
# is A=B=0 and the model is simply absent -- unlike ../Y350a_largedisp, which
# carries both a shrinkage and a _noshrink ladder, this folder has one ladder
# and needs no suffix to tell them apart.
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                    bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf  2    1024  1184   0           513     513
#   config_step6_bin1.conf  1    2048  2368   512         769     257
#   config_step6_bin0.conf  0    4096  4736   768         1025    257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   qsub -v CONFIG=config_step6_bin2.conf polaris_run.sh   # writes ckpt 0512
#   qsub -v CONFIG=config_step6_bin1.conf polaris_run.sh   # reads 0512, writes 0768
#   qsub -v CONFIG=config_step6_bin0.conf polaris_run.sh   # reads 0768, writes 1024
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec     # steps15 output dir: holds <pfile>.h5 and <pfile>_obj.h5
in_file=Y350a_FT_large_rand_disp_nobin_006nm.h5
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec6   # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: set only in config_step6_bin2.conf, and only if step0 has been
#       run -- this level inherits the probe from the previous level's
#       checkpoint, so there is nothing to set here.
nchunk=2             # projections per GPU batch -- lower it first if bin 0 runs out of GPU memory
ntheta=4000          # number of projection angles
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=1025           # last iteration executed is 1024
start_iter=768          # resumes from checkpoints/checkpoint_0768.h5, written by the bin-1 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=4096                # vertical detector size   = 4096 / 2**0
n=4096                 # horizontal detector size = 4096 / 2**0
nzobj=4736              # vertical object size     = 4736 / 2**0
nobj=4736               # horizontal object size   = 4736 / 2**0
bin=0                 # binning level; needs start_level_rec <= 0 in config_steps15.conf

rotation_center_shift=-37.50  # rotation axis offset from grid centre, in bin-0
                      # pixels; MUST match config_steps15.conf.  Measured from
                      # the exactly-opposed 0/4000 frame pair on 2026-08-26 as
                      # -37.50 +- 0.79 px, WITH correct_motion.txt installed --
                      # against plain correct.txt the value is -39.81.  The two
                      # are a reparametrisation of each other, not rival
                      # measurements; never swap one without the other.  See the
                      # long note in config_steps15.conf and center_estimate.png.
paganin=40            # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# One distance, so eff_demag = 1 and the detector footprint is exactly n wide;
# what leaves the grid here is the displacement, not the demagnification.
# The shifts span +-302 bin-0 px in both x and y, and since nobj was raised to
# 4736 on 2026-08-26 the grid has (4736 - 4096)/2 = 320 px of margin per side --
# 18 px more than the largest displacement -- so no crop reaches past the edge
# and nothing is clipped.  mask_oob is therefore close to a no-op now (kept
# fraction ~100 %, against ~94-95 % at the old nobj=4608, where the extreme
# projections ran 44 px over and read the shift kernel's mirrored copy of the
# sample instead of the sample).  It is left on as a cheap guard: the mask is
# built worst-case over all angles, so F does not change between iterations, and
# it still catches pixels that position refinement walks out of the grid.
# Rec._build_data_mask logs the kept fraction at startup.  F0 keeps its
# 1/(ntheta*ndist*nz*n) normalization, so err in conv.csv scales with that
# fraction and is NOT comparable with a run at the old grid size.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0          # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.02,1e-6  # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # Derived from bin 1: rho[pos] halved again for the same
                      # reason.  tp stays frozen at 0.
log_level=INFO
