path=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec_new                # input directory (steps15 output)
path_out=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec_new_noise_fft  # output directory (noise study)
pfile=Y350c_HT_015nm                                               # scan prefix name

nchunk=16             # projections per GPU batch
ntheta=900            # number of projection angles (subsampled from 3000 for noise study)
start_theta=0         # index of first projection angle
ndist=4               # number of distances

niter=1025            # number of iterations
start_iter=0          # resume from this iteration (0 = start fresh)
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=8         # print error every N iters

nz=512                # vertical detector size (pixels)
n=512                 # horizontal detector size (pixels)
nzobj=640             # vertical object size (pixels)
nobj=640              # horizontal object size in x and y (pixels)
bin=2
shift_type=fft

rotation_center_shift=145.07  # rotation axis offset from detector centre (pixels)
paganin=100           # delta/beta ratio for Paganin phase retrieval
obj_dtype=complex64   # object array dtype: float32 or complex64
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight
rho=1,0.05,0.02       # gradient step scales: object, probe, positions

log_level=INFO
