# NFP probe retrieval for the Y350a 6 nm large-random-displacement scan.
#
# OPTIONAL.  Unlike the 20 nm sibling, this dataset DOES have a near-field
# ptychography companion scan, so a measured probe is available:
#     Y350a_FT_large_rand_disp_nobin_006nm_NFPwS_1_/   <- use this one
#     Y350a_FT_large_rand_disp_nobin_006nm_NFPwCA_1_/  <- do NOT use: coded
#         aperture, step0.py reads cay/caz motor keys that are absent here and
#         dies with a KeyError.
# The scan holds 50 frames of 4096^2 with spy/spz spanning about +-79 px, so
# step0 builds a 4256-wide probe grid.
#
# Running this is not required: with prb_file unset, step 6 starts the probe
# from the flat field at bin 2 and refines it.  Feeding a measured probe in
# generally helps a single-distance dataset, where the data constrain the probe
# far less than a 4-distance HT scan does.  If you run it, uncomment prb_file
# in config_step6_bin2.conf (bin 2 only -- bins 1 and 0 inherit the probe from
# the previous level's checkpoint).
#
#     qsub -v SCRIPT=step0.py,CONFIG=config_step0.conf polaris_run.sh
#
# (polaris_run.sh's live mpiexec line hardcodes step6.py; either uncomment the
#  step0 line just above it, or pass SCRIPT= and switch to the ${SCRIPT} line.)

path=/eagle/APS_IRI/vnikitin/20250604
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec
scan_file=Y350a_FT_large_rand_disp_nobin_006nm_NFPwS_1_/Y350a_FT_large_rand_disp_nobin_006nm_NFPwS_1_0000.h5
meta_file=Y350a_FT_large_rand_disp_nobin_006nm_NFPwS_1_/ls3231-Y350a-Y350a_FT_large_rand_disp_nobin_006nm_NFPwS_1_.h5
h5_out=nfp_results.h5
dataset_ids=1
nchunk=2
n=4096
niter=513
checkpoint_step=32
error_step=32
rho=1,2,0.1
log_level=INFO
