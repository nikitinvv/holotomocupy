path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1                                              # raw data root
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec  # steps15 output
pfile=Atomium_S1_FT_4K_RD300_004p5nm_0001                                                    # scan prefix name

# ---------------------------------------------------------------------------
# Atomium S1 -- SINGLE-distance FT scan with +-300 px random sample
# displacement, 4.5 nm voxels.  ESRF ID16A, proposal blc17322, beamtime
# 20260825, scan written 2026-09-01 11:24:59 (.info Date).
#
# THE CLOSEST SIBLING IS ../ctxl_FT_4K_RD300_007p5nm, not the other Atomium
# folders.  Same scan RECIPE -- one distance, 12000 projections over 180 deg,
# +-300 px random displacement, 4096^2 detector, post-scan retakes -- on a
# different sample at a different energy and voxel size.  Every script in this
# folder is that folder's copy, and every long note there applies here unless
# this file says otherwise.  What the other Atomium folders share is only the
# sample name: ../AtomiumL1_HT and ../AtomiumS2 are 4-distance 33.35 keV scans
# from 2024/2025 on 2048^2 detectors.
#
# LAYOUT: "ewoks" -- EDF frames in <pfile>_1_/, geometry in the NXtomo at
# <pfile>/projections/<pfile>_0001.nx.  This is the EASY case, and the one
# difference from ../ctxl_FT_4K_RD300_007p5nm that matters operationally: that
# scan was never converted to EDF ("nxvds"), so it had to read pixels through a
# virtual dataset into RAW_DATA/.  Here the pixels are ordinary EDF files and
# nothing under RAW_DATA/ is needed -- which is just as well, since
# /eagle/APS_IRI/vnikitin/20260829/RAW_DATA/ holds only ctxl.
#
# WHAT IS ON DISK, verified 2026-09-03 after the copy finished:
#   <pfile>_1_/                     12003 projections, 4096^2 uint16
#                                   ref0000_00{00..19}.edf   20 start flats
#                                   ref12000_00{00..19}.edf  20 end flats
#                                   dark00{00..19}.edf       20 darks
#                                   refHST0000.edf / refHST12000.edf (unused)
#                                   angles_file.txt, <pfile>_1_.info
#   <pfile>/projections/            <pfile>_0001.nx        geometry
#                                   <pfile>_0001.txt       displacement, 12003x2
#                                   <pfile>_NFP_before_0001.nx
#   NO <pfile>_/ octave directory -- Peter's pipeline was not run on this scan,
#   so there is no rhapp.mat (not needed at ndist=1), no quali.mat, no
#   ht_<pfile>.m driver (see paganin below) and NO correct_motion.txt from
#   ESRF.  The drift was therefore measured here; see rotation_center_shift and
#   ./correct_motion.txt.
#
# FRAME NUMBERING, from angles_file.txt and the EDF somega headers -- exactly
# ../ctxl_FT_4K_RD300_007p5nm's structure:
#       0 .. 11999   the scan, 0.000 .. 179.985 deg in 0.015 deg steps
#          12000     the last scan point, 180.000002 deg
#          12001     post-scan retake at  90 deg  (repeats frame 6000)
#          12002     post-scan retake at   0 deg  (repeats frame    0)
#   The displacement table has a row for all 12003 and is ZERO at frames
#   0 / 6000 / 11999 and at all three retakes, so the retakes repeat their
#   counterparts at the same commanded position -- which is what makes the
#   drift, the shrinkage and the rotation axis measurable from them.
#
# Scan geometry -- read off the real data with
#     python show_geometry.py config_steps15.conf
#   ndist=1   ntheta=12000   detector 4096x4096   nref=20   ndark=20
#   energy = 17.1 keV        detector pixel = 1.476015 um   exposure 0.1 s
#   focus->detector = 1212.976 mm
#   z1     = 3.698060 mm     mag = 328.00x    voxel = 4.500 nm
#   propagation distance = 3.68679 mm,  norm_magnifications = [1.0]
# The .info sidecar's PixelSize = 0.0045 um reproduces the derived 4.49999929 nm
# and is written by a different part of the beamline software than the NXtomo,
# so that agreement IS an independent check that the source/detector distances
# were read with the right sign.  (info_check() returns [] on this scan for
# that reason; ../ctxl_FT_4K_RD300_007p5nm has no sidecar and loses the check.)
#
# WHAT IS AND IS NOT CORRECTED, at ndist=1:
#   random displacement   <pfile>/projections/<pfile>_0001.txt, 12003 rows,
#                         +-300 px (measured ptp 599.95 / 599.90).
#   rhapp                 NOT APPLICABLE.  rhapp.mat registers distance planes
#                         against each other and there is only one plane.
#                         Step 3 logs "rhapp.mat not found, using zeros"; that
#                         warning is EXPECTED here and means nothing is wrong.
#   correct_motion.txt    NOT PROVIDED by ESRF -- measured here from the
#                         post-scan retakes and checked in as
#                         ./correct_motion.txt.  ALREADY INSTALLED
#                         2026-09-03; to reinstall:
#                             cp correct_motion.txt <path>/<pfile>_1_/
#                         NOTE THE DIRECTORY.  Step 3 reads it from
#                         lay.dname(ref_dist), which for an EDF flavour is the
#                         DISTANCE directory <pfile>_1_/ -- not
#                         <pfile>/projections/, which is where
#                         ../ctxl_FT_4K_RD300_007p5nm's README says to put it
#                         because that scan is nxvds and has no distance
#                         directory at all.  Copying it to projections/ here
#                         would leave step 3 logging "not found, using zeros"
#                         with the file sitting right there.
#                         NOTE the ndist=1 telescoping: step 3 forms
#                         (correct_motion - random[ref_dist]) and adds the
#                         random displacement straight back, so the file
#                         REPLACES the random displacement rather than adding
#                         to it, and must be the random displacement PLUS the
#                         drift in raw detector pixels.  estimate_motion.py
#                         writes exactly that.
#                         WHAT IT ACTUALLY CONTAINS.  Both retakes see the same
#                         motion, and it is almost all HORIZONTAL:
#                             12001 vs frame 6000 (half the scan)
#                                 dy -0.07   dx +0.71  px
#                             12002 vs frame    0 (the whole scan)
#                                 dy -0.15   dx +0.72  px
#                         medians over six crops 1024..2304, with a crop-to-crop
#                         MAD of 0.03 px in y and 0.06 px in x.  The degree-2 fit
#                         through those two points plus the zero at frame 0 gives
#                             x  -0.209 .. +0.596 px   rms 0.2330 +- 0.046
#                             y  -0.070 .. +0.079 px   rms 0.0431 +- 0.029
#                         so x is a ~5 sigma measurement and y is ~1.5 sigma,
#                         i.e. not measured.  BOTH COLUMNS ARE WRITTEN ANYWAY:
#                         --zero-x, which ../ctxl_FT_4K_RD300_007p5nm uses, would
#                         here delete the only real signal.  That sibling drifted
#                         1.8 px VERTICALLY and 0.10 px horizontally; this scan
#                         is the other way round and an order of magnitude
#                         smaller.  Do not copy the sibling's flag over.
#                         The horizontal drift is partly degenerate with the
#                         rotation axis -- see rotation_center_shift in
#                         config_step6_bin2.conf, which was measured WITH this
#                         file installed and is only valid that way.
#   correct3D             no correct_correct3D.txt; step 3 uses zeros.
#   shrinkage             MEASURED from this scan's own retakes and consistent
#                         with zero at every crop; rho[tp]=0 at every level.
#                         Numbers in config_step6_bin2.conf.
#   probe                 an NFP companion EXISTS
#                         (<pfile>/projections/<pfile>_NFP_before_0001.nx) but
#                         its pixels are a VIRTUAL dataset into RAW_DATA/, and
#                         RAW_DATA/ for this proposal was not copied to eagle.
#                         HDF5 answers an unresolvable virtual source with
#                         SILENT ZEROS, so this cannot be quietly attempted --
#                         esrf_layout.NxFrames refuses instead.  No step0.py /
#                         config_step0.conf in this folder for that reason; step
#                         6 starts from a flat probe and refines it (rho[prb] =
#                         0.05).  Same situation as ../ctxl_HT_4K_RD300_007p5nm.
# ---------------------------------------------------------------------------

start_step=3          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
                      # Steps 1-4 are DONE for this scan (job 7590111,
                      # 2026-09-03, 22 min 47 s) and none of their output
                      # depends on paganin, so a change of delta/beta only
                      # needs step 5 re-run.  Set this back to 1 for a scan
                      # that has not been converted yet.
                      # Also the resume knob: the Polaris debug queues cap at
                      # 1 h, so if a job runs out of walltime part way through,
                      # raise this to the first step that did not complete and
                      # resubmit.  There is no "stop after step N".

# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
nlevels=3             # 4096 / 2048 / 1024, i.e. bins 0, 1 and 2 -- exactly the
                      # three levels config_step6_bin{2,1,0}.conf reconstruct.
start_level_rec=2     # = nlevels-1, i.e. the COARSEST level ONLY.
                      # Step 5's job is to seed the ladder, and the ladder starts
                      # at bin 2 (config_step6_bin2.conf, start_iter=0); bins 1
                      # and 0 take their object from the previous level's
                      # checkpoint and never read obj_init.  Writing a Paganin
                      # volume at bins 1 and 0 as well would cost
                      #     bin 0   4096^3 x 4 B x 2 (re+im)  =  550 GB
                      #     bin 1   2048^3 x 4 B x 2          =   69 GB
                      # and hours of FBP for something nothing reads.  At bin 2
                      # it is 1024^3 x 4 B x 2 = 8.6 GB.
                      # Set this to 0 only to LOOK at a full-resolution Paganin
                      # volume, never as part of the ladder.
                      #
                      # Disk in path_out with these settings:
                      #   step 1  <pfile>.h5      12003 x 4096^2 x 2 B  = 403 GB
                      #   step 4  pdata bin 0     12000 x 4096^2 x 4 B  = 805 GB
                      #                 bin 1     12000 x 2048^2 x 4 B  = 201 GB
                      #                 bin 2     12000 x 1024^2 x 4 B  =  50 GB
                      #   step 5  <pfile>_obj.h5  1024^3 x 4 B x 2      = 8.6 GB
                      # about 1.47 TB, against 227 TB free on eagle 2026-09-03.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from the frame shape; >0 overrides the crop
nobj=4096             # stitched object size at full resolution (bin 0), = n.
                      # DELIBERATELY NOT n + 2*300.  The grid holds the SAMPLE,
                      # not the sample plus the displacement sweep: at ndist=1
                      # norm_mag = 1, so every frame back-maps onto exactly 4096
                      # object px, and the +-300 px displacement only slides that
                      # window around inside the grid.  A 4736 grid would spend
                      # 1.55x the memory and the disk reconstructing a 320 px
                      # shell of air that only the extreme angles ever see.
                      #
                      # What it costs, measured from /exchange/cshifts_final
                      # (y in [-300.02, +299.99], x in [-300.18, +299.93]):
                      # Rec._build_data_mask drops the detector pixels that fall
                      # off the grid, so the kept fraction is 0.962 per axis on
                      # average -> 0.926 of the detector area, 0.858 at the worst
                      # angle.  Those are the outer columns/rows looking at the
                      # air outside the reconstructed cylinder, and the mask box
                      # is per (distance, angle), so it follows the sample rather
                      # than taking the worst case over all angles.
                      #
                      # 4096 bins cleanly over all three levels (2048, 1024) and
                      # is a much better FFT length than 4736 = 2^7 * 37.
                      # If you ever want the full sweep covered instead, the
                      # number is 4736 = 74*64 -- and then EVERY config below,
                      # plus all three step-6 configs, has to change together and
                      # step 5 must be re-run (obj_init_* is nobj-sized).

rotation_center_shift=10.74  # FROM ESRF'S OWN nabu RECONSTRUCTION PARAMETERS.
                      # Peter's naburec/ configs, delivered 2026-09-07 next to
                      # correct_correct3D.txt, state the axis outright:
                      #     nabu_final.conf (production volume, start_z 0,
                      #         end_z -1):      rotation_axis_position = 1028.87
                      #     nabu.conf, nabu_correct3D.conf:      1028.87026
                      #     nabu_correct3D_v.conf:               1028.728672
                      # all on the 2048-wide <pfile>_rec_.nx with binning = 1.
                      # nabu measures the axis from the detector centre
                      # (N-1)/2 = 1023.5, so
                      #     (1028.87026 - 1023.5) x 2 = +10.74 raw px
                      # and the _v variant gives +10.46.  PyHST's own
                      # <pfile>_rec_.par says ROTATION_AXIS_POSITION =
                      # 1029.764684, 1-based, centre (2048+1)/2 = 1024.5, so
                      #     (1029.764684 - 1024.5) x 2 = +10.53 raw px.
                      # Three independent ESRF numbers spanning 0.3 px.
                      #
                      # This CONFIRMS the opposed-pair mirror test and OVERRIDES
                      # the +18.70 that was here: measured on this same stitch
                      # (Peter's motion, no correct3D) the four estimators gave
                      #     mirror (frames 0/12000)  +10.39 +- 1.69   <-- +10.74
                      #     focus tv                 +12.46
                      #     focus entropy            +17.47 (+18.68 over masks)
                      #     focus neg_g95            +22.98
                      # The mirror test lands 0.35 px from ESRF's number; the
                      # entropy pick was 8 px out.  See
                      # atomium-s1-axis-mirror-vs-focus for why entropy is the
                      # outlier here (Peter's x column costs sharpness and
                      # spread the focus metrics from 1.6 to 10.5 px).
                      #
                      # WHY correct3d_bin=2 DOES NOT MOVE THIS.  x and the axis
                      # share a slot (steps15.py:834, reader.py:233), so
                      # installing correct3D normally forces a re-quote -- but
                      # nabu keeps the SAME 1028.87026 with and without the file
                      # (nabu.conf uses correct.txt, horizontal identically
                      # zero; nabu_correct3D.conf uses the full file), and the
                      # mirror test barely feels it: correct3D's horizontal
                      # column averages -35.22 raw px
                      # over frames 0-5 and +33.06 over 11994-11999
                      # (band mean -1.083), which would move the mirror
                      # estimate +10.39 -> +11.47 -- inside its own +-1.69
                      # scatter.  Those numbers are from the 2026-09-07
                      # 11:35 refresh of correct_correct3D.txt, whose
                      # horizontal column is antisymmetric (ptp 34.18
                      # binned px, first -17.64, last +16.54); the 06:01
                      # file this comment first quoted gave -1.65 / +4.42
                      # and +9.01.  rcs 10.74 stands either way: it comes
                      # from nabu, not from the mirror test.  So +10.74 holds
                      # for either choice of correct3D, and the whole-scan focus
                      # sweep after the re-stitch is what would refine it.
                      # MUST match all three config_step6_bin*.conf.
paganin=20            # delta/beta ratio for Paganin (step 5).  SET BY HAND.
                      # Not a measurement -- there is no ht_<pfile>.m for this
                      # scan to read the driver's value from.  Three numbers
                      # are in play:
                      #   120  Peter's octave driver for ../AtomiumL1_HT and
                      #        ../AtomiumS2, but at 33.35 keV.
                      #    32  that value scaled to 17.1 keV: away from an
                      #        absorption edge delta ~ E^-2 and beta ~ E^-4, so
                      #        delta/beta ~ E^2 and 120*(17.1/33.35)^2 = 31.6.
                      #    20  what this config uses.  Lower delta/beta = less
                      #        low-pass smoothing in the transport filter, so a
                      #        sharper but noisier start; the Paganin blur
                      #        length sqrt(delta_beta * lambda * z / 4pi) drops
                      #        from 825 nm (32) to 652 nm (20), i.e. 183 -> 145
                      #        unbinned voxels.
                      #
                      # Only the step-6 STARTING POINT depends on this -- the
                      # iterative solve is free to move away from it -- but the
                      # starting point matters at ndist=1, where one propagation
                      # distance cannot separate phase from absorption and the
                      # transport filter is doing the whole job.  Look at it:
                      #     python show_slices.py config_steps15.conf --init
                      # Re-running step 5 alone is cheap (start_step=5, 30 s at
                      # bin 2), so trying another value costs almost nothing.
                      #
                      # MUST match paganin in all three config_step6_bin*.conf:
                      # step 5 writes /exchange/obj_init_re{paganin}_{bin} and
                      # step 6 reads that exact name.  Changing it here without
                      # changing them there gives a KeyError in step 6, not a
                      # silent fallback.
correct_motion_bin=2  # correct_motion.txt's DRIFT is in 2x2 BINNED detector px.
                      # Peter delivered his correct_motion.txt on 2026-09-06 and
                      # it is now installed at <pfile>_1_/correct_motion.txt.
                      # reference_motion.mat in <pfile>_/ records
                      #     pixelsize = 8.99995e-9 m
                      # against this scan's own 4.5 nm voxel, and the driver
                      # ht_<pfile>.m sets bin_factor = 2 (line 89) -- his
                      # pipeline ran on 2x2 binned frames.  The random
                      # displacement he copies through is NOT binned, so the
                      # file mixes units.  Step 3 already subtracts the random
                      # displacement to isolate the drift, and this knob scales
                      # only that difference, so the displacement is untouched.
                      #
                      # CONFIRMED against the drift measured here independently
                      # (the previous correct_motion.txt, kept on eagle as
                      # correct_motion_bq.txt, whose x column is identically the
                      # random displacement and whose y column carries the whole
                      # drift):
                      #     vertical drift, correct_motion - random
                      #         Peter   ptp  56.71 px
                      #         mine    ptp 114.02 px
                      #     ratio 2.011, corr 0.962, linear-slope ratio 2.046.
                      # 0 would auto-detect from the driver instead; 1 is the
                      # default and is what every other scan in this tree wants.
                      # See ./peter_cmp/ for the plots and the arithmetic.
correct3d_bin=2       # correct_correct3D.txt is in 2x2 BINNED detector px.
                      # Peter delivered it on 2026-09-07 at
                      # <pfile>_/correct_correct3D.txt, together with the
                      # naburec/ configs he fitted it in.  Those run nabu with
                      #     location = <pfile>_rec_.nx
                      #     binning  = 1
                      # and that dataset is 2048 wide (NUM_IMAGE_1 = 2048,
                      # IMAGE_PIXEL_SIZE_1 = 0.00899995 um in
                      # <pfile>_rec_.par) against this scan's own 4096 and
                      # 4.5 nm voxel -- so his fit grid is 2x2 binned and the
                      # whole file scales by 2.  Same trap as
                      # correct_motion_bin, but simpler: correct3D has no
                      # raw-px half mixed in, so the factor applies to both
                      # columns.
                      #
                      # CROSS-CHECK against the previous ESRF correct3D kept on
                      # eagle as correct_correct3D_bq.txt, which our own
                      # 2026-09-04 stitch consumed in raw px:
                      #     horizontal columns correlate +0.885
                      #     ptp  new x2 68.06 px  vs  _bq 86.07 px  (ratio 0.79)
                      #     ptp  new x1 34.03 px  vs  _bq 86.07 px  (ratio 0.40)
                      # x2 is the consistent reading, and the sign agrees, so
                      # the file goes into cshifts_final unmodified.
                      # Step 3 logs the factor and the resulting drift.
rhapp_bin=1           # unused: there is no rhapp.mat at ndist=1.  Pinned to 1
                      # rather than left at the 0 (auto) default only so a run
                      # never depends on looking for a driver that is not there.
ref_dist=0            # reference distance index (0-based).  There is exactly
                      # one plane, so this can only be 0.
log_level=INFO
