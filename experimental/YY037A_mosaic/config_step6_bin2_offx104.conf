path=/data2/vnikitin/20260416/YY037A_rec
path_out=/data2/vnikitin/20260416/YY037A_rec6_bin2_offx104   # tile-placement sweep: farright dx = -4 finest-grid px
pfile=YY037A_HT_F2_100nm

# Same as config_step6_bin2_posdist.conf (per-(tile x distance) position model)
# but SHORT, and with one tile deliberately mis-placed.
pos_per_dist=true

# --- mosaic ---------------------------------------------------------------
tiles=farright,right,center,left,farleft
scan_suffix=0001

# --- TILE PLACEMENT SWEEP --------------------------------------------------
# The one thing steps 1-5 measure that step 6 cannot check for itself is where
# each tile sits on the mosaic: /exchange/tile_offsets comes out of step 5's
# estimate_overlap correlation, and a wrong value there gives a plausible but
# meaningless reconstruction. This set walks the farright tile's horizontal
# placement over dx = -12 -10 -8 -6 -4 -2 0 2 4 6 8 10 12 finest-grid px and reads the answer off the
# objective: if the measured placement is right, dx=0 is the minimum and the
# curve is a clean bowl around it.
#
# The number in the file name and in path_out is 100 - dx, not dx: 112 is
# dx=-12, 100 is the measured placement, 88 is dx=+12. That keeps the names
# free of minus signs and ordered the same way as the tile's actual
# displacement (+dx moves the window centre to smaller x). The tile_shift=
# line below is the truth; the tag is only a label.
#
# tile_shift is `name:dy:dx`, in OBJECT PX ON THE FINEST GRID — the same units
# as /exchange/tile_offsets, which it is added to before the 1/2**bin scaling.
# At bin 2 this run's dx = -4 finest px is -1.00 reconstruction px.
# Sign convention is tile_offsets': +dx moves the tile's window centre to
# SMALLER x, since x = (nobj-1)/2 - pos[...,1]. dy stays 0 — only x is swept.
#
# Everything else is held at the tuned bin-2 values from the rho sweeps:
# rho_pos=0.001, rho_tp=3e-6 (the shrinkage optimum, err 2.1248e-04 @704,
# -2.71% vs frozen tp, bracketed by 1e-6 and 1e-5).
#
# 65 iterations, not 1025: the sweep only has to rank the offsets against each
# other, and the objective separates the runs long before convergence (in the
# rho sweep the ranking was stable from ~iteration 400 and the ordering at 128
# already had the right sign for everything except the too-large step). A
# placement error is a much coarser thing than a 3e-6 change in a step scale.
# error_step=8 gives 9 points per run; checkpoint_step=64 writes exactly one
# checkpoint, at the last iteration, so the best offset can be looked at.
#
# NOTE the positions are still being refined (rho_pos=0.001), so the solver can
# in principle eat part of the imposed offset. It cannot eat much of it here:
# in the rho sweep max|pos - pos_init| reached only ~0.2 bin px after 704
# iterations, i.e. under 0.05 by iteration 64, against offsets of up to 3 bin px.
#
# NOTE also the initial object is the step-5 mosaic, stitched with the MEASURED
# offsets. A shifted tile therefore starts out inconsistent with the volume and
# the first iterations partly re-stitch it; that is the same handicap for every
# run in the set, dx=0 included, so the comparison stays fair.

tile_shift=farright:0:-4

nchunk=4              # projections per GPU batch (4x the bin-3 frame area)
ntheta=1800           # number of projection angles
start_theta=0
ndist=4               # distances PER TILE; step6.py expands to 4 x 5 = 20

niter=65              # 65 so the loop's last iteration is 64 and gets logged
start_iter=0
checkpoint_step=64    # one checkpoint, at the end
error_step=8          # 9 points on the convergence curve

nz=512                # 2048 >> 2
n=512
nzobj=896             # height = steps15 nzobj/2**bin =  3584/4
nobj=3072             # width  = steps15 nobj /2**bin = 12288/4
bin=2
shift_type=cubic

rotation_center_shift=0
paganin=40
obj_dtype=complex64
mask=1.0

lam_prbfit=3.1e-3
lam_laplacian=0

# object, probe, positions, tp — the tuned bin-2 set, IDENTICAL in every run of
# the sweep. The placement is the only thing that varies.
rho=1,0.05,0.001,3e-6

estimate_rho=false     # SWEEP: hold rho fixed, do not let the coordinate search move it
rho_estimate_niter=8

log_level=INFO

# Rank count: the class refuses to start when local_ntheta == ndist == 20,
# which for ntheta=1800 means exactly 90 ranks. 64 ranks gives 28 or 29. Fine.
