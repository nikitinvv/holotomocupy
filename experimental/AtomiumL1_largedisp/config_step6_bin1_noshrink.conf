# AtomiumL1, FT large random displacement, 14 nm, 1 distance -- ESRF ID16A,
# proposal ihmi1591, 2025-06-08.
# BH reconstruction (step 6) -- hierarchical level bin=1.
#
# ---------------------------------------------------------------------------
# HIERARCHICAL CHAIN:  bin 2 (4x4)  ->  bin 1 (2x2)  ->  bin 0 (1x1)
#
#   file                      bin   n     nobj   start_iter  niter   iters
#   config_step6_bin2.conf     2     512   512      0        1025    1025
#   config_step6_bin1.conf     1    1024  1024   1024        1281     257
#   config_step6_bin0.conf     0    2048  2048   1280        1537     257
#
# All three levels share ONE path_out, so no file shuffling is needed between
# them: step6.py seeds itself with find_latest_checkpoint(path_out, start_iter),
# i.e. {path_out}/checkpoints/checkpoint_{start_iter:04d}.h5, and
# Reader.read_checkpoint infers scale = n / n_checkpoint from the stored probe
# width and upsamples obj (x,y repeat, nearest-neighbour in z), prb (x,y repeat)
# and pos (x scale) onto this level's grid.  Iteration numbering is therefore
# cumulative across the whole ladder.
#
#   ./local_run.sh CONFIG=config_step6_bin2.conf    # writes ckpt 1024
#   ./local_run.sh CONFIG=config_step6_bin1.conf    # reads 1024, writes 1280
#   ./local_run.sh CONFIG=config_step6_bin0.conf    # reads 1280, writes 1536
#
# checkpoint_step=32 divides every start_iter and every niter-1, so the handoff
# checkpoints are guaranteed to exist.  If a level is cut short by walltime,
# just lower the next level's start_iter to the last checkpoint that landed.
# ---------------------------------------------------------------------------

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_FT_large_rand_disp_014nm_rec     # steps15 output dir
in_file=AtomiumL1_FT_large_rand_disp_014nm.h5
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_FT_large_rand_disp_014nm_rec6_noshrink  # step-6 output, SHARED by all three levels
# NOTE: pfile= is deliberately NOT set.  When pfile is present config.py builds
#       in_file as path_out/pfile.h5, which would force the step-6 output dir to
#       be the steps15 dir as well; path= + in_file= keeps the two separate.
# prb_file: set once step0.py has run -- unlike AtomiumL1_HT, this dataset DOES
#       have a usable NFP companion (AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_,
#       50 frames with spy/spz spanning +-75 px).  See config_step0.conf.
#       Left commented until step0 has actually been run.
# prb_file=nfp_results.h5

nchunk=8              # projections per GPU batch -- lower it first if this level runs out of GPU memory
ntheta=1800           # number of projection angles (show_geometry.py; .info TOMO_N=1800)
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=1281             # last iteration executed is 1280
start_iter=1024        # resume from checkpoint_1024.h5 written by bin 2
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024                # vertical detector size   = 2048 / 2**1
n=1024                 # horizontal detector size = 2048 / 2**1
nzobj=1024              # vertical object size     = 2048 / 2**1
nobj=1024               # horizontal object size   = 2048 / 2**1
bin=1                 # binning level; needs start_level_rec <= 1 in config_steps15.conf

rotation_center_shift=-11.5  # offset of the rotation axis from the grid
                      # centre, in bin-0 pixels; must match config_steps15.conf.
                      # Measured on THIS scan at bin 1, where the axis is 6.0 px
                      # left of centre; step 4 averages pixel pairs, so bin-1
                      # pixel i is centred at bin-0 coordinate 2i + 0.5 and
                      #     rcs_bin0 = 2*rcs_bin1 + 0.5 = 2*(-6.0) + 0.5 = -11.5
                      # (not the -12 that doubling alone gives).  reader.py
                      # rescales it back with rcs*scale + 0.5*(scale-1), which
                      # returns exactly -6.0 here.  Replaces the -14.375964
                      # borrowed from AtomiumL1_HT -- see config_steps15.conf.
paganin=120           # MUST match paganin in config_steps15.conf --
                      # it selects /exchange/obj_init_re{paganin}_{bin}.
                      # Only actually read at bin 2 (start_iter=0); bins 1 and 0
                      # take their object from the previous checkpoint.
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels --------------------------------------------
# One frozen rectangle per (distance, ANGLE) -- see the long note in
# config_step6_bin2.conf.  Same n/nobj ratio and the same +-300 px sweep scaled
# to this level, so the surviving fraction matches: 85.6 % per-angle against
# 48.5 % for the single shared rectangle used before 2026-08.  err in conv.csv
# scales with that fraction and is not comparable with a mask_oob=0 run, nor
# with any earlier run here.
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = keep every pixel
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

# Solver settings below are deliberately identical to ../AtomiumL1_HT's step 6
# at the matching bin level -- lam_prbfit, lam_laplacian, rho, mask, niter,
# start_iter, checkpoint_step, error_step and nchunk all match, so the two
# reconstructions of this sample differ only in the acquisition and the
# geometry that follows from it (n/nobj/ntheta/ndist, the paths and
# rotation_center_shift).  Keep them in step: whatever changes in AtomiumL1_HT
# is copied here, not the reverse.
lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=5e-5       # 3-D Laplacian regularisation weight
rho=1.0,0.025,0.16,0  # gradient step scales: object, probe, positions, tp (linear shrink A,B)

log_level=INFO
