path=/data2/vnikitin/20260416/YY037A          # raw data root
path_out=/data2/vnikitin/20260416/YY037A_rec  # output directory
pfile=YY037A_HT_F2_100nm                                # scan prefix name (without tile / suffix)
tiles=farright,right,center,left,farleft                # left→right in composed mosaic
tile_order=                                             # OVERRIDE for the acquisition order, which
                                                        # steps15 otherwise reads from the Date= line
                                                        # of every distance's .info — per distance,
                                                        # not per tile. The sample keeps shrinking all
                                                        # session, so each tile's shrink starts at
                                                        # whatever had accumulated by its first frame.
                                                        # Leave EMPTY for YY037A: left and right were
                                                        # taken interleaved, one distance each (Apr 18
                                                        # 18:34/18:38/18:42/...), which a flat list of
                                                        # tile names cannot express — the dates can.
                                                        # steps15 only.
scan_suffix=0001                                        # trailing _NNNN in each tile name

start_step=5        # 1=convert, 2=preprocess, 3=shifts, 4=binned data, 5=mosaic Paganin+FBP
nlevels=4             # number of binning levels produced in step 4
start_level_rec=3     # first bin level reconstructed in step 5 (coarsest = nlevels-1)
ref_dist=0            # reference distance index for motion-shift baseline (step 3)

n=0                   # 0 = auto-detect from EDF
nobj_tile=0           # 0 = auto-compute from n and magnifications (single tile, 3264)

# Reconstruct step 5 from a subset of the angles, for fast tests. 0 = all 6000.
# The subset is spread evenly over the full rotation (e.g. 600 -> every 10th),
# so the FBP still covers the whole angular range, just more sparsely. Steps 1-4
# always process every angle, so this needs no re-run of anything upstream.
# With a subset active, _proj.h5 keeps every reconstructed angle, not every 10th.
ntheta_rec=300

# --- mosaic object grid (step 5) -------------------------------------------
nobj=12288            # mosaic width,  object px on the finest grid
nzobj=3584            # mosaic height, object px on the finest grid
                      # Both are divided by 2**bin at every level — keep them
                      # multiples of 2**(nlevels-1) so the levels line up.
tile_step=2000        # nominal spacing between adjacent tiles, in object px on
                      # the finest grid. Starting guess only — estimate_overlap
                      # measures the real placement from the data.

# rotation axis offset from the frame centre, in object px on the finest grid.
# Applied in steps 4 and 5 as r[...,1] += rotation_center_shift (scaled per bin);
# it is NOT part of the tile placement, which estimate_overlap measures.
#
# ESRF's ROTATION_AXIS_POSITION (*_rec_.par, NUM_IMAGE_1=3216, 0.1 um px, so the
# same object grid) minus 3216/2, per tile:
#   farright -0.0011 | right -2.8803 | center +0.0001 | left +2.8742 | farleft -0.0003
# Three of the five are the untouched 1608 default, and the two refined ones
# cancel (mean -0.0015), so the .par gives no usable global value -> 0.
rotation_center_shift=0
paganin=40
log_level=INFO
# true  = the shrink ramps linearly over the angles of each plane, from cum[k]
#         at the first projection to cum[k]+inc[k] at the last.
# false = Peter's convention, one constant per plane at its mid value.
# The cross-tile baseline is the same either way — it is one offset per
# distance, added on top of whichever convention is in use.
shrink_angle_ramp=true

overlap_check=false   # optional raw-frame diagnostic after step 3
overlap_width=200     # pixels used from each side of the seam by that diagnostic

# Measure the tile placement in step 5, by correlating each pair of neighbours
# once their distances have been assembled into one projection. Starts from the
# nominal tile_step and corrects it, per bin, coarsest first.
estimate_overlap=true
overlap_nangles=16    # equally spaced projections used per adjacent-tile pair

nchunk=4