path=/eagle/APS_IRI/vnikitin/20250604 # raw data root (holds <pfile>_1_/)
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec     # output directory
pfile=Y350a_FT_large_rand_disp_nobin_006nm                               # scan prefix name

# Scan geometry -- read off the real data with
#     python show_geometry.py config_steps15.conf
# on 2026-08-26, and cross-checked against
# <pfile>_1_/<pfile>_1_.info (PixelSize=0.006, TOMO_N=4000, ScanRange=-180):
#   ndist=1   ntheta=4000   detector 4096x4096
#   nref=21   ndark=20
#   energy=33.35 keV   focus-to-detector=1.289 m
#   z1=5.24 mm   magnification=246.0
#   detector pixel=1.4760 um   voxelsize=6.000 nm
#
# This is the 6 nm sibling of ../Y350a_largedisp (same sample, same beamtime,
# same detector, 20 nm voxels).  Everything that is not resolution-dependent is
# deliberately identical to that folder so the two can be compared.
#
# Auxiliary shift files: correct.txt and correct_motion.txt.  There is no
# <pfile>_ aux directory, so rhapp.mat and correct_correct3D.txt are absent and
# default to zeros in step 3.
#
# correct_motion.txt was NOT provided by ESRF -- this scan never got a
# quali.mat.  It was measured from the scan's own post-scan retakes and written
# by estimate_motion.py on 2026-08-26:
#
#     python estimate_motion.py config_steps15.conf --path <path>
#     cp correct_motion.txt <path>/<pfile>_1_/
#
# The scan writes 4003 EDF frames for ntheta=4000; frames 4001 (omega=90) and
# 4002 (omega=0) are retakes of scan frames 2000 and 0 at the same piezo
# position, so registering each against its original measures the stage drift
# accumulated over that stretch.  Three points, one quadratic, mean removed.
# Amplitude: 3.36 px peak-to-peak horizontal, 5.95 px vertical.
#
# NOTE step 3 does not ADD correct_motion.txt to correct.txt.  At ndist=1
# shifts_final telescopes to raw_motion, so correct_motion.txt REPLACES
# correct.txt outright; the file written here is correct.txt PLUS the drift, in
# the same unbinned object px and the same column order.
#
# Validated before use on the 20 nm sibling, which has both a quali.mat and
# ESRF's real correct_motion.txt: the vertical column correlates +0.9996 with
# Peter's file at scale 1.80 ~ 2 (he writes bin-2 px, step 3 wants unbinned).
# The horizontal column agrees with quali (+0.11 measured vs +0.130 truth) but
# does NOT reproduce Peter's col0 (corr -0.10) -- his comes from a different,
# unidentified degree-5 source.  Horizontal is also the noisier column here
# (+-0.95 px vs +-0.85) and is exactly degenerate with rotation_center_shift;
# see the note there.  estimate_motion.py --zero-x writes a vertical-only file
# if you ever want that column backed out.

start_step=1          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so the pair below produces bins 2 (4x4), 1 (2x2) and 0 (1x1) -- exactly the
# three levels the config_step6_bin{2,1,0}.conf files reconstruct.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=0     # FINEST binning level to reconstruct (0 = full resolution)
                      # Cost of including bin 0: the step-5 volume is
                      # 4608^3 float32 x 2 (re+im) = 783 GB in <pfile>_obj.h5,
                      # plus 4000 x 4096^2 x 4 B = 268 GB of bin-0 projections
                      # from step 4.  Check the eagle quota before running
                      # step 4/5 with start_level_rec=0; set it to 1 to stop at
                      # the 2x2 level.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=4736             # stitched object size at full resolution (bin 0).
                      # RAISED from 4608 on 2026-08-26 so the grid covers the
                      # whole displacement sweep.  With norm_magnification 1 the
                      # detector footprint sweeps 4096 + 302 + 302 = 4699 px --
                      # measured from correct_motion.txt, which spans
                      # x in [-301.72, +299.87], y in [-301.14, +301.88] px.
                      # 4608 was 91 px short of that, and steps15 clamps the
                      # per-projection pad offsets to [0, nobj], so the extreme
                      # projections were simply clipped and mask_oob=1 had to
                      # drop the ~5 % of detector pixels this could affect.
                      # 4736 gives (4736-4096)/2 = 320 px of margin per side,
                      # 18 px more than the largest displacement, so nothing is
                      # clipped any more.
                      # 4736 = 74*64; 4736/2 = 2368, 4736/4 = 1184, so it still
                      # bins cleanly over all three levels.
                      # NOTE ../Y350a_largedisp and ../Y350a_HT still use 4608,
                      # so this folder no longer matches them in grid size.

rotation_center_shift=-37.50 # rotation axis offset from grid centre, bin-0 pixels
                      # Convention (spelled out in ../Y350a_HT/config_steps15.conf):
                      #     rotation_center_shift = c - n/2
                      # with c the axis column on the bin-0 detector grid.
                      #
                      # MEASURED FROM THE DATA 2026-08-26, no prior value to
                      # inherit -- this scan has never been reconstructed.
                      #     python estimate_center.py config_steps15.conf \
                      #            --shifts correct_motion.txt --pairs 1
                      # mirrors the theta=0 and theta=180 deg frames about a
                      # trial axis (opposed projections are mirror images of
                      # each other, and Fresnel propagation commutes with a
                      # mirror, so this works on the raw holograms).  Result:
                      #     -37.50 +- 0.79 px   (3 of 3 band estimates kept)
                      #
                      # --pairs 1: frame 4000 sits at exactly omega=180, so
                      # (0, 4000) is the only genuinely opposed pair and the only
                      # one with a real correlation peak at this voxel size
                      # (0.008-0.010, against ~0.006 for pairs 1-3, which are
                      # noise and scatter).  Letting them in gives -37.92 +- 2.06
                      # -- the same answer with four times the error bar.  See
                      # the header of estimate_center.py and center_estimate.png.
                      #
                      # THIS VALUE BELONGS TO correct_motion.txt.  The first
                      # measurement here was -39.81 +- 0.94 against plain
                      # correct.txt; installing correct_motion.txt moved it by
                      # +1.96 px.  That is not a better measurement, it is a
                      # reparametrisation: a constant added to the horizontal
                      # shift column is exactly degenerate with the axis
                      # position, because the mirror flips B and a common offset
                      # therefore ADDS instead of cancelling,
                      # delta_t = -(d[0] + d[4000]).  Here d[0]=-1.48 and
                      # d[4000]=-2.38 predict delta_t=+3.86 against +3.90
                      # measured, and estimate_motion.py --zero-x reproduces
                      # -39.46 to the digit.  So:
                      #     correct.txt        ->  -39.81
                      #     correct_motion.txt ->  -37.50
                      # Never swap one without the other.
                      #
                      # Cross-check: the same script on the 20 nm sibling gives
                      # -11.07 +- 0.94 px against that folder's independently
                      # derived -10.966, and -11.07 px of 20 nm detector-plane
                      # offset is -36.9 px of 6 nm ones -- 3 px from the
                      # correct.txt value above, i.e. the axis sits in the same
                      # physical place in both scans to within the error.
                      #
                      # If reconstructions look doubled/smeared, sweep it:
                      #     python step5_center_sweep.py config_steps15.conf
paganin=40            # delta/beta ratio for multi-distance Paganin (step 5)
                      # Set to 40 on 2026-08-26 (was 50 here and 60 in the three
                      # config_step6_bin*.conf -- they had drifted apart, which
                      # would have broken step 6: step 5 writes
                      # /exchange/obj_init_re{paganin}_{bin} and step 6 reads
                      # that exact name, so a mismatch is a missing-dataset
                      # error at bin 2.  All four files now say 40.)
ref_dist=0            # reference distance index for motion-shift baseline (step 3)
log_level=INFO        # DEBUG, INFO, WARNING, ERROR
