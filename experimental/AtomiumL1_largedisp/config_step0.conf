# AtomiumL1, FT large random displacement, 14 nm -- NFP probe retrieval (step0).
#
# ENABLED.  Unlike AtomiumL1_HT, this dataset has a usable near-field
# ptychography companion scan:
#     /data3/vnikitin/ESRF/atomium/20250607/AtomiumL1/AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_/
#         AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_0000.h5   50 x 2048 x 2048 uint16
#         ihmi1591-AtomiumS2-AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_.h5
#         dark_0000.h5   (not read by step0.py)
# and it carries the spy/spz headers step0.py needs:
#     spy in [-0.98, +1.10] um,  spz in [-1.05, +0.91] um
#     = y in [-70, +79] px,  z in [-75, +65] px at the 14.00 nm voxel
# so step0 will build a 2048 + 2*87 -> nobj = 2240 px object grid.
#
# This mirrors Y350a_largedisp_new/config_step0.conf, which uses the same
# *_NFPwS_1_ flavour.
#
# There is also an AtomiumL1_FT_large_rand_disp_014nm_NFPwCA_1_ directory
# (coded aperture).  Do NOT point step0 at it: it has cay/caz instead of
# spy/spz and step0.py raises KeyError on it.
#
# Run before step6, then uncomment prb_file=nfp_results.h5 in the
# config_step6_bin*.conf files:
#     SCRIPT=step0.py CONFIG=config_step0.conf ./local_run.sh

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_FT_large_rand_disp_014nm_rec

scan_file=AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_/AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_0000.h5   # raw scan HDF5
meta_file=AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_/ihmi1591-AtomiumS2-AtomiumL1_FT_large_rand_disp_014nm_NFPwS_1_.h5  # beamline metadata
h5_out=nfp_results.h5  # NFP output: probe, positions (relative to path_out)

dataset_ids=1         # distance indices: replaces _1_ in scan_file for each
                      # distance.  Only one plane here, so nothing is replaced.

nchunk=2              # projections per GPU batch (50 frames total)
n=2048                # detector size (pixels)

niter=513             # number of NFP iterations
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

rho=1,2,0.1,0         # gradient step scales: object, probe, positions, tp (linear shrink A,B)
log_level=INFO
