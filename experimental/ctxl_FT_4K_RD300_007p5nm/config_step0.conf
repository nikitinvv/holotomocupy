# ctxl cortex tissue, SINGLE-distance FT, 7.5 nm voxels -- ESRF ID16A
# 2026-08-29..31, proposal ihls3888, attempt _0003.
# STEP 0: near-field ptychography (NFP) probe retrieval.
# ---------------------------------------------------------------------------
#     mpirun -n 4 python step0.py config_step0.conf
#
# Writes prb_amp / prb_phase / proj_delta / proj_beta / pos_err to
#     <path_out>/nfp_results.h5
# which is the steps15 output directory, so config_step6_bin2.conf can point
# prb_file= straight at it.  Uncomment that line there once this has run;
# without it step 6 starts from a flat probe and refines it.
#
# THE INPUT.  The NFP companion scan taken immediately before the tomogram:
# 20 darks (RAW_DATA/.../scan0004) and 50 NFP frames (scan0005), reached
# through the NXtomo below.  Its geometry is bit-for-bit the projection scan's
# -- energy 17.1 keV, z1 = 6.163535 mm, focus->detector 1212.9965 mm,
# magnification 196.80x, voxel 7.49999578 nm -- which is the check that the
# probe it retrieves belongs to the same optical configuration.
#
# There is also a <pfile>_NFP_after_0001 entry in some ESRF trees; this scan
# only wrote _before.  Point nx_file at the other one to compare them.
#
# THE PIEZO POSITIONS come from sample/x_translation and y_translation of the
# NFP NXtomo (mm), not from a PCIe header -- the 2025 bliss route step0.py in
# the other folders uses.  Measured span, at 7.5 nm voxels:
#     y  -99.0 .. +102.0 px      x  -106.9 .. +99.1 px
# so pos_range = 115 px and step0.py sizes nobj = 4352 automatically.
# ---------------------------------------------------------------------------

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec

nx_file=projections/ctxl_FT_4K_RD300_007p5nm_0003_NFP_before_0001.nx  # NXtomo input (relative to path)
h5_out=nfp_results.h5  # NFP output: probe, positions (relative to path_out)
# NOTE: detector/data in that .nx is a VIRTUAL dataset whose sources are
#       written relative to a PROCESSED_DATA level our copy of the tree does
#       not have.  step0.py reads it through esrf_layout.NxFrames, which
#       rebases each source onto the real
#           /eagle/APS_IRI/vnikitin/20260829/RAW_DATA/ctxl/<pfile>/scan000[45]/
#       and refuses to start if any of them is missing.  Reading the .nx
#       directly would return ZEROS with no error -- do not "simplify" it back.

nchunk=4              # projections per GPU batch (only 50 frames in total)
n=4096                # detector size (pixels) -- full frame, as the tomogram uses

niter=513             # number of NFP iterations
checkpoint_step=-1    # save checkpoint every N iters (-1 = disabled)
error_step=16         # print error every N iters

rho=1,2,0.1,0         # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # copied from ../Siemens/config_step0.conf, the only other
                      # NXtomo NFP config in the tree.  rho[tp]=0 as everywhere
                      # here: there is nothing to shrink over a 50-frame scan.
log_level=INFO
