path=/data2/vnikitin/20260416/YY037A_rec        # steps15 output: the 5 tile h5 + the mosaic _obj.h5
path_out=/data2/vnikitin/20260416/YY037A_rec6_posdist   # separate from the per-projection run
pfile=YY037A_HT_F2_100nm                        # scan prefix, without tile / suffix

# ===========================================================================
# Same as config_step6_bin3.conf except for the POSITION MODEL.
#
# pos_per_dist=true selects rec_mpi_shrink_posdist.Rec: the per-angle shifts
# measured in step 3 (/exchange/cshifts_final, plus the tile placement) are
# loaded into cl.pos_base and held FIXED; the solver refines a single (y, x)
# offset per (tile x distance) on top of them.
#
#   unknowns:  ndist*2 = 20*2 = 40      (was 300*20*2 = 12000)
#
# Checkpoints still carry the full (ntheta, ndist, 2) /pos = base + offset, so
# they stay readable by plot_shifts.py and by a per-projection run.
# ===========================================================================
pos_per_dist=true

# --- mosaic ---------------------------------------------------------------
tiles=farright,right,center,left,farleft
scan_suffix=0001

nchunk=16              # projections per GPU batch
ntheta=300            # number of projection angles (matches steps15 ntheta_rec)
start_theta=0         # index of first projection angle
ndist=4               # distances PER TILE; step6.py expands to 4 x 5 = 20

niter=2048            # number of iterations
start_iter=0          # resume from this iteration (0 = start fresh)
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters; also prints all 40 offsets

nz=256                # vertical detector size (2048 >> bin)
n=256                 # horizontal detector size
nobj=1536             # width  = steps15 nobj /2**bin = 12288/8
nzobj=448             # height = steps15 nzobj/2**bin =  3584/8
bin=3                 # needs step 5 run with nlevels=4, start_level_rec=3
shift_type=cubic

rotation_center_shift=0
paganin=40            # must match the tag in obj_init_re{paganin}_{bin}
obj_dtype=complex64
mask=1.2

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=2e-4    # 3-D Laplacian regularisation weight

# rho: object, probe, positions, tp.
#
# The position entry is NOT the 0.01 of the per-projection config. rho_sq is a
# Cauchy-step metric, rho_sq[v] = <g,g>/<g,H g>. Summing the per-projection
# adjoint over theta multiplies both <g,g> and <g,Hg> by ntheta^2 and ntheta^3
# respectively for a coherent direction, i.e. rho_sq drops by ntheta and rho by
# sqrt(ntheta):
#     rho_pos = 0.01 / sqrt(300) = 5.8e-4
# (The bin-2 config's 0.02/sqrt(900) = 6.7e-4 lands in the same place, which is
# the check that the scaling is right and not a coincidence of one config.)
rho=1,0.05,6e-4,1e-4

# Left ON for the first posdist run: the coordinate search is seeded from the
# rho= above, so it only has to confirm or nudge the scaling argument. Read
# "estimate_rho_coord: final rho = [...]" out of the log, paste it into rho=,
# and set this back to false for production runs.
estimate_rho=true
rho_estimate_niter=8

log_level=INFO

# NOTE on rank count: rec_mpi_shrink_posdist refuses to start when
# ndist == local_ntheta (20 here), because the chunking layer distinguishes a
# global array from a theta-chunked one by comparing shape[0] against the local
# theta count. For ntheta=300 that is exactly 15 ranks; 64 ranks gives
# local_ntheta = 4 or 5, so polaris_run.sh's geometry is fine.
