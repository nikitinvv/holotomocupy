path=/eagle/APS_IRI/vnikitin/20260829/ctxl            # raw data root (holds <pfile>_1_/ .. <pfile>_4_/)
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec   # steps15 output
pfile=ctxl_HT_4K_RD300_007p5nm_0001                   # scan prefix name

# ---------------------------------------------------------------------------
# ctxl (cortex), 4-distance HT scan with +-300 px random sample displacement,
# 7.5 nm voxels -- ESRF ID16A, proposal ihls3888, 2026-08-29..31.
#
# THIS IS THE FIRST 2026 SCAN IN THIS REPOSITORY, and it is laid out differently
# from every 2025 folder next to it.  ESRF moved from bliss to ewoks between the
# two beamtimes; the differences are listed in the docstring of esrf_layout.py,
# which is the only place that knows about them.  In short:
#   * no per-distance bliss HDF5 -- geometry comes from the NXtomo written to
#     <pfile>/projections/<pfile>_000k.nx, cross-checked against the .info;
#   * flats are ref{ANGLE}_{BATCH}.edf, not ref{BATCH}_{ANGLE}.edf, and darks
#     are dark*.edf, not darkend*.edf;
#   * the random displacement lives in <pfile>/projections/<pfile>_000k.txt,
#     not in <pfile>_k_/correct.txt;
#   * the EDF headers carry only somega -- no sx/sy/spy/spz.
# Nothing has to be copied or renamed in the raw tree: steps15.py reads all of
# these through esrf_layout.Layout.
#
# Scan geometry -- read off the real data with
#     python show_geometry.py config_steps15.conf
# and cross-checked against <pfile>_k_/<pfile>_k_.info (Energy=17.1,
# PixelSize=0.0075, TOMO_N=4000, ScanRange=-180, Optic_used=1.47601):
#   ndist=4   ntheta=4000   detector 4096x4096   nref=20   ndark=20
#   energy = 17.1 keV        detector pixel = 1.47601 um
#   focus->detector = 1212.9965 mm, the same to 7 digits at all four planes
#   z1     = [ 6.163535  6.427950  7.485615  9.681685] mm
#   mag    = [   196.80    188.71    162.04    125.29] x
#   normal = [  1.00000   0.95886   0.82338   0.63662]
#   voxel  = [    7.500     7.822     9.109    11.781] nm
#   prop d = [    6.132     5.879     5.044     3.893] mm
# The derived voxel sizes reproduce the four .info PixelSize values exactly,
# which is the independent check that z1 was read with the right sign: the
# NXtomo stores it as a NEGATIVE source distance.
#
# Peter's octave driver, <pfile>_/ht_<pfile>.m, ran the same scan with
#   nvue=4000  refon=4000  numbers=[1 2 3 4]  bin_factor=2
#   random_disp=1  shift=0  reference_plane=2  reference_moved=1
#   correct_shrink=0  delta_beta=20  two_pass=1
# which is where ref_dist and paganin below come from.
#
# Auxiliary shift files, all present and all used:
#   <pfile>/projections/<pfile>_000k.txt   random displacement, 4003 rows
#   <pfile>_/rhapp.mat                     inter-plane, 2 x 4 x 4003
#                                          (2x2-binned px -- see rhapp_bin)
#   <pfile>_2_/correct_motion.txt          slow drift, 4004 rows
#   <pfile>_/correct_correct3D.txt         axis correction, 4001 rows
#                                          (2x2-binned px -- see correct3d_bin)
#   <pfile>_/reference_motion.mat          reference_plane + ref_v/ref_h
#   <pfile>_/naburec/*.conf                the axis ESRF reconstructed with
# The last two are NOT inputs -- they are ESRF stating what it did, and step 3
# reads them back to check the first three.  See esrf_meta.py and README.md.
#
# When this scan was first set up correct_correct3D.txt did not exist and the
# axis correction looked as though ESRF had folded it into correct_motion.txt.
# Peter dropped the file on 2026-09-07 and it is used now; the analysis below
# of what the horizontal column of correct_motion.txt contains still stands and
# is why the two are consistent with each other.
#
# UNLIKE ../Y350a_largedisp_006nm, correct_motion.txt DID come from ESRF, so
# nothing had to be fitted here.  It is exactly the plane-2 random displacement
# plus a drift, in the same units and the same column order, which is precisely
# what step 3 assumes (it forms correct_motion - random[ref_dist]).  Amplitude
# of the drift actually written, over the whole scan:
#     x  -1.625 .. +0.485   ptp 2.109   rms 0.465 px
#     y  -0.406 .. +1.215   ptp 1.620   rms 0.446 px
# i.e. about one detector pixel either way.  It is ANALYTIC but NOT a straight
# line: consecutive rows differ by |2nd difference| < 1e-4 px, so ESRF fitted a
# smooth function rather than following the retakes frame by frame, but taking
# a straight ramp out of it leaves a visible curved residual in both columns
# (see the third panel of scan_overview.png).  ESRF'S OWN reference_motion.mat
# confirms the read: its ref_v/ref_h are this same drift (negated), and step 3
# reproduces them to 4e-5 object px in both columns.  It also records
# reference_plane = 2, which is ref_dist = 1 below.  Its `pixelsize` is 15 nm,
# but that does NOT mean correct_motion.txt is binned -- the file carries the
# full 600 px random-displacement amplitude, so it is in raw detector px, and
# correct_motion_bin stays 1.  ESRF's fit source is the three
# post-scan retakes recorded in <pfile>_k_/quali.mat:
#     corr_imagesafterscan = [0.769 -2.182;  3.207 -1.429;  0 0]  (bin-2 px)
#     rot_positions        = [0 90 180],  index [0 2000 4000]
#
# estimate_motion.py re-measures the same drift independently, by correlating
# the three post-scan retake frames against the scan frames they repeat.  It
# CONFIRMS THE VERTICAL AND CONTRADICTS THE HORIZONTAL:
#     y  1.572 px ptp measured, against 1.620 px in ESRF's file   -- agrees
#     x  0.080 px ptp measured (+- 0.053), against 2.109 px       -- does not
# The vertical agreement to 3 % is a real validation of both.  The horizontal
# column of correct_motion.txt therefore carries something besides sample
# drift, and CONFIRMED 2026-09-01 what it is: ESRF's own axis correction, the
# thing their pipeline normally writes to correct_correct3D.txt.  Subtract the
# plane-2 random displacement and the remainder splits exactly the way that
# file does -- horizontal = rotation harmonics (4 of them give 100.00 % of the
# variance, and beat a polynomial by 10-30x at every order), vertical = a
# polynomial in the projection index (exact at order 2, to the file's own six
# decimals).  Reproduce with
#     python estimate_correct3d.py config_steps15.conf --motion  We use their file verbatim, exactly as their pipeline
# does, and the rotation centre in this config was measured WITH it installed,
# so the two are consistent; do not mix one with the other.  A purely
# retake-derived alternative is written to ./correct_motion.txt by
# `python estimate_motion.py config_steps15.conf --validate` if a reconstruction
# ever shows horizontal streaking that points back here.  See README.md.
#
# There is no shrink_list.mat, so load_shrink_from_mats returns A=B=0 and the
# linear shrinkage model starts at zero.  Whether it is refined is rho[tp] in
# the config_step6_bin*.conf files; see the note there and in README.md, and
# estimate_shrink.py for what the retakes say the shrinkage actually is.

start_step=3          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
                      # 3, not 1: <pfile>_rec/<pfile>.h5 (3.0 TB) was written
                      # on 2026-08-31 and steps 1-2 do not depend on anything
                      # that has changed since.  What changed on 2026-09-07 is
                      # correct_correct3D.txt (new file, and correct3d_bin=2)
                      # and rotation_center_shift -- correct3D enters at step 3
                      # and the axis at step 5, so 3-4-5 is exactly the range
                      # that has to be redone.  Set this back to 1 only to
                      # rebuild the HDF5 from the EDFs.
# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ----
# Step 4 writes binned projections for every level in range(nlevels).
# Step 5 writes a Paganin+FBP initial volume for every level in
#     range(start_level_rec, nlevels)
# so step 4 writes binned projections for bins 2 (4x4), 1 (2x2) and 0 (1x1) --
# the three levels the config_step6_bin{2,1,0}.conf files reconstruct -- while
# step 5 writes a Paganin+FBP init only for the levels from start_level_rec up.
# Only bin 2 needs one: it is the first rung of the step-6 ladder, and bins 1
# and 0 are seeded from the checkpoint the level below wrote, not from FBP.
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=2     # FINEST binning level to reconstruct (0 = full resolution)
                      # Disk cost of including bin 0, at ndist=4:
                      #   step 1  <pfile>.h5     4000 x 4096^2 x 2 B x 4 =  537 GB
                      #   step 4  bin-0 pdata    4000 x 4096^2 x 4 B x 4 = 1074 GB
                      #   step 5  <pfile>_obj.h5 5056^3 x 4 B x 2 (re+im) = 1034 GB
                      # about 2.7 TB in total, against 240 TB free on eagle as
                      # of 2026-08-31.  Set start_level_rec=1 to stop at the
                      # 2x2 level if that changes.

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from EDF; set >0 to override crop size
nobj=5056             # stitched object size at full resolution (bin 0).
                      # The grid has to hold the SAMPLE plus the whole
                      # displacement sweep, not the object-plane footprint of
                      # the most demagnified plane.  Plane 1 sees 4096 px of
                      # object at 7.5 nm; the commanded +-300 detector px are
                      # +-300/norm_mag[k] object px, which is worst at plane 4:
                      # 300/0.63662 = 471 px.  So 4096 + 2*471 = 5038, rounded
                      # up to 5056 = 79*64.  5056/2 = 2528 and 5056/4 = 1264,
                      # so it bins cleanly over all three levels.
                      #
                      # Plane 4's detector footprint is 4096/0.63662 = 6433
                      # object px, which does NOT fit in 5056, so step 4's
                      #     padx0 = (nobj - n/eff_mag) / 2 - r
                      # goes negative at planes 3 and 4 and is clamped to 0.
                      # That is the same situation ../Y350a_HT has run in since
                      # the start (identical 0.637 magnification spread, and
                      # nobj=4608 there): the clamped region is outside the
                      # sample, where curlySback returns 0 and exp(0)=1 already
                      # equals what the ramp would give, so nothing real is
                      # lost.  mask_oob in the step-6 configs drops whatever
                      # detector pixels it does affect.
# NOTE: there is deliberately no tomo_upsample key here.  Step 5 is unaffected
#       by it: the Paganin+FBP init is written on the PROJECTION grid,
#       /exchange/obj_init_re{paganin}_{bin} at nobj/2**bin, as it always was,
#       and Reader.read_obj averages it down 2x2 in x/y when a step-6 config
#       asks for tomo_upsample=2.  Both arms of the ladder read the same
#       datasets, and step 5 never has to be re-run for a change of
#       tomo_upsample.

rotation_center_shift=-15.77  # FROM ESRF'S OWN nabu PARAMETERS (2026-09-07).
                      # Peter's naburec/ for this scan states the axis:
                      #     nabu_final_cm.conf (production, start_z 0 end_z -1,
                      #         with ../correct_correct3D.txt):  1599.613741
                      #     nabu.conf (slice 1350):              1599.543995
                      #     <pfile>_rec_.par (PyHST, 2026-08-31): 1599.065161
                      # all on <pfile>_rec_.nx, whose <pfile>_rec_.info gives
                      #     Dim_1 = 3216   PixelSize = 0.015 um
                      # i.e. the 2048-wide binned detector padded to 3216
                      # (ht_<pfile>.m: ncrop = floor(n/bin_factor*pi/4)*2 with
                      # n = 4096, bin_factor = 2 -> 3216) and centred in it.
                      # nabu measures from (N-1)/2 = 1607.5, PyHST is 1-based
                      # from (N+1)/2 = 1608.5:
                      #     (1599.613741 - 1607.5) x 2 = -15.77 raw px  <- this
                      #     (1599.543995 - 1607.5) x 2 = -15.91
                      #     (1599.065161 - 1608.5) x 2 = -18.87
                      #
                      # The value here before was -19.22, measured locally.  It
                      # sits 0.35 px from the PyHST number, which is what
                      # validates the padded-centre arithmetic above -- the same
                      # 0.3 px agreement AtomiumS1 shows, where the frame is
                      # unpadded.  The remaining 3.5 px is Peter's own
                      # refinement between 2026-08-31 and 2026-09-07, not a
                      # convention error, and -15.77 is his latest.
                      #
                      # rotation_center_shift and the x column of cshifts_final
                      # go into the SAME slot (steps15.py, reader.py), so only
                      # the sum is defined and this has to be re-quoted whenever
                      # the shift files change.  It does NOT enter steps 3-4, so
                      # changing it costs only start_step=5.
                      # MUST match all three config_step6_bin*.conf.
paganin=60            # delta/beta ratio for multi-distance Paganin (step 5).
                      # Peter used delta_beta=20 for this sample at 17.1 keV in
                      # ht_<pfile>.m; the 2025 Y350a scans used 40-60 at 33 keV
                      # on stained tissue, which is a different contrast regime.
                      # MUST match paganin in all three config_step6_bin*.conf:
                      # step 5 writes /exchange/obj_init_re{paganin}_{bin} and
                      # step 6 reads that exact name.
rhapp_bin=2           # rhapp.mat is in the pixels of the 2x2-BINNED detector grid
                      # Peter's pipeline ran on (bin_factor=2 in ht_<pfile>.m),
                      # while every other shift source here is in raw detector
                      # pixels, so step 3 scales rhapp up by this before summing.
                      # 0 = derive it automatically: rhapp.mat stamps its own
                      # `pixelsize` (15.0000 nm here) and dividing by this scan's
                      # 7.5 nm voxel gives 2 exactly, with the driver's bin_factor
                      # only as a fallback.  Pinned to 2 explicitly so a run does
                      # not depend on either being readable; step 3 warns if the
                      # pinned value and the recorded pixel size disagree.
                      #
                      # MEASURED 2026-08-31, two independent ways:
                      #   * resample the four planes of one projection onto a
                      #     common object grid and cross-correlate ADJACENT
                      #     pairs (adjacent because 1-vs-4 is 1.57x apart in
                      #     magnification and the fringes no longer match).
                      #     Over 24 angles, the residual left after removing the
                      #     known random displacement is 1.79 / 1.83 / 1.98 x
                      #     the rhapp increment for pairs 1-2 / 2-3 / 3-4
                      #     (robust median; MAD 0.22 on the two well-conditioned
                      #     pairs), and the correlation peak sits at the x2
                      #     prediction rather than the x1 prediction in 69 of 72
                      #     angle-pairs.  This uses /exchange/pdata{k}_1, which
                      #     is unshifted, so no shift file enters the answer.
                      #   * step 6 at bin 2 with rho[pos] free walks the plane-2
                      #     positions from the input spacing out to 2.07x it
                      #     over 288 iterations and parks there, with planes 3
                      #     and 4 following in proportion to how far they have
                      #     to travel.
                      # Unscaled, this was invisible in the 2025 folders: their
                      # drivers leave bin_factor at 1 and their rhapp offsets are
                      # under 20 px.  This scan's reach 182 px.
correct3d_bin=2       # correct_correct3D.txt is in 2x2 BINNED detector px.
                      # Peter refitted it on 2026-09-07.  That drop first
                      # landed one level too deep, at
                      #     <pfile>_/<pfile>_/correct_correct3D.txt
                      # which step 3 would have read as zeros; it has since been
                      # copied up and outer and nested are byte-identical for
                      # every file step 3 reads.  esrf_meta.find_drop_file looks
                      # in both and says so, so a future deep drop is caught
                      # instead of silently zeroing the correction.
                      #
                      # 0 = derive the factor from <pfile>_rec_.info's PixelSize
                      # (15 nm / 7.5 nm = 2) instead of pinning it here.
                      #
                      # naburec/nabu_correct3D.conf runs nabu with binning = 1
                      # on <pfile>_rec_.nx, and <pfile>_rec_.info records
                      #     Dim_1 = 3216   PixelSize = 0.015 um
                      # against this scan's own 7.5 nm voxel -- so his fit grid
                      # is 2x2 binned and the file scales by 2.  ht_<pfile>.m
                      # sets bin_factor = 2, the same factor rhapp_bin already
                      # carries for rhapp.mat.
                      #
                      # The file is (4001, 2) for 4000 angles: his grid is
                      # 0..180 inclusive (TOMO_N 4000 x 0.045 deg = 180), so the
                      # last row is the repeat and step 3 drops it, with a log
                      # line.  Columns are nabu's (horizontal, vertical), which
                      # the [:ntheta, ::-1] read turns into our (y, x).
                      # Binned px, before the x2:
                      #     horizontal  mean +0.82  ptp 20.50
                      #     vertical    mean +0.00  ptp 12.34
ref_dist=1            # reference distance index for motion-shift baseline (step 3)
                      # 0-based, so this is PLANE 2 -- reference_plane=2 in
                      # Peter's driver, and correct_motion.txt does indeed live
                      # in <pfile>_2_/.
                      # reference_motion.mat states reference_plane = 2
                      # independently; step 3 and check_data_read.py both check
                      # this value against it.
log_level=INFO
